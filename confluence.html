    rbox([-DHW, DHW, FY, STA, ZS2, ZS1], R_SM, exf({0:1, 1:1, 3:1, 4:1}), {}, IN);

    /* 屋根の中央と庇。軒天の両辺は鰭との入隅 */
    rbox([-HW, HW, CY, RTY, ZFO, ZBO], R_BIG, exf({3:1, 5:1}), {}, EX);
    rbox([-HW, HW, CY, RTY, ZE, ZFO], R_BIG, exf({2:1, 3:1, 4:1}), {},
         function(f){ return f === YM ? IN : EX; });

    /* 部屋：内向きの丸い箱。奥（-z）は開き、岸側（+z）の面は入口を抜いて別に描く。z は ZFO まで延ばし低壁の裏へ差し込む */
    rbox([-HW, HW, FY, CY, ZFO, ZB], R_BIG, exf({0:1, 1:1, 2:1, 3:1, 5:2}), {}, IN, true);
    var r = R_BIG, rs = R_SM, nz = [0,0,-1];
    quadA([-HW + r, FY + r, ZB], [-DHW - rs, FY + r, ZB], [-DHW - rs, CY - r, ZB], [-HW + r, CY - r, ZB], nz, nz, nz, nz, IN);
    quadA([ DHW + rs, FY + r, ZB], [ HW - r, FY + r, ZB], [ HW - r, CY - r, ZB], [ DHW + rs, CY - r, ZB], nz, nz, nz, nz, IN);
    quadA([-DHW - rs, DTOP + rs, ZB], [ DHW + rs, DTOP + rs, ZB], [ DHW + rs, CY - r, ZB], [-DHW - rs, CY - r, ZB], nz, nz, nz, nz, IN);
  }

  /* ---------------- 面（腰高の板）と窪み ---------------- */
  function rectHit(dx, dz, ins){
    var tx = 1e9, tz = 1e9;
    if (dx >  1e-6) tx = ( PX - ins) / dx;
    if (dx < -1e-6) tx = (-PX + ins) / dx;
    if (dz >  1e-6) tz = ( PZ - ins - DIMZ) / dz;
    if (dz < -1e-6) tz = (-PZ + ins - DIMZ) / dz;
    return (tx < tz) ? tx : tz;
  }
  /* 窪み：縁で平らに接し、中心で深さ DIMD の滑らかな皿。u∈[0,1] */
  function bowlY(u){ var w = 1 - u * u; return PTOP - DIMD * w * w; }
  function bowlN(u, c, s){
    var dy = (4 * DIMD * u * (1 - u * u)) / DIMR;
    var L = Math.sqrt(1 + dy * dy);
    return [-dy * c / L, 1 / L, -dy * s / L];
  }
  function bowl(uMax, rings, yOff, mode){
    var i, k, a0, a1, u0, u1;
    for (i = 0; i < rings; i++){
      u0 = uMax * i / rings; u1 = uMax * (i + 1) / rings;
      for (k = 0; k < SEG; k++){
        a0 = k * 2 * Math.PI / SEG; a1 = (k + 1) * 2 * Math.PI / SEG;
        var c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        var p00 = [DIMR*u0*c0, bowlY(u0)+yOff, DIMZ + DIMR*u0*s0], p01 = [DIMR*u0*c1, bowlY(u0)+yOff, DIMZ + DIMR*u0*s1];
        var p10 = [DIMR*u1*c0, bowlY(u1)+yOff, DIMZ + DIMR*u1*s0], p11 = [DIMR*u1*c1, bowlY(u1)+yOff, DIMZ + DIMR*u1*s1];
        quadA(p00, p01, p11, p10, bowlN(u0,c0,s0), bowlN(u0,c1,s1), bowlN(u1,c1,s1), bowlN(u1,c0,s0), mode);
      }
    }
  }
  function panel(){
    rbox([-PED, PED, FY, PBOT, -PEDZ, PEDZ], R_SM, exf({0:1, 1:1, 4:1, 5:1}), {}, IN);
    rbox([-PX, PX, PBOT, PTOP, -PZ, PZ], R_SM, exf({0:1, 1:1, 2:1, 3:2, 4:1, 5:1}), {}, GL);
    var i, a0, a1, c0, s0, c1, s1, t0, t1, up = [0, 1, 0];
    for (i = 0; i < SEG; i++){
      a0 = i * 2 * Math.PI / SEG; a1 = (i + 1) * 2 * Math.PI / SEG;
      c0 = Math.cos(a0); s0 = Math.sin(a0); c1 = Math.cos(a1); s1 = Math.sin(a1);
      t0 = rectHit(c0, s0, R_SM); t1 = rectHit(c1, s1, R_SM);
      tri([DIMR * c0, PTOP, DIMZ + DIMR * s0], [t1 * c1, PTOP, DIMZ + t1 * s1], [t0 * c0, PTOP, DIMZ + t0 * s0], up, up, up, GL);
      tri([DIMR * c0, PTOP, DIMZ + DIMR * s0], [DIMR * c1, PTOP, DIMZ + DIMR * s1], [t1 * c1, PTOP, DIMZ + t1 * s1], up, up, up, GL);
    }
    bowl(1.0, 4, 0.0, GL);
  }

  /* ---------------- 空（契約 §5 を逐語で貼る。一字も変えない） ---------------- */
  var SKY = [
    'uniform vec3 uSunL; uniform vec3 uSunS;',
    'uniform vec3 uColL; uniform vec3 uColS; uniform vec3 uWarm;',
    '',
    'vec3 h53Sky(vec3 d){',
    '  float h  = clamp(d.y, -0.25, 1.0);',
    '  vec3  hi = vec3(0.055, 0.075, 0.115);',
    '  vec3  lo = vec3(0.620, 0.600, 0.660);',
    '  vec3  c  = mix(lo, hi, pow(clamp(h, 0.0, 1.0), 0.42));',
    '  float mL = max(dot(d, uSunL), 0.0);',
    '  float mS = max(dot(d, uSunS), 0.0);',
    '  float hz = exp(-abs(d.y) * 14.0);',
    '  c += uWarm * (hz * (0.36 + 0.95 * pow(mL, 6.0)));',
    '  c += uColL * (0.55 * pow(mL, 260.0) + 0.16 * pow(mL, 26.0));',
    '  c += uColS * (0.34 * pow(mS, 420.0) + 0.08 * pow(mS, 40.0));',
    '  return c;',
    '}'
  ].join('\n');

  /* ---------------- 面のむら（法線・粗さ・明度）を DataTexture で作る ---------------- */
  var _seed = 1;
  function rnd(s){ s = ((s % 233280) + 233280) % 233280; _seed = (s * 9301 + 49297) % 233280; return _seed / 233280; }
  function lat(ix, iy, per, sd){ ix = ((ix % per) + per) % per; iy = ((iy % per) + per) % per; return rnd(ix * 7919 + iy * 104729 + sd * 15485863); }
  function sm(t){ return t * t * (3 - 2 * t); }
  function vnoise(x, y, per, sd){
    var ix = Math.floor(x), iy = Math.floor(y), fx = sm(x - ix), fy = sm(y - iy);
    var a = lat(ix, iy, per, sd), b = lat(ix + 1, iy, per, sd), c = lat(ix, iy + 1, per, sd), d = lat(ix + 1, iy + 1, per, sd);
    return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
  }
  function field(u, v, sd){   /* u,v ∈ [0,1)。周期は 1 に揃え、継ぎ目なく繰り返す */
    var o, per = 6, amp = 1, sum = 0, nrm = 0;
    for (o = 0; o < 4; o++){ sum += amp * vnoise(u * per, v * per, per, sd + o); nrm += amp; per *= 2; amp *= 0.55; }
    return sum / nrm;
  }
  function makeNoiseTex(){
    var N = 256, data = new Uint8Array(N * N * 4), H = new Float32Array(N * N), R = new Float32Array(N * N);
    var i, j, k, hmin = 1, hmax = 0;
    for (j = 0; j < N; j++) for (i = 0; i < N; i++){ H[j * N + i] = field(i / N, j / N, 11); R[j * N + i] = field(i / N, j / N, 47); }
    for (k = 0; k < N * N; k++){ if (H[k] < hmin) hmin = H[k]; if (H[k] > hmax) hmax = H[k]; }
    var gmax = 0, gx, gy, ip, im, jp, jm;
    var GX = new Float32Array(N * N), GY = new Float32Array(N * N);
    for (j = 0; j < N; j++) for (i = 0; i < N; i++){
      ip = (i + 1) % N; im = (i + N - 1) % N; jp = (j + 1) % N; jm = (j + N - 1) % N;
      gx = (H[j * N + ip] - H[j * N + im]) * 2 + (H[jp * N + ip] - H[jp * N + im]) + (H[jm * N + ip] - H[jm * N + im]);
      gy = (H[jp * N + i] - H[jm * N + i]) * 2 + (H[jp * N + ip] - H[jm * N + ip]) + (H[jp * N + im] - H[jm * N + im]);
      GX[j * N + i] = gx; GY[j * N + i] = gy;
      if (Math.abs(gx) > gmax) gmax = Math.abs(gx); if (Math.abs(gy) > gmax) gmax = Math.abs(gy);
    }
    for (k = 0; k < N * N; k++){
      data[k * 4]     = Math.round(127.5 + 127 * (GX[k] / gmax));                 /* 法線 x（±1 に正規化） */
      data[k * 4 + 1] = Math.round(127.5 + 127 * (GY[k] / gmax));                 /* 法線 y */
      data[k * 4 + 2] = Math.round(255 * (R[k] - 0.0));                           /* 粗さのむら */
      data[k * 4 + 3] = Math.round(255 * ((H[k] - hmin) / (hmax - hmin)));        /* 高さ → 明度むら */
    }
    var tex = new T.DataTexture(data, N, N, T.RGBAFormat);
    tex.wrapS = T.RepeatWrapping; tex.wrapT = T.RepeatWrapping;
    tex.magFilter = T.LinearFilter; tex.minFilter = T.LinearMipmapLinearFilter;
    tex.generateMipmaps = true; tex.needsUpdate = true;
    return tex;
  }

  /* ---------------- 材質 ---------------- */
  function num(v){ return v.toFixed(4); }

  function vert(){
    return [
      'attribute vec4 aFlag;',
      'varying vec3 vN; varying vec3 vW; varying vec3 vL; varying vec4 vF;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vW = wp.xyz;',
      '  vL = position;',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vF = aFlag;',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');
  }

  function frag(){
    return [
      'precision highp float;',
      SKY,
      'uniform float uFogN; uniform float uFogF; uniform float uTime;',
      'uniform vec3 uPale; uniform vec3 uTurq;',
      'uniform sampler2D uNoise; uniform float uNormScale;',
      'varying vec3 vN; varying vec3 vW; varying vec3 vL; varying vec4 vF;',
      '#define ZOP (' + num(ZF) + ')',
      '#define YLO (' + num(PY) + ')',
      '#define YHI (' + num(CY) + ')',
      '#define XHW (' + num(HW) + ')',
      '#define YFL (' + num(FY) + ')',
      '#define ZBK (' + num(ZB) + ')',
      '#define ZEYE (-3.2000)',
      'float h53Fog(float dist){ return clamp((dist - uFogN) / (uFogF - uFogN), 0.0, 1.0); }',
      /* 室内へ日が届くか。開口（奥の低壁の上端から天井まで）を通るかで決める。
         判定は建屋の局所座標で行う。tr は日の視半径の tan（半影の幅） */
      'float openHit(vec3 p, vec3 s, float tr){',
      '  if (s.z > -0.001) return 0.0;',
      '  float t = (p.z - ZOP) / (-s.z);',
      '  if (t < 0.0) return 1.0;',
      '  float y = p.y + s.y * t;',
      '  float x = p.x + s.x * t;',
      '  float sr = max(tr * t, 0.02);',
      '  float a = smoothstep(YLO - sr, YLO + sr, y) * (1.0 - smoothstep(YHI - sr, YHI + sr, y));',
      '  float b = 1.0 - smoothstep(XHW - sr, XHW + sr, abs(x));',
      '  return a * b;',
      '}',
      'void main(){',
      '  vec3 n0 = normalize(vN);',
      '  vec3 V = normalize(cameraPosition - vW);',
      /* 面のむら：実寸 1.2 m で貼る三面マッピング。法線は 0.03、粗さ ±0.05、明度 ±3% */
      /* 三面マッピングを法線の重みで混ぜる（丸い稜で模様が途切れない） */
      '  vec3 aw = pow(abs(n0), vec3(4.0)); aw /= (aw.x + aw.y + aw.z);',
      '  vec4 nmx = texture2D(uNoise, vL.zy / 1.2);',
      '  vec4 nmy = texture2D(uNoise, vL.xz / 1.2);',
      '  vec4 nmz = texture2D(uNoise, vL.xy / 1.2);',
      '  vec4 nm = nmx * aw.x + nmy * aw.y + nmz * aw.z;',
      '  vec3 dnv = vec3(0.0);',
      '  dnv += (vec3(0.0, nmx.y, nmx.x) * 2.0 - vec3(0.0, 1.0, 1.0)) * aw.x;',
      '  dnv += (vec3(nmy.x, 0.0, nmy.y) * 2.0 - vec3(1.0, 0.0, 1.0)) * aw.y;',
      '  dnv += (vec3(nmz.x, nmz.y, 0.0) * 2.0 - vec3(1.0, 1.0, 0.0)) * aw.z;',
      '  vec3 n = normalize(n0 + dnv * uNormScale);',
      '  float plinth = step(1.5, vF.w);',
      '  float glass = step(0.5, vF.w) * (1.0 - plinth);',
      '  float rough = mix(0.60, 0.25, glass) + plinth * 0.10 + (nm.z - 0.5) * 0.10;',
      '  vec3 alb = uPale * (1.0 + (nm.w - 0.5) * 0.10);',
      /* 水位痕。水際に近い高さだけ色が沈み、上がった高さの分が印として残る */
      /* 水位痕（原文「水際に近い高さだけ色が沈んでいる」）。外面の沖側 z<0 と床版の側面だけ。
         y 0.0〜0.62 で albedo ×0.72・粗さ −0.15。上端は 0.06 m でぼかす */
      '  if (vF.y > 0.5 && vL.z < 0.0){',
      '    float st = 1.0 - smoothstep(0.59, 0.65, vW.y);',
      '    alb *= mix(1.0, 0.72, st);',
      '    rough -= 0.15 * st;',
      '  }',
      '  float apf = vF.x;',
      '  float shL = 1.0, shS = 1.0;',
      '  if (vF.z > 0.5){',
      '    shL = openHit(vL, uSunL, 0.04193); shS = openHit(vL, uSunS, 0.02619);',
      /* 入隅の陰り。継ぎ目も汚れも作らないので、陰りだけで面を立たせる */
      '    float wv = 1.0 - abs(n0.y);',
      '    float wx = 1.0 - abs(n0.x);',
      '    float wz = 1.0 - abs(n0.z);',
      '    float ao = 1.0;',
      '    ao *= mix(1.0, 0.58 + 0.42 * smoothstep(0.0, 1.00, vL.y - YFL), wv);',
      '    ao *= mix(1.0, 0.76 + 0.24 * smoothstep(0.0, 1.20, YHI - vL.y), wv);',
      '    ao *= mix(1.0, 0.72 + 0.28 * smoothstep(0.0, 1.30, XHW - abs(vL.x)), wx);',
      '    ao *= mix(1.0, 0.82 + 0.18 * smoothstep(0.0, 1.40, ZBK - vL.z), wz);',
      '    apf *= ao;',
      '  }',
      /* 周囲光。h53Sky の半球積分（コサイン加重）から出した値 ×1.3（albedo を 0.60 に揃えたぶんを照明側で戻す） */
      '  float up = n.y * 0.5 + 0.5;',
      '  vec3 irr = mix(vec3(0.429, 0.403, 0.436), vec3(0.343, 0.329, 0.374), up);',
      '  irr += vec3(0.215, 0.203, 0.218) * (1.0 - abs(n.y));',
      '  irr += uWarm * (0.045 * pow(max(-n.z, 0.0), 1.6) * exp(-abs(n.y) * 2.2));',
      '  irr *= apf;',
      /* 水面からの照り返し（契約 c2 §3）。下向きの面へ */
      '  float dn = smoothstep(0.0, 0.4, -n.y);',
      '  if (dn > 0.0){',
      '    vec3 wb = h53Sky(vec3(n.x, 0.02, n.z)) * 0.06;',
      /* 光の道の照り返し（軒天の見せ場）。周期 3.1 s、明るさ ±30%・位置 ±0.3 m */
      '    float ph = 6.28318 * uTime / 3.1;',
      '    float sw = sin(ph);',
      '    float br = 1.0 + 0.30 * sin(ph + 0.9);',
      '    float dz = max(ZEYE - vL.z, 0.0);',
      '    float cxL = 0.30 * sw;',
      '    float cxS = dz * (uSunS.x / max(-uSunS.z, 0.01)) + 0.30 * sin(ph + 1.7);',
      '    float ql = (vL.x - cxL) / 0.90; float qs = (vL.x - cxS) / 0.60;',
      '    float bl = exp(-ql * ql);',
      '    float bs = exp(-qs * qs);',
      '    float reach = smoothstep(0.30, 0.95, vF.x);',
      '    wb += (uColL * bl + uColS * bs) * (0.25 * br * reach);',
      '    irr += wb * dn * mix(1.0, apf, 0.5);',
      '  }',
      '  irr += uColL * (max(dot(n, uSunL), 0.0) * 0.30 * shL);',
      '  irr += uColS * (max(dot(n, uSunS), 0.0) * 0.10 * shS);',
      '  vec3 col = alb * irr;',
      '  col += alb * (0.040 * apf + 0.012);',
      /* 鏡面：二つの日のハイライトと、空の映り込み（h53Sky(reflect)）。板は硝子感（clearcoat 0.4） */
      '  float ndv = max(dot(n, V), 0.0);',
      '  float F0 = 0.04;',
      '  float Fr = F0 + (1.0 - F0) * pow(1.0 - ndv, 5.0);',
      '  float sp = 2.0 / (rough * rough) - 2.0;',
      '  vec3 HL = normalize(uSunL + V); vec3 HS = normalize(uSunS + V);',
      '  float specL = pow(max(dot(n, HL), 0.0), sp) * (sp + 2.0) * 0.125 * shL;',
      '  float specS = pow(max(dot(n, HS), 0.0), sp) * (sp + 2.0) * 0.125 * shS;',
      '  col += (uColL * specL + uColS * specS) * Fr * (1.0 - glass * 0.5);',
      '  vec3 R = reflect(-V, n);',
      '  vec3 skyR = min(h53Sky(R), vec3(1.5));',
      '  col += skyR * Fr * (0.50 * (1.0 - rough)) * mix(1.0, apf, 0.6);',
      '  if (glass > 0.5){',
      '    float cc = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);',
      '    float spc = pow(max(dot(n, HL), 0.0), 180.0) * 0.6 * shL;',
      '    col += (skyR * 0.30 + uColL * spc) * cc * 0.40;',
      '  }',
      /* 縁光（契約 c2 §4）。日の側の面だけ。K 0.03 */
      '  float rim = pow(1.0 - ndv, 3.0);',
      '  col += (uColL * max(dot(n, uSunL), 0.0) + uColS * max(dot(n, uSunS), 0.0)) * rim * 0.03;',
      /* 窪みの弱い点り。時間を持たない */
      '  float d = length(vL - vec3(0.0, ' + num(PTOP - DIMD) + ', ' + num(DIMZ) + '));',
      '  col += uTurq * (0.032 * exp(-d * 7.0) * max(n.y, 0.0));',
      /* 霧。溶けた先は水平線の空そのもの */
      '  vec3 vd = normalize(vW - cameraPosition);',
      '  col = mix(col, h53Sky(vd), h53Fog(length(vW - cameraPosition)));',
      '  gl_FragColor = vec4(col, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <encodings_fragment>',
      '}'
    ].join('\n');
  }

  function dimVert(){
    return [
      'varying vec3 vW; varying vec2 vUv;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vW = wp.xyz;',
      '  vUv = vec2(position.x, position.z - ' + num(DIMZ) + ') / ' + num(DIMR) + ';',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');
  }

  function dimFrag(){
    return [
      'precision highp float;',
      SKY,
      'uniform vec3 uPale; uniform vec3 uTurq;',
      'uniform float uFogN; uniform float uFogF;',
      'varying vec3 vW; varying vec2 vUv;',
      'void main(){',
      '  float r = clamp(length(vUv), 0.0, 1.0);',
      '  float f = 1.0 - smoothstep(0.55, 1.0, r);',
      '  vec3 col = uPale * 0.030 + uTurq * (0.050 + 0.105 * f);',
      '  vec3 vd = normalize(vW - cameraPosition);',
      '  float fg = clamp((length(vW - cameraPosition) - uFogN) / (uFogF - uFogN), 0.0, 1.0);',
      '  col = mix(col, h53Sky(vd), fg);',
      '  gl_FragColor = vec4(col, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <encodings_fragment>',
      '}'
    ].join('\n');
  }

  /* ---------------- 組み立て ---------------- */
  var built = false;

  function build(){
    if (built) return; built = true;

    P.length = 0; N.length = 0; F.length = 0;
    shell();
    panel();

    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(P), 3));
    g.setAttribute('normal',   new T.BufferAttribute(new Float32Array(N), 3));
    g.setAttribute('aFlag',    new T.BufferAttribute(new Float32Array(F), 4));
    g.computeBoundingSphere();

    var pale = new T.Color(cv('PALE', 0xf2dbe9));
    var turq = new T.Color(cv('TURQ', 0x00ddc8));
    /* 淡白色の albedo は 0.58。色相は PALE のまま、明るさだけ揃える */
    var lum = 0.2126 * pale.r + 0.7152 * pale.g + 0.0722 * pale.b;
    var alb = pale.clone().multiplyScalar(0.58 / lum);
    var noise = makeNoiseTex();

    var mat = new T.ShaderMaterial({
      uniforms: {
        uSunL: U.uSunL, uSunS: U.uSunS,

      if (aF <= 0.004) { continue; }

      var v0 = pos.length / 3;
      for (q = 0; q < US.length; q++){
        var uu = US[q];
        var mid = (yT[q] + yB[q]) * 0.5;
        var hh  = (yT[q] - yB[q]) * 0.5;
        var pad = hh + 0.55 * pxw;
        var px = CX + rx * (R * uu), pz = CZ + rz * (R * uu);
        pos.push(px, mid - pad, pz);
        cen.push(CX, H, CZ); uv.push(uu, -1.0); fad.push(aF); cor.push(fv, fu);
        pos.push(px, mid + pad, pz);
        cen.push(CX, H, CZ); uv.push(uu,  1.0); fad.push(aF); cor.push(fv, fu);
      }
      for (q = 0; q < US.length - 1; q++){
        var a = v0 + q * 2, b = a + 1, c = a + 2, dd = a + 3;
        idx.push(a, c, b,  b, c, dd);
      }
    }

    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('aCenter',  new T.Float32BufferAttribute(cen, 3));
    g.setAttribute('aUV',      new T.Float32BufferAttribute(uv, 2));
    g.setAttribute('aFade',    new T.Float32BufferAttribute(fad, 1));
    g.setAttribute('aFeat',    new T.Float32BufferAttribute(cor, 2));
    g.setIndex(idx);
    g.computeBoundingSphere();

    /* 二・四秒で一巡。遠くても速さは変わらない（DISC 周期をそのまま使う） */
    var wSpin = TAU / num(window.CF.C && window.CF.C.DISC, 2.4);

    var vs = [
      'attribute vec3 aCenter; attribute vec2 aUV;',
      'attribute float aFade; attribute vec2 aFeat;',
      'uniform float uTime; uniform float uSpin;',
      'varying vec3 vW; varying vec2 vUV;',
      'varying float vFade; varying vec2 vFeat; varying float vTurn;',
      'void main(){',
      '  float ph = fract(sin(dot(aCenter.xz, vec2(12.9898, 78.233))) * 43758.5453) * 6.283185;',
      '  float s = uSpin * uTime + ph;',
      /* 円盤は真円ではない。一巡ぶんの幅と位置のゆらぎが「回っている」の全部 */
      '  vec3 dir = normalize(vec3(aCenter.x, 0.0, aCenter.z - 2.0));',
      '  vec3 rgt = vec3(-dir.z, 0.0, dir.x);',
      '  vec3 rel = position - aCenter;',
      '  float w = 1.0 + 0.028 * cos(s);',
      '  vec3 p = aCenter + vec3(rel.x * w, rel.y, rel.z * w) + rgt * (0.34 * sin(s));',
      '  vW = p; vUV = aUV; vFade = aFade; vFeat = aFeat; vTurn = cos(s);',
      '  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);',
      '}'
    ].join('\n');

    var fs = [
      OUT_GLSL,
      SKY_GLSL,
      FOG_GLSL,
      'varying vec3 vW; varying vec2 vUV;',
      'varying float vFade; varying vec2 vFeat; varying float vTurn;',
      'void main(){',
      '  float au = 1.0 - smoothstep(vFeat.y, 1.0, abs(vUV.x));',
      '  float av = 1.0 - smoothstep(vFeat.x, 1.0, abs(vUV.y));',
      '  float a = vFade * au * av;',
      '  if (a <= 0.004) discard;',
      /* 厚みも皿も読めない。下は影、上の縁だけ水平線の明るさを掠める */
      '  float up = clamp(vUV.y * 0.5 + 0.5, 0.0, 1.0);',
      '  vec3 c = mix(vec3(0.048, 0.045, 0.060), vec3(0.132, 0.120, 0.146), up);',
      '  c *= 0.93 + 0.07 * vTurn;',
      '  c = h53Melt(c, vW);',
      '  gl_FragColor = vec4(c, a);'
    ].concat(OUT_TAIL).concat([
      '}'
    ]).join('\n');

    var m = new T.ShaderMaterial({
      uniforms: (function(){
        var o = skyUniforms(U);
        o.uTime = U.uTime;
        o.uSpin = { value: wSpin };
        return o;
      })(),
      vertexShader: vs,
      fragmentShader: fs,
      transparent: true,
      depthWrite: false,
      side: T.DoubleSide
    });

    var mesh = new T.Mesh(g, m);
    mesh.frustumCulled = false;
    mesh.renderOrder = 4;
    mesh.name = 'far_discs';
    scene.add(mesh);
    return { mesh: mesh, tris: idx.length / 3, verts: pos.length / 3,
             count: (idx.length / 3) / ((US.length - 1) * 2), cells: cells.length,
             dropped: dropped, suns: suns };
  }

  /* ========================================================= */

  function build(){
    if (built) { return; }
    built = true;

    var CF = window.CF;
    var U = CF.U, C = CF.C || {};
    var SHORE_Z = num(C.SHORE_Z, -1400.0);
    var R  = num(C.DISC_R,  12.0);
    var TH = num(C.DISC_TH,  1.2);
    var H  = num(C.DISC_H,  12.0);
    var P  = num(C.DISC_PITCH, 96.0);

    var s = buildShore(CF.scene, U, SHORE_Z);
    var d = buildDiscs(CF.scene, U, R, TH, H, P);
    shoreMesh = s.mesh; discMesh = d.mesh;

    window.CF.parts.far.stats = {
      shoreTris: s.tris, shoreVerts: s.verts,
      discTris: d.tris, discVerts: d.verts, discCount: d.count, discCells: d.cells,
      discDropped: d.dropped,
      tris: s.tris + d.tris, calls: 2
    };
  }

  /* 動きは全て頂点段で uTime から出す。ここでする事はない */
  function tick(t){ }

  window.CF.parts.far = { build: build, tick: tick, name: 'far' };

})();
/* ===== part post (11170 B) ===== */
/* ASSET 19 The Confluence — part post  (half-resolution bloom / split toning / vignette)
 *
 * host calls   CF.parts.post.build()            once, after the renderer exists
 *              CF.parts.post.resize(w, h)       on resize (real size is taken from the drawing buffer)
 *              CF.parts.post.render(scene, cam) every frame, instead of renderer.render(scene, cam)
 *
 * pipeline (CONTRACT-c2 §2)
 *   1 scene            -> rtFull   (screen size, RGBA, depth)   parts already tone-mapped + sRGB
 *   2 rtFull  thr 0.80 -> rtHalfA  (1/2)
 *   3 rtHalfA blur H   -> rtHalfB ; blur V -> rtHalfA           (9 tap gaussian, separable)
 *     rtHalfA blur H   -> rtQuartA(1/4); blur V -> rtQuartB
 *   4 out = scene + half*0.30 + quarter*0.22
 *   5 split toning (tiny), shoulder 1.03, saturation untouched
 *   6 vignette 0.18, circular, squared
 *   7 straight to the screen.  No tone mapping, no re-encoding.
 *
 * Draw calls added per frame: 6 (threshold, blurH, blurV, blurH4, blurV4, composite).
 *
 * Note on encodings.  The parts end their shaders with <encodings_fragment>, and in r128 that
 * chunk follows the encoding of the *current render target's texture*, not renderer.outputEncoding.
 * So rtFull.texture.encoding is set to sRGBEncoding: the parts then write exactly the same sRGB
 * values they write to the screen today.  r128 never uses a GL sRGB internal format for RGBA,
 * so texture2D() in the post shaders returns those bytes untouched ("値をそのまま").
 * The intermediate targets are LinearEncoding (plain storage).  The final quad material has
 * toneMapped:false and no encoding chunk, so nothing is mapped or encoded twice.
 */
(function () {
  'use strict';

  var CF = window.CF, T = CF.T;

  var renderer = null;
  var rtFull = null, rtHalfA = null, rtHalfB = null, rtQuartA = null, rtQuartB = null;
  var quadScene = null, quadCam = null, quad = null;
  var matThr = null, matBlur = null, matComp = null;
  var bufW = 0, bufH = 0;
  var sizeV = null;
  var built = false;

  /* ---------- tunables (contract values) ---------- */
  var THRESHOLD   = 0.80;    /* sRGB value, after the parts' tone mapping */
  var KNEE        = 0.06;    /* soft knee below the threshold */
  var GAIN        = 1.0;     /* multiplier on the amount above the threshold (1.0 = plain subtract) */
  var W_HALF      = 0.30;
  var W_QUARTER   = 0.22;
  var TONE_SHADOW = [0.000, 0.010, 0.014];
  var TONE_LIGHT  = [0.012, 0.004, 0.000];
  var SHOULDER    = 1.03;
  var VIGNETTE    = 0.18;
  var SIGMA       = 2.2;     /* gaussian sigma in taps (9 taps = -4..+4) */

  /* ---------- gaussian weights ---------- */
  function gaussWeights(sigma) {
    var w = [], s = 0, i;
    for (i = 0; i <= 4; i++) { w[i] = Math.exp(-(i * i) / (2 * sigma * sigma)); }
    for (i = -4; i <= 4; i++) { s += w[Math.abs(i)]; }
    for (i = 0; i <= 4; i++) { w[i] /= s; }
    return w;
  }

  /* ---------- shaders ---------- */
  var VS = [
    'varying vec2 vUv;',
    'void main(){',
    '  vUv = uv;',
    '  gl_Position = vec4(position.xy, 0.0, 1.0);',
    '}'
  ].join('\n');

  var FS_THR = [
    'precision highp float;',
    'uniform sampler2D uTex;',
    'uniform float uThr;',
    'uniform float uKnee;',
    'uniform float uGain;',
    'varying vec2 vUv;',
    'void main(){',
    '  vec3 c = texture2D(uTex, vUv).rgb;',
    '  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));',
    /* soft knee: quadratic ramp from (thr-knee) to (thr+knee), linear (l - thr) above.
       uGain scales the amount above the threshold. */
    '  float rq = clamp(l - (uThr - uKnee), 0.0, 2.0 * uKnee);',
    '  rq = rq * rq * (0.25 / max(uKnee, 1e-4));',
    '  float r = max(rq, l - uThr);',
    '  float k = r / max(l, 1e-3) * uGain;',
    '  gl_FragColor = vec4(c * k, 1.0);',
    '}'
  ].join('\n');

  var FS_BLUR = [
    'precision highp float;',
    'uniform sampler2D uTex;',
    'uniform vec2 uDir;',       /* one tap in texture space (already divided by source size) */
    'uniform float uW[5];',
    'varying vec2 vUv;',
    'void main(){',
    '  vec3 c = texture2D(uTex, vUv).rgb * uW[0];',
    '  c += (texture2D(uTex, vUv + uDir * 1.0).rgb + texture2D(uTex, vUv - uDir * 1.0).rgb) * uW[1];',
    '  c += (texture2D(uTex, vUv + uDir * 2.0).rgb + texture2D(uTex, vUv - uDir * 2.0).rgb) * uW[2];',
    '  c += (texture2D(uTex, vUv + uDir * 3.0).rgb + texture2D(uTex, vUv - uDir * 3.0).rgb) * uW[3];',
    '  c += (texture2D(uTex, vUv + uDir * 4.0).rgb + texture2D(uTex, vUv - uDir * 4.0).rgb) * uW[4];',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  var FS_COMP = [
    'precision highp float;',
    'uniform sampler2D uScene;',
    'uniform sampler2D uHalf;',
    'uniform sampler2D uQuart;',
    'uniform float uWHalf;',
    'uniform float uWQuart;',
    'uniform vec3 uShadow;',
    'uniform vec3 uLight;',
    'uniform float uShoulder;',
    'uniform float uVig;',
    'uniform vec2 uAspect;',    /* (w/h, 1) normalised so that the corner is at r = 1 */
    'varying vec2 vUv;',
    'void main(){',
    '  vec3 c = texture2D(uScene, vUv).rgb;',
    '  c += texture2D(uHalf, vUv).rgb * uWHalf;',
    '  c += texture2D(uQuart, vUv).rgb * uWQuart;',
    /* 5  split toning, tiny.  weight by luminance so that only shadows / only lights are tinted */
    '  float l = clamp(dot(c, vec3(0.2126, 0.7152, 0.0722)), 0.0, 1.0);',
    '  c += uShadow * (1.0 - l) + uLight * l;',
    /* shoulder only: a little contrast above mid grey, faded in from 0.45 to 0.85 */
    '  float sh = smoothstep(0.45, 0.85, l);',
    '  c = mix(c, 0.5 + (c - 0.5) * uShoulder, sh);',
    /* 6  vignette, circular in pixel space, squared fall-off */
    '  vec2 p = (vUv - 0.5) * 2.0 * uAspect;',
    '  float r2 = dot(p, p);',
    '  c *= 1.0 - uVig * r2;',
    '  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);',
    '}'
  ].join('\n');

  /* ---------- render targets ---------- */
  function makeRT(w, h, depth, enc) {
    var rt = new T.WebGLRenderTarget(w, h, {
      minFilter: T.LinearFilter,
      magFilter: T.LinearFilter,
      format: T.RGBAFormat,
      type: T.UnsignedByteType,
      depthBuffer: depth,
      stencilBuffer: false
    });
    rt.texture.encoding = enc;
    rt.texture.generateMipmaps = false;
    return rt;
  }

  function disposeRTs() {
    if (rtFull)   rtFull.dispose();
    if (rtHalfA)  rtHalfA.dispose();
    if (rtHalfB)  rtHalfB.dispose();
    if (rtQuartA) rtQuartA.dispose();
    if (rtQuartB) rtQuartB.dispose();
    rtFull = rtHalfA = rtHalfB = rtQuartA = rtQuartB = null;
  }

  function allocRTs(w, h) {
    disposeRTs();
    var hw = Math.max(1, Math.floor(w / 2)), hh = Math.max(1, Math.floor(h / 2));
    var qw = Math.max(1, Math.floor(w / 4)), qh = Math.max(1, Math.floor(h / 4));
    rtFull   = makeRT(w, h, true, T.sRGBEncoding);
    rtHalfA  = makeRT(hw, hh, false, T.LinearEncoding);
    rtHalfB  = makeRT(hw, hh, false, T.LinearEncoding);
    rtQuartA = makeRT(qw, qh, false, T.LinearEncoding);
    rtQuartB = makeRT(qw, qh, false, T.LinearEncoding);
    bufW = w; bufH = h;
    matThr.uniforms.uTex.value = rtFull.texture;
    matComp.uniforms.uScene.value = rtFull.texture;
    matComp.uniforms.uHalf.value = rtHalfA.texture;
    matComp.uniforms.uQuart.value = rtQuartB.texture;
    var a = w / h, n = Math.sqrt(a * a + 1.0);
    matComp.uniforms.uAspect.value.set(a / n, 1.0 / n);
  }

  function ensureSize() {
    if (!sizeV) sizeV = new T.Vector2();
    renderer.getDrawingBufferSize(sizeV);
    var w = Math.max(1, Math.floor(sizeV.x)), h = Math.max(1, Math.floor(sizeV.y));
    if (w !== bufW || h !== bufH || !rtFull) allocRTs(w, h);
  }

  /* ---------- build ---------- */
  function build() {
    if (built) return;
    renderer = CF.renderer;

    var wts = gaussWeights(SIGMA);

    matThr = new T.ShaderMaterial({
      vertexShader: VS, fragmentShader: FS_THR,
      uniforms: { uTex: { value: null }, uThr: { value: THRESHOLD }, uKnee: { value: KNEE }, uGain: { value: GAIN } },
      depthTest: false, depthWrite: false, toneMapped: false
    });
    matBlur = new T.ShaderMaterial({
      vertexShader: VS, fragmentShader: FS_BLUR,
      uniforms: { uTex: { value: null }, uDir: { value: new T.Vector2(0, 0) }, uW: { value: wts } },
      depthTest: false, depthWrite: false, toneMapped: false
    });
    matComp = new T.ShaderMaterial({
      vertexShader: VS, fragmentShader: FS_COMP,
      uniforms: {
        uScene: { value: null }, uHalf: { value: null }, uQuart: { value: null },
        uWHalf: { value: W_HALF }, uWQuart: { value: W_QUARTER },
        uShadow: { value: new T.Vector3(TONE_SHADOW[0], TONE_SHADOW[1], TONE_SHADOW[2]) },
        uLight:  { value: new T.Vector3(TONE_LIGHT[0], TONE_LIGHT[1], TONE_LIGHT[2]) },
        uShoulder: { value: SHOULDER },
        uVig: { value: VIGNETTE },
        uAspect: { value: new T.Vector2(1, 1) }
      },
      depthTest: false, depthWrite: false, toneMapped: false
    });

    quadCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    quadScene = new T.Scene();
    quad = new T.Mesh(new T.PlaneGeometry(2, 2), matComp);
    quad.frustumCulled = false;
    quadScene.add(quad);

    built = true;
    ensureSize();
  }

  /* ---------- resize (real size comes from the drawing buffer) ---------- */
  function resize(/* w, h */) {
    if (!built) return;
    ensureSize();
  }

  /* ---------- one full-screen pass ---------- */
  function pass(mat, target) {
    quad.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(quadScene, quadCam);
  }

  /* ---------- render ---------- */
  function render(scene, camera) {
    if (!built) build();
    ensureSize();

    var oldAutoClear = renderer.autoClear;
    var oldTarget = renderer.getRenderTarget();

    /* 1  scene -> rtFull.  The parts see the same encoding as the screen (see note at top). */
    renderer.autoClear = true;
    renderer.setRenderTarget(rtFull);
    renderer.render(scene, camera);

    /* 2  threshold -> half */
    pass(matThr, rtHalfA);

    /* 3  blur half: H  A->B ,  V  B->A */
    var hw = rtHalfA.width, hh = rtHalfA.height;
    matBlur.uniforms.uTex.value = rtHalfA.texture;
    matBlur.uniforms.uDir.value.set(1.0 / hw, 0.0);
    pass(matBlur, rtHalfB);
    matBlur.uniforms.uTex.value = rtHalfB.texture;
    matBlur.uniforms.uDir.value.set(0.0, 1.0 / hh);
    pass(matBlur, rtHalfA);

    /*    blur quarter, sourced from the blurred half: H  halfA->quartA ,  V  quartA->quartB */
    var qw = rtQuartA.width, qh = rtQuartA.height;
    matBlur.uniforms.uTex.value = rtHalfA.texture;
    matBlur.uniforms.uDir.value.set(1.0 / qw, 0.0);   /* taps spaced by one quarter-res texel */
    pass(matBlur, rtQuartA);
    matBlur.uniforms.uTex.value = rtQuartA.texture;
    matBlur.uniforms.uDir.value.set(0.0, 1.0 / qh);
    pass(matBlur, rtQuartB);

    /* 4-7  composite to the screen */
    pass(matComp, null);

    renderer.setRenderTarget(oldTarget);
    renderer.autoClear = oldAutoClear;
  }

  window.CF.parts.post = {
    build: build,
    render: render,
    resize: resize,
    name: 'post',
    /* for measurement only */
    _targets: function () { return { full: rtFull, half: rtHalfA, quarter: rtQuartB }; }
  };
})();
</script>
<script>CF.boot();</script>
