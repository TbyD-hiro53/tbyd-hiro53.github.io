<script>
(function(){
  // ---- h!ro53 index return button v2 ----
  // v1の失敗：(1) CSSの静的走査では全幅バーや左上HUDを検出できず重なった
  //           (2) 作品側のハンドラへイベントが渡り click が成立しない場合があった
  // v2：実行時に他要素の矩形を測って空いた隅へ置く。遷移は明示ハンドラで行う。
  var PAD = 12;
  var CSS = '#h53idx{position:fixed;z-index:2147483600;display:inline-flex;align-items:center;'
    + 'gap:7px;font:9px/1 ui-monospace,"SF Mono",Menlo,"Courier New",monospace;'
    + 'letter-spacing:.2em;text-transform:uppercase;text-decoration:none;'
    + 'color:rgba(214,224,232,.92);background:rgba(6,9,14,.82);'
    + 'border:1px solid rgba(127,230,240,.42);border-radius:2px;padding:9px 12px;'
    + 'pointer-events:auto;cursor:pointer;box-shadow:0 1px 10px rgba(0,0,0,.55);'
    + '-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);'
    + '-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;'
    + '-webkit-user-select:none;user-select:none;touch-action:manipulation}'
    + '#h53idx:active{color:#fff;border-color:rgba(255,95,200,.75);background:rgba(10,14,20,.96)}'
    + '#h53idx b{font-weight:400;opacity:.55}';

  var st = document.createElement('style');
  st.id = 'h53idxcss';
  st.appendChild(document.createTextNode(CSS));
  (document.head || document.documentElement).appendChild(st);

  var A = document.createElement('a');
  A.id = 'h53idx';
  A.setAttribute('aria-label', 'registry');
  A.innerHTML = '<b>&#8592;</b>index';

  function url(){
    try { return new URL('index.html', location.href).href; }
    catch (e) { return 'index.html'; }
  }
  A.href = url();

  // 遷移：click が潰される環境でも touchend で確実に飛ばす
  var fired = 0;
  function go(e){
    var now = Date.now();
    if (now - fired < 700) { if (e && e.preventDefault) e.preventDefault(); return false; }
    fired = now;
    if (e){ if (e.preventDefault) e.preventDefault(); if (e.stopPropagation) e.stopPropagation(); }
    var u = url();
    try { location.assign(u); } catch (err) { location.href = u; }
    return false;
  }
  function eat(e){ if (e && e.stopPropagation) e.stopPropagation(); }
  A.addEventListener('click', go, false);
  try { A.addEventListener('touchend', go, { passive: false }); }
  catch (e) { A.addEventListener('touchend', go, false); }
  try { A.addEventListener('touchstart', eat, { passive: true }); }
  catch (e) { A.addEventListener('touchstart', eat, false); }
  A.addEventListener('pointerdown', eat, false);
  A.addEventListener('mousedown', eat, false);

  function attach(){
    if (document.body && A.parentNode !== document.body) document.body.appendChild(A);
  }
  attach();

  // セーフエリアの実寸を測る
  var safe = { t: 0, r: 0, b: 0, l: 0 };
  function measureSafe(){
    if (!document.body) return;
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'
      + 'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);'
      + 'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
    document.body.appendChild(p);
    var cs = window.getComputedStyle(p);
    safe.t = parseFloat(cs.paddingTop) || 0;
    safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0;
    safe.l = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(p);
  }

  // 画面上で実際に「何かが描かれている」要素の矩形を集める
  function occupied(){
    var out = [], i, j, el, cs, r, ch, ink, bg;
    if (!document.body) return out;
    var all = document.body.querySelectorAll('*');
    for (i = 0; i < all.length; i++){
      el = all[i];
      if (el === A || el === st) continue;
      var tn = el.tagName;
      if (tn === 'CANVAS' || tn === 'SCRIPT' || tn === 'STYLE' || tn === 'LINK') continue;
      cs = window.getComputedStyle(el);
      if (!cs || cs.display === 'none' || cs.visibility === 'hidden') continue;
      if ((parseFloat(cs.opacity) || 1) < 0.06) continue;
      r = el.getBoundingClientRect();
      if (r.width < 6 || r.height < 6) continue;
      if (r.right < 0 || r.bottom < 0 || r.left > innerWidth || r.top > innerHeight) continue;
      // 全画面の器は避けたい対象ではない
      if (r.width > innerWidth * 0.94 && r.height > innerHeight * 0.90) continue;
      ink = false;
      ch = el.childNodes;
      for (j = 0; j < ch.length; j++){
        if (ch[j].nodeType === 3 && ch[j].nodeValue && ch[j].nodeValue.replace(/\s+/g,'')) { ink = true; break; }
      }
      if (!ink){
        bg = cs.backgroundColor || '';
        if (bg && bg.indexOf('rgba(0, 0, 0, 0)') < 0 && bg !== 'transparent') ink = true;
        if (!ink && (parseFloat(cs.borderTopWidth) || 0) > 0) ink = true;
        if (!ink && (parseFloat(cs.borderBottomWidth) || 0) > 0) ink = true;
        if (!ink && tn === 'IMG') ink = true;
      }
      if (!ink) continue;
      out.push(r);
    }
    return out;
  }

  function overlapArea(x, y, w, h, rs){
    var s = 0, i, r, ow, oh;
    for (i = 0; i < rs.length; i++){
      r = rs[i];
      ow = Math.min(x + w, r.right) - Math.max(x, r.left);
      oh = Math.min(y + h, r.bottom) - Math.max(y, r.top);
      if (ow > 0 && oh > 0) s += ow * oh;
    }
    return s;
  }

  function place(){
    attach();
    if (!document.body) return;
    measureSafe();
    A.style.left = ''; A.style.right = ''; A.style.top = ''; A.style.bottom = '';
    A.style.top = '-999px'; A.style.left = '0px';
    var w = A.offsetWidth || 76, h = A.offsetHeight || 30;
    var rs = occupied();
    // 隅は 右上 → 左上 → 右下 → 左下 の順に選好。各隅で縦に4段まで逃がす
    var best = null, corner, step, x, y, s, pref;
    for (corner = 0; corner < 4; corner++){
      for (step = 0; step < 4; step++){
        x = (corner % 2 === 0) ? (innerWidth - PAD - safe.r - w) : (PAD + safe.l);
        y = (corner < 2) ? (PAD + safe.t + step * (h + 8))
                         : (innerHeight - PAD - safe.b - h - step * (h + 8));
        if (y < 0 || y + h > innerHeight) continue;
        s = overlapArea(x, y, w, h, rs);
        pref = corner * 3 + step;                 // 面積が同点なら選好順
        if (!best || s < best.s - 0.5 || (Math.abs(s - best.s) <= 0.5 && pref < best.pref)){
          best = { x: x, y: y, s: s, pref: pref, corner: corner };
        }
        if (s === 0 && step === 0 && corner === 0) { best = { x: x, y: y, s: 0, pref: 0, corner: 0 }; corner = 9; break; }
      }
    }
    if (!best) best = { x: innerWidth - PAD - w, y: PAD, corner: 0 };
    if (best.corner < 2){ A.style.top = best.y + 'px'; A.style.bottom = ''; }
    else { A.style.bottom = (innerHeight - best.y - h) + 'px'; A.style.top = ''; }
    if (best.corner % 2 === 0){ A.style.right = (PAD + safe.r) + 'px'; A.style.left = ''; }
    else { A.style.left = (PAD + safe.l) + 'px'; A.style.right = ''; }
  }

  function boot(){ place(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  addEventListener('load', place);
  addEventListener('resize', place);
  addEventListener('orientationchange', function(){ setTimeout(place, 220); });
  setTimeout(place, 400);
  setTimeout(place, 1400);
  setTimeout(place, 3600);
})();
</script>

<script>/* ASSET 19 The Confluence — host  h1 */
(function () {
  'use strict';

  var T = window.THREE;
  var W = window, D = document;

  function boom(e) {
    var b = D.getElementById('errBox');
    if (!b) return;
    b.style.display = 'block';
    b.textContent = (b.textContent ? b.textContent + '\n' : '') + (e && e.message ? e.message : String(e));
  }
  W.onerror = function (m, s, l, c, e) { boom(e || m); };

  /* ---------- 定数（契約 §2。統合時の裁定を反映） ---------- */
  var C = {
    PUMP: 0.78, DISC: 2.4, DISC_SEG: 2.38,
    WATER_Y: 0.0, BANK_Y: 1.10,
    SUN_L_AZ: 0.0, SUN_L_EL: 1.80, SUN_L_R: 2.40,
    SUN_S_AZ: 4.3, SUN_S_EL: 2.70, SUN_S_R: 1.50,
    DISC_R: 12.0, DISC_TH: 1.2, DISC_H: 12.0,
    DISC_ANCH_X: -30.0, DISC_ANCH_Z: -26.0, DISC_XODD: 42.0,
    STANDS: [[0.0, 2.70, 9.0], [-30.0, 2.70, -18.0], [20.0, 2.15, -3.2]],
    DISC_PAN_R: 10.0, DISC_PAN_D: 0.9, DISC_PITCH: 96.0,
    FACE_Z: -62.0, FACE_H: 5.2, FACE_W: 3.6, FACE_TH: 0.20, FACE_TILT: 4.0,
    SHORE_Z: -1400.0,
    HOUSE_W: 7.2, HOUSE_D: 9.6, HOUSE_H: 3.6,
    HOUSE_FLOOR_Y: 0.60, HOUSE_GAP_Z: -4.8,
    HOUSE_BACK_H: 1.20,   /* 世界 y。1.8 では二つの日が隠れる（house 実測） */
    HOUSE_X: 20.0,        /* 立ち場所一との衝突を避けて岸の角へ */
    MAG: 0xff05a8, PALE: 0xf2dbe9, TURQ: 0x00ddc8
  };

  function sunDir(azDeg, elDeg) {
    var a = azDeg * Math.PI / 180, e = elDeg * Math.PI / 180;
    return new T.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e));
  }

  /* ---------- 場 ---------- */
  var scene = new T.Scene();
  var canvas = D.getElementById('cv');
  var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false });
  renderer.setPixelRatio(Math.min(W.devicePixelRatio || 1, 1.5));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.45;

  var camera = new T.PerspectiveCamera(50, 1, 0.1, 6000);
  camera.rotation.order = 'YXZ';

  var U = {
    uTime: { value: 0 },
    uSunL: { value: sunDir(C.SUN_L_AZ, C.SUN_L_EL) },
    uSunS: { value: sunDir(C.SUN_S_AZ, C.SUN_S_EL) },
    uColL: { value: new T.Color(1.00, 0.72, 0.86) },
    uColS: { value: new T.Color(0.58, 0.98, 0.92) },
    uWarm: { value: new T.Color(1.00, 0.47, 0.155) },
    uFogC: { value: new T.Color(0.402, 0.372, 0.404) },
    uFogN: { value: 260.0 },
    uFogF: { value: 1600.0 },
    uReflect:  { value: null },
    uReflectM: { value: new T.Matrix4() }
  };

  var CF = { T: T, scene: scene, camera: camera, renderer: renderer, U: U, C: C, parts: {} };
  W.CF = CF;

  /* ---------- 立ち場所（yaw 0 ＝ −z ＝ 沖を向く） ---------- */
  var SPOTS = [
    { k: 'bank',  ja: '岸の道',   p: [0.0, 2.70, 9.0],          yaw: 0.0, pit: -0.06 },
    { k: 'under', ja: '円盤の真下', p: [-30.0, 2.70, -18.0],     yaw: 0.0, pit: 0.40 },
    { k: 'gap',   ja: '床の切れ目', p: [C.HOUSE_X, 2.15, -3.2],  yaw: 0.0, pit: 0.0 }
  ];
  var spot = 0, yaw = 0, pitch = 0;

  function goSpot(i) {
    spot = i;
    var s = SPOTS[i];
    camera.position.set(s.p[0], s.p[1], s.p[2]);
    yaw = s.yaw; pitch = s.pit || 0;
    var b = D.querySelectorAll('.spot');
    for (var k = 0; k < b.length; k++) b[k].className = 'spot glass' + (k === i ? ' on' : '');
    hidePanel();
  }

  /* ---------- 観測記録 ---------- */
  var LOG = {
    water:  'Four channels enter here. None of them keeps its direction.',
    inflow: 'It can be seen entering. It cannot be seen after that.',
    disc:   'Nothing is carried. The speed does not change.',
    roots:  'The water between the roots does not move. The sky collects there.',
    face:   'A surface remains standing. Where it begins cannot be decided.',
    suns:   'They do not mix. Only the light does.',
    path:   'Two, until the near water. One, after it.',
    shore:  'A line, at the limit of sight. Whether it is a shore is not recorded.'
  };
  /* 観測記録の順と名 */
  var KEYS = ['water', 'inflow', 'disc', 'roots', 'face', 'suns', 'path', 'shore'];
  var NAME = { water: 'WATER', inflow: 'INFLOW', disc: 'DISC', roots: 'ROOTS', face: 'FACE', suns: 'TWO SUNS', path: 'PATH OF LIGHT', shore: 'FAR SHORE' };
  var seen = {}, seenN = 0, curKey = null, panel = null, hideT = null, showT = null;

  function hidePanel() {
    if (!panel) return;
    curKey = null;
    panel.className = 'glass out';
    if (hideT) clearTimeout(hideT);
    hideT = setTimeout(function () { if (!curKey) panel.style.display = 'none'; }, 320);
  }
  function dotsHtml() {
    var h = '';
    for (var i = 0; i < KEYS.length; i++) h += '<i class="' + (seen[KEYS[i]] ? 'on' : '') + (KEYS[i] === curKey ? ' cur' : '') + '"></i>';
    return h;
  }
  function showPanel(key) {
    if (!panel || !LOG[key]) return;
    if (!seen[key]) { seen[key] = true; seenN++; }
    curKey = key;
    if (hideT) clearTimeout(hideT);
    if (showT) clearTimeout(showT);
    var idx = KEYS.indexOf(key) + 1;
    panel.querySelector('.hd .nm').textContent = NAME[key] || key.toUpperCase();
    panel.querySelector('.hd .no').textContent = 'RECORD ' + (idx < 10 ? '0' + idx : idx) + ' / 08';
    panel.querySelector('.lg').textContent = LOG[key];
    panel.querySelector('.dots').innerHTML = dotsHtml();
    panel.querySelector('.ft').textContent = seenN < KEYS.length ? (seenN + ' of 8 observed') : 'All eight observed. Nothing is concluded.';
    panel.style.display = 'block';
    panel.className = 'glass pre';
    void panel.offsetWidth;   /* 強制リフロー。pre を確定させてから in へ遷移させる */
    panel.className = 'glass in';
  }
  /* タップの手応え：触れた点に環を一つ */
  function ring(x, y, hit) {
    var r = D.createElement('div');
    r.className = 'ring' + (hit ? ' hit' : '');
    r.style.left = x + 'px'; r.style.top = y + 'px';
    D.body.appendChild(r);
    setTimeout(function () { if (r.parentNode) r.parentNode.removeChild(r); }, 700);
  }

  var ray = new T.Raycaster(), ndc = new T.Vector2();
  function pick(cx, cy) {
    var r = canvas.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(scene.children, true);
    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object;
      while (o) { if (o.userData && o.userData.h53log) { ring(cx, cy, true); showPanel(o.userData.h53log); return; } o = o.parent; }
    }
    ring(cx, cy, false);
    hidePanel();
  }

  /* ---------- 操作（指の向きに世界がついてくる） ---------- */
  var dragging = false, lx = 0, ly = 0, moved = 0, dx0 = 0, dy0 = 0, t0d = 0;
  function down(x, y) { dragging = true; lx = x; ly = y; dx0 = x; dy0 = y; moved = 0; t0d = Date.now(); }
  function move(x, y) {
    if (!dragging) return;
    var dx = x - lx, dy = y - ly; lx = x; ly = y;
    moved += Math.abs(dx) + Math.abs(dy);
    var k = 0.0038;
    yaw += dx * k;
    pitch += dy * k;
    var lim = 80 * Math.PI / 180;
    if (pitch > lim) pitch = lim; if (pitch < -lim) pitch = -lim;
  }
  function up(x, y) {
    if (dragging) { var dd = Math.abs(x - dx0) + Math.abs(y - dy0); if (dd < 14 && Date.now() - t0d < 450) { if (curKey) hidePanel(); else pick(x, y); } }
    dragging = false;
  }
  canvas.addEventListener('touchstart', function (e) { var t = e.touches[0]; lastTouch = Date.now(); down(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  var lastTouch = 0;
  canvas.addEventListener('touchend', function (e) { var t = e.changedTouches[0]; lastTouch = Date.now(); up(t.clientX, t.clientY); if (e.cancelable) e.preventDefault(); }, { passive: false });
  canvas.addEventListener('mousedown', function (e) { if (Date.now() - lastTouch < 800) return; down(e.clientX, e.clientY); });
  W.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
  W.addEventListener('mouseup', function (e) { if (Date.now() - lastTouch < 800) { dragging = false; return; } up(e.clientX, e.clientY); });

  /* ---------- 画角（台帳 ⑩ 水平画角を保つ） ---------- */
  var THETA_H = 27.0 * Math.PI / 180;
  function resize() {
    var w = W.innerWidth, h = W.innerHeight;
    renderer.setSize(w, h, false);
    var asp = w / h;
    camera.aspect = asp;
    var fv = 2 * Math.atan(Math.tan(THETA_H) / asp) * 180 / Math.PI;
    if (fv < 38) fv = 38; if (fv > 68) fv = 68;
    camera.fov = fv;
    camera.updateProjectionMatrix();
    var post = CF.parts.post;
    if (post && post.resize) { renderer.getDrawingBufferSize(_sz); post.resize(_sz.x, _sz.y); }
  }
  W.addEventListener('resize', resize);

  /* ---------- 光の道のプリセット（検討用） ---------- */
  var PRESETS = [
    { k: 'split',  ja: '分離', az: 4.3 },
    { k: 'calm',   ja: '静',  az: 3.6 },
    { k: 'breeze', ja: '微風', az: 3.6 }
  ];
  var pi_ = 0;
  CF.setPreset = function (i) {
    pi_ = ((i % PRESETS.length) + PRESETS.length) % PRESETS.length;
    var p = PRESETS[pi_];
    U.uSunS.value.copy(sunDir(p.az, C.SUN_S_EL));
    if (typeof CF.waterPreset === 'function') CF.waterPreset(p.k);
    var b = D.getElementById('pre');
    if (b) b.textContent = '光の道  ' + p.ja;
    return p.k;
  };

  /* ---------- 平面反射（水面 y=0。契約 c2 §1） ---------- */
  var mirCam = new T.PerspectiveCamera();
  var mirRT = null, mirW = 0, mirH = 0;
  var _pl = new T.Plane(), _n = new T.Vector3(0, 1, 0), _p0 = new T.Vector3(0, 0, 0);
  var _cp = new T.Vector3(), _fwd = new T.Vector3(), _up = new T.Vector3(), _tgt = new T.Vector3();
  var _q = new T.Vector4(), _c = new T.Vector4();
  var _tm = new T.Matrix4().set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
  var _sz = new T.Vector2();
  function ensureMirRT() {
    renderer.getDrawingBufferSize(_sz);
    var w = Math.max(2, Math.floor(_sz.x / 2)), h = Math.max(2, Math.floor(_sz.y / 2));
    if (mirRT && w === mirW && h === mirH) return;
    if (mirRT) mirRT.dispose();
    mirRT = new T.WebGLRenderTarget(w, h, { minFilter: T.LinearFilter, magFilter: T.LinearFilter, format: T.RGBAFormat, depthBuffer: true, stencilBuffer: false });
    mirRT.texture.encoding = T.sRGBEncoding;
    mirW = w; mirH = h;
    U.uReflect.value = mirRT.texture;
  }
  var waterMesh = null, hidden = [];
  function renderMirror() {
    if (!waterMesh) return;
    ensureMirRT();
    camera.updateMatrixWorld();
    _cp.copy(camera.position); _cp.y = -_cp.y;
    _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion); _fwd.y = -_fwd.y;
    _up.set(0, 1, 0).applyQuaternion(camera.quaternion); _up.y = -_up.y;
    mirCam.position.copy(_cp);
    mirCam.up.copy(_up);
    _tgt.copy(_cp).add(_fwd);
    mirCam.lookAt(_tgt);
    mirCam.near = camera.near; mirCam.far = camera.far; mirCam.fov = camera.fov; mirCam.aspect = camera.aspect;
    mirCam.updateProjectionMatrix();
    mirCam.updateMatrixWorld();
    mirCam.matrixWorldInverse.copy(mirCam.matrixWorld).invert();
    /* 斜め近クリップ（Reflector.js と同じ） */
    _pl.setFromNormalAndCoplanarPoint(_n, _p0);
    _pl.applyMatrix4(mirCam.matrixWorldInverse);
    _c.set(_pl.normal.x, _pl.normal.y, _pl.normal.z, _pl.constant);
    var pm = mirCam.projectionMatrix;
    _q.x = (Math.sign(_c.x) + pm.elements[8]) / pm.elements[0];
    _q.y = (Math.sign(_c.y) + pm.elements[9]) / pm.elements[5];
    _q.z = -1.0;
    _q.w = (1.0 + pm.elements[10]) / pm.elements[14];
    _c.multiplyScalar(2.0 / _c.dot(_q));
    pm.elements[2] = _c.x; pm.elements[6] = _c.y; pm.elements[10] = _c.z + 1.0; pm.elements[14] = _c.w;
    U.uReflectM.value.copy(_tm).multiply(mirCam.projectionMatrix).multiply(mirCam.matrixWorldInverse);
    /* 水面と、鏡像に出したくない物を隠す */
    hidden.length = 0;
    scene.traverse(function (o) {
      if (o === waterMesh || (o.userData && (o.userData.h53noReflect || o.userData.h53log === 'path' || o.userData.h53log === 'inflow' || o.userData.h53log === 'suns')) || o.name === 'h53-sky-dome') {
        if (o.visible) { o.visible = false; hidden.push(o); }
      }
    });
    var oldTarget = renderer.getRenderTarget();
    var oldClear = renderer.getClearAlpha();
    renderer.setRenderTarget(mirRT);
    renderer.setClearColor(0x000000, 0.0);
    renderer.clear();
    renderer.render(scene, mirCam);
    renderer.setRenderTarget(oldTarget);
    renderer.setClearColor(0x0b0d10, 1.0);
    for (var i = 0; i < hidden.length; i++) hidden[i].visible = true;
  }
  function findWater() {
    scene.traverse(function (o) {
      if (o.isMesh && o.userData && o.userData.h53log === 'water' && !waterMesh) {
        waterMesh = o;
        if (o.material && o.material.uniforms && o.material.uniforms.uReflectOn) o.material.uniforms.uReflectOn.value = 1.0;
      }
    });
  }

  /* ---------- 組み立て ---------- */
  var order = ['sky', 'water', 'shore', 'disc', 'house', 'far', 'post'];
  var built = [];
  function boot() {
    for (var i = 0; i < order.length; i++) {
      var p = CF.parts[order[i]];
      if (!p) { boom(new Error('part missing: ' + order[i])); continue; }
      try { p.build(); built.push(p); } catch (e) { boom(new Error(order[i] + ': ' + e.message)); }
    }
    findWater();
    resize();
    goSpot(0);
    CF.setPreset(0);
    CF.ready = true;
  }

  var t0 = (W.performance && performance.now ? performance.now() : Date.now()) / 1000;
  function loop() {
    W.requestAnimationFrame(loop);
    var now = (W.performance && performance.now ? performance.now() : Date.now()) / 1000;
    var t = now - t0;
    U.uTime.value = t;
    camera.rotation.set(pitch, yaw, 0);
    for (var i = 0; i < built.length; i++) {
      if (built[i].tick) { try { built[i].tick(t); } catch (e) { boom(e); } }
    }
    renderMirror();
    var post = CF.parts.post;
    if (post && post.render && CF.ready) post.render(scene, camera); else renderer.render(scene, camera);
  }

  CF.boot = function () { boot(); loop(); };

  /* ---------- UI 配線 ---------- */
  function wire() {
    panel = D.getElementById('panel');
    var xs = D.getElementById('px');
    if (xs) xs.addEventListener('click', hidePanel);
    if (panel) panel.addEventListener('click', function (e) { if (e.target === xs) return; hidePanel(); });
    var b = D.querySelectorAll('.spot');
    for (var i = 0; i < b.length; i++) {
      (function (n) { b[n].addEventListener('click', function () { goSpot(n); }); })(i);
    }
    var pb = D.getElementById('pre');
    if (pb) pb.addEventListener('click', function () { CF.setPreset(pi_ + 1); });
  }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', wire); else wire();
})();
</script>
<script>/* ===== part sky (11666 B) ===== */
/* ASSET 19 The Confluence — B sky（空と二つの日）
   ドーム＝契約 §5 の h53Sky で塗る／日の円盤と欠けはここで解析的に描く／
   シーンのライトはこの部品だけが足す。c2：縁 0.15°・暈控えめ・巻雲と層雲の斑。*/
(function(){

  var T = window.CF.T;
  var U = window.CF.U;
  var C = window.CF.C || {};
  var DEG = Math.PI / 180.0;

  function cnum(k, dflt){
    return (typeof C[k] === 'number' && isFinite(C[k])) ? C[k] : dflt;
  }
  function f(x){ return x.toFixed(8); }

  /* ---- 見かけの寸法（契約 §2。方向は CF.U のベクトルをそのまま使う） ---- */
  var R_L = cnum('SUN_L_R', 2.40) * DEG;   /* 大の視半径 */
  var R_S = cnum('SUN_S_R', 1.50) * DEG;   /* 小の視半径 */

  var EDGE_W = 0.150 * DEG;   /* 縁のやわらかさ＝大気のにじみ（c2 ①） */
  var HORZ_W = 0.040 * DEG;   /* 水平線での切り口のやわらかさ */
  var WARM_T = 2.20 * DEG;    /* この仰角より下で橙が濃く溜まる */

  var AMP_L = 4.30, AMP_S = 3.40;   /* 円盤面の輝度 */
  var LIMB_L = 0.34, LIMB_S = 0.26; /* 限周減光 */
  var WARM_L = 0.86, WARM_S = 0.34; /* 水平線際で橙へ寄る量 */
  var AIRLIGHT = 0.13;              /* 円盤の手前に残す空気の光（c2 ② 6 割） */
  var CIRRUS_A = 0.04;              /* 巻雲の斑 ±4%（c2 ③） */
  var STRATUS_A = 0.03;             /* 水平線際の層雲 ±3%（c2 ④） */

  var DOME_R = 3800.0;
  var HIT_D  = 3000.0;              /* 当たり板を置く距離 */
  var HIT_K  = 1.40;                /* 指で触れる余裕 */

  var built = false;

  /* ================= シェーダ ================= */

  var VERT = [
    'varying vec3 vW;',
    'void main(){',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vW = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n');

  /* --- 契約 §5。一字も変えない。ここから --- */
  var SKY_GLSL = [
    'uniform vec3 uSunL; uniform vec3 uSunS;',
    'uniform vec3 uColL; uniform vec3 uColS; uniform vec3 uWarm;',
    '',
    'vec3 h53Sky(vec3 d){',
    '  float h  = clamp(d.y, -0.25, 1.0);',
    '  vec3  hi = vec3(0.055, 0.075, 0.115);',
    '  vec3  lo = vec3(0.620, 0.600, 0.660);',
    '  vec3  c  = mix(lo, hi, pow(clamp(h, 0.0, 1.0), 0.42));',
    '  float mL = max(dot(d, uSunL), 0.0);',
    '  float mS = max(dot(d, uSunS), 0.0);',
    '  float hz = exp(-abs(d.y) * 14.0);',
    '  c += uWarm * (hz * (0.36 + 0.95 * pow(mL, 6.0)));',
    '  c += uColL * (0.55 * pow(mL, 260.0) + 0.16 * pow(mL, 26.0));',
    '  c += uColS * (0.34 * pow(mS, 420.0) + 0.08 * pow(mS, 40.0));',
    '  return c;',
    '}'
  ].join('\n');
  /* --- 契約 §5。ここまで --- */

  var FRAG = [
    'varying vec3 vW;',
    SKY_GLSL,
    '',
    '/* 値ノイズ（sin を使わない hash。モバイルで安定） */',
    'float h53Hash(vec3 p){',
    '  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));',
    '  p *= 17.0;',
    '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
    '}',
    'float h53Noise(vec3 p){',
    '  vec3 i = floor(p); vec3 f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float n000 = h53Hash(i);',
    '  float n100 = h53Hash(i + vec3(1.0, 0.0, 0.0));',
    '  float n010 = h53Hash(i + vec3(0.0, 1.0, 0.0));',
    '  float n110 = h53Hash(i + vec3(1.0, 1.0, 0.0));',
    '  float n001 = h53Hash(i + vec3(0.0, 0.0, 1.0));',
    '  float n101 = h53Hash(i + vec3(1.0, 0.0, 1.0));',
    '  float n011 = h53Hash(i + vec3(0.0, 1.0, 1.0));',
    '  float n111 = h53Hash(i + vec3(1.0, 1.0, 1.0));',
    '  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),',
    '             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);',
    '}',
    '/* 3 オクターブ。戻りは概ね -1..1 */',
    'float h53Fbm(vec3 p){',
    '  float n = 0.50 * h53Noise(p) + 0.30 * h53Noise(p * 2.03 + 7.1) + 0.20 * h53Noise(p * 4.11 + 3.7);',
    '  return clamp((n - 0.5) * 3.6, -1.0, 1.0);',
    '}',
    '',
    '/* 単位ベクトル同士の挟角。dot の acos より原点付近の桁落ちが少ない */',
    'float h53Ang(vec3 d, vec3 s){',
    '  return 2.0 * asin(clamp(0.5 * length(d - s), 0.0, 1.0));',
    '}',
    '',
    'void main(){',
    '  vec3 d = normalize(vW - cameraPosition);',
    '  vec3 c = h53Sky(d);',
    '',
    '  /* --- 雲の斑。h53Sky の上に乗算で足す（ドームだけ） --- */',
    '  float elDeg = degrees(asin(clamp(d.y, -1.0, 1.0)));',
    '  /* 巻雲：仰角 8〜40° の帯。方向ベクトルを縦に 7 倍つぶし、水平に長い斑にする */',
    '  float cw = smoothstep(8.0, 14.0, elDeg) * (1.0 - smoothstep(30.0, 40.0, elDeg));',
    '  float cirrus = h53Fbm(vec3(d.x * 5.5, d.y * 38.5, d.z * 5.5));',
    '  /* 層雲：水平線直上 0〜2° の水平の筋。縦に 45 倍つぶす */',
    '  float sw = smoothstep(-0.05, 0.10, elDeg) * (1.0 - smoothstep(0.0, 2.0, elDeg));',
    '  float stratus = h53Fbm(vec3(d.x * 3.0, d.y * 135.0 + 2.0, d.z * 3.0));',
    '  c *= 1.0 + ' + f(CIRRUS_A) + ' * cirrus * cw + ' + f(STRATUS_A) + ' * stratus * sw;',
    '',
    '  float aL = h53Ang(d, uSunL);',
    '  float aS = h53Ang(d, uSunS);',
    '',
    '  /* 水面 y=0 の見かけの線は仰角 0（無限平面の水平線）。',
    '     円と直線の交差はここで解析的に取る。d.y = sin(仰角)。 */',
    '  float above = smoothstep(' + f(-HORZ_W) + ', ' + f(HORZ_W) + ', d.y);',
    '',
    '  float covL = (1.0 - smoothstep(' + f(R_L - EDGE_W) + ', ' + f(R_L) + ', aL)) * above;',
    '  float covS = (1.0 - smoothstep(' + f(R_S - EDGE_W) + ', ' + f(R_S) + ', aS)) * above;',
    '  covL *= (1.0 - covS);           /* 二つの円盤は 0.19 度だけ重なる。小を手前に置く */',
    '',
    '  /* 限周減光。薄く */',
    '  float uL = clamp(aL / ' + f(R_L) + ', 0.0, 1.0);',
    '  float uS = clamp(aS / ' + f(R_S) + ', 0.0, 1.0);',
    '  float ldL = 1.0 - ' + f(LIMB_L) + ' * (1.0 - sqrt(max(0.0, 1.0 - uL * uL)));',
    '  float ldS = 1.0 - ' + f(LIMB_S) + ' * (1.0 - sqrt(max(0.0, 1.0 - uS * uS)));',
    '',
    '  /* 欠けた縁ほど橙が濃い。円盤の内側だけを染める。空へは何も足さない */',
    '  float wf = 1.0 - smoothstep(0.0, ' + f(WARM_T) + ', d.y);',
    '  vec3 bL = mix(uColL, uWarm, ' + f(WARM_L) + ' * wf);',
    '  vec3 bS = mix(uColS, uWarm, ' + f(WARM_S) + ' * wf);',
    '',
    '  vec3 rL = bL * (' + f(AMP_L) + ' * ldL) + c * ' + f(AIRLIGHT) + ';',
    '  vec3 rS = bS * (' + f(AMP_S) + ' * ldS) + c * ' + f(AIRLIGHT) + ';',
    '',
    '  c = mix(c, rL, covL);',
    '  c = mix(c, rS, covS);',
    '',
    '  gl_FragColor = vec4(c, 1.0);',
    '',
    '  #include <tonemapping_fragment>',
    '  #include <encodings_fragment>',
    '}'
  ].join('\n');

  /* ================= 空の平均色（環境光の色） ================= */

  function skyCPU(dx, dy, dz, out){
    var h = dy < -0.25 ? -0.25 : (dy > 1.0 ? 1.0 : dy);
    var hc = h < 0.0 ? 0.0 : h;
    var k = Math.pow(hc, 0.42);
    out[0] = 0.620 + (0.055 - 0.620) * k;
    out[1] = 0.600 + (0.075 - 0.600) * k;
    out[2] = 0.660 + (0.115 - 0.660) * k;

    var sL = U.uSunL.value, sS = U.uSunS.value;
    var mL = dx * sL.x + dy * sL.y + dz * sL.z; if (mL < 0.0) mL = 0.0;
    var mS = dx * sS.x + dy * sS.y + dz * sS.z; if (mS < 0.0) mS = 0.0;

    var w = Math.exp(-Math.abs(dy) * 14.0) * (0.36 + 0.95 * Math.pow(mL, 6.0));
    var W = U.uWarm.value, L = U.uColL.value, Sc = U.uColS.value;
    out[0] += W.r * w; out[1] += W.g * w; out[2] += W.b * w;

    var fL = 0.55 * Math.pow(mL, 260.0) + 0.16 * Math.pow(mL, 26.0);
    out[0] += L.r * fL; out[1] += L.g * fL; out[2] += L.b * fL;

    var fS = 0.34 * Math.pow(mS, 420.0) + 0.08 * Math.pow(mS, 40.0);
    out[0] += Sc.r * fS; out[1] += Sc.g * fS; out[2] += Sc.b * fS;
  }

  /* 上半球を立体角で重みづけした平均。色相だけ採り、強さは 0.30 で与える */
  function ambientColour(){
    var NE = 48, NA = 96;
    var ax = 0.0, ay = 0.0, az = 0.0, ws = 0.0;
    var o = [0.0, 0.0, 0.0];
    var i, j, el, ce, se, azm;
    for (i = 0; i < NE; i++){
      el = (i + 0.5) / NE * (Math.PI * 0.5);
      ce = Math.cos(el); se = Math.sin(el);
      for (j = 0; j < NA; j++){
        azm = (j + 0.5) / NA * Math.PI * 2.0;
        skyCPU(ce * Math.sin(azm), se, -ce * Math.cos(azm), o);
        ax += o[0] * ce; ay += o[1] * ce; az += o[2] * ce; ws += ce;
      }
    }
    ax /= ws; ay /= ws; az /= ws;
    var mx = Math.max(ax, Math.max(ay, az));
    if (mx > 1e-6){ ax /= mx; ay /= mx; az /= mx; }
    return new T.Color(ax, ay, az);
  }

  /* ================= 当たり板（描かない） ================= */

  function writeQuad(pos, off, s, halfAng, dist){
    var cx = s.x * dist, cy = s.y * dist, cz = s.z * dist;

    /* right = normalize(cross(s, worldUp)) */
    var rx = -s.z, ry = 0.0, rz = s.x;
    var rl = Math.sqrt(rx * rx + ry * ry + rz * rz);
    if (rl < 1e-6){ rx = 1.0; ry = 0.0; rz = 0.0; rl = 1.0; }
    rx /= rl; ry /= rl; rz /= rl;

    /* up = cross(right, s) */
    var vx = ry * s.z - rz * s.y;
    var vy = rz * s.x - rx * s.z;
    var vz = rx * s.y - ry * s.x;

    var h = dist * Math.tan(halfAng);
    var k;
    var sx = [-1, 1, 1, -1], sy = [-1, -1, 1, 1];
    for (k = 0; k < 4; k++){
      pos[off + k * 3]     = cx + rx * h * sx[k] + vx * h * sy[k];
      pos[off + k * 3 + 1] = cy + ry * h * sx[k] + vy * h * sy[k];
      pos[off + k * 3 + 2] = cz + rz * h * sx[k] + vz * h * sy[k];
    }
  }

  var hitAttr = null, keyS = null;
  var lastS = { x: 0, y: 0, z: 0 };
  var LIGHT_D = 2000.0;

  function followSuns(){
    var sS = U.uSunS.value;
    if (sS.x === lastS.x && sS.y === lastS.y && sS.z === lastS.z) return;
    lastS.x = sS.x; lastS.y = sS.y; lastS.z = sS.z;
    if (hitAttr){
      writeQuad(hitAttr.array, 12, sS, R_S * HIT_K, HIT_D);
      hitAttr.needsUpdate = true;
    }
    if (keyS) keyS.position.set(sS.x * LIGHT_D, sS.y * LIGHT_D, sS.z * LIGHT_D);
  }

  /* ================= 組み立て ================= */

  function build(){
    if (built) return;
    built = true;

    var scene = window.CF.scene;

    /* --- 一 空のドーム --- */
    var geo = new T.SphereGeometry(DOME_R, 32, 16);
    var mat = new T.ShaderMaterial({
      uniforms: {
        uSunL: U.uSunL, uSunS: U.uSunS,
        uColL: U.uColL, uColS: U.uColS, uWarm: U.uWarm
      },
      vertexShader: VERT,
      fragmentShader: FRAG,
      side: T.BackSide,
      depthWrite: false,
      depthTest: false,
      fog: false
    });
    var dome = new T.Mesh(geo, mat);
    dome.name = 'h53-sky-dome';
    dome.frustumCulled = false;
    dome.renderOrder = -1000;
    dome.matrixAutoUpdate = false;
    dome.updateMatrix();
    scene.add(dome);

    /* --- 二 観測記録の当たり（二つの日。描画はしない） --- */
    var pos = new Float32Array(24);
    writeQuad(pos, 0,  U.uSunL.value, R_L * HIT_K, HIT_D);
    writeQuad(pos, 12, U.uSunS.value, R_S * HIT_K, HIT_D);

    var hg = new T.BufferGeometry();
    hitAttr = new T.BufferAttribute(pos, 3);
    hitAttr.setUsage(T.DynamicDrawUsage);
    hg.setAttribute('position', hitAttr);
    hg.setIndex([0, 1, 2, 0, 2, 3, 4, 5, 6, 4, 6, 7]);
    hg.boundingSphere = new T.Sphere(new T.Vector3(0, 0, 0), HIT_D * 1.5);

    var hm = new T.MeshBasicMaterial({
      side: T.DoubleSide,
      colorWrite: false,
      depthWrite: false,
      depthTest: false
    });
    var hit = new T.Mesh(hg, hm);
    hit.name = 'h53-sky-suns-hit';
    hit.frustumCulled = false;
    hit.renderOrder = -999;
    hit.userData.h53log = 'suns';
    hit.userData.h53noReflect = true;
    scene.add(hit);

    /* --- 三 ライト（足すのはこの部品だけ。半球光は使わない（台帳の禁止 API）） --- */
    var sL = U.uSunL.value, sS = U.uSunS.value;
    var D = LIGHT_D;

    var cL = new T.Color().copy(U.uColL.value).lerp(U.uWarm.value, 0.16);
    var keyL = new T.DirectionalLight(cL, 1.05);
    keyL.name = 'h53-sun-large';
    keyL.position.set(sL.x * D, sL.y * D, sL.z * D);
    keyL.castShadow = false;
    scene.add(keyL);
    scene.add(keyL.target);

          var ctr = getV(fx0 + FINE / 2, fz0 + FINE / 2);
          for (i = 0; i < ring.length; i++){
            /* (ctr, ring[i+1], ring[i]): the ring runs +x then +z (counter-clockwise seen from +y),
               so (ctr -> next) x (ctr -> this) points +y */
            B.tri(ctr, ring[(i + 1) % ring.length], ring[i]);
          }
        }
      }
    }
    return counts;
  }

  /* ------------------------------------------------------------------ *
   * 6.  the path: the same terrain grid, clipped to |d - pathD| < 1.05, lifted 0.012,
   *     alpha 1 inside the 1.40 and fading to 0 over the 0.35 apron.  no tracing,
   *     so the loop round the promontory and the detour round the house come free
   * ------------------------------------------------------------------ */
  function buildPath(){
    var pos = [], col = [], uv = [], dd = [], idx = [], map = {}, o = {};
    var nx = GX1 - GX0, nz = GZ1 - GZ0, ix, iz, i, j, cells = 0;
    var LIM = PATH_HW + PATH_APRON;
    function alphaOf(d, x){ return 1.0 - sstep(PATH_HW, LIM, Math.abs(d - pathD(x))); }
    function getV(fx, fz){
      var k = fx * 4096 + fz;
      if (map[k] !== undefined) return map[k];
      var x = GX0 + fx / FINE, z = GZ0 + fz / FINE;
      var y = terrainY(x, z, o) + 0.012;
      var c = groundCol(x, z, y, o.d, 1.0, o.n);
      var a = alphaOf(o.d, x);
      var id = pos.length / 3;
      pos.push(x, y, z); col.push(c[0], c[1], c[2], a); uv.push(x, z); dd.push(o.d);
      map[k] = { id: id, a: a };
      return map[k];
    }
    for (ix = 0; ix < nx; ix++){
      for (iz = 0; iz < nz; iz++){
        var cx = GX0 + ix, cz = GZ0 + iz;
        /* quick reject: the cell centre far from the path */
        var dc = dLand(cx + 0.5, cz + 0.5);
        if (Math.abs(dc - pathD(cx + 0.5)) > LIM + 1.2) continue;
        var L = cellLevel(cx, cz), step = FINE / L, fx0 = ix * FINE, fz0 = iz * FINE;
        for (i = 0; i < L; i++){
          for (j = 0; j < L; j++){
            var a = getV(fx0 + i * step, fz0 + j * step), b = getV(fx0 + (i + 1) * step, fz0 + j * step);
            var c = getV(fx0 + i * step, fz0 + (j + 1) * step), d = getV(fx0 + (i + 1) * step, fz0 + (j + 1) * step);
            if (a.a <= 0 && b.a <= 0 && c.a <= 0 && d.a <= 0) continue;
            /* (a, c, b): (+z) x (+x) = +y, as the ground */
            idx.push(a.id, c.id, b.id); idx.push(c.id, d.id, b.id);
            cells++;
          }
        }
      }
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new T.Float32BufferAttribute(col, 4));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    g.setAttribute('aD', new T.Float32BufferAttribute(dd, 1));
    g.setIndex(new T.Uint32BufferAttribute(idx, 1));
    /* face normals measured: area-weighted mean of n.y and the count pointing down */
    var ia = g.index.array, pa = g.attributes.position.array, sum = 0, area = 0, down = 0, t;
    for (t = 0; t < ia.length; t += 3){
      var a3 = ia[t] * 3, b3 = ia[t + 1] * 3, c3 = ia[t + 2] * 3;
      var fn = cr([pa[b3] - pa[a3], pa[b3 + 1] - pa[a3 + 1], pa[b3 + 2] - pa[a3 + 2]], [pa[c3] - pa[a3], pa[c3 + 1] - pa[a3 + 1], pa[c3 + 2] - pa[a3 + 2]]);
      var ar = ln(fn) * 0.5; if (ar < 1e-12) continue;
      sum += fn[1] * 0.5; area += ar; if (fn[1] < 0) down++;
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    return { geo: g, quads: cells, tris: idx.length / 3, nyMean: sum / (area || 1), foldedTris: down, verts: pos.length / 3 };
  }

  /* ------------------------------------------------------------------ *
   * 7.  tube sweep (parallel transport).  the winding is derived, then measured
   * ------------------------------------------------------------------ */
  function pushTube(B, pts, rads, seg, o){
    var P = pts.length, i, j;
    var tan = [];
    for (i = 0; i < P; i++){
      var a = pts[i > 0 ? i - 1 : 0], b = pts[i < P - 1 ? i + 1 : P - 1];
      var t = sb(b, a);
      if (ln(t) < 1e-8) t = (i > 0) ? tan[i - 1] : [0, -1, 0];
      tan.push(nrm(t));
    }
    var Nf = [], Bf = [];
    var ref = (Math.abs(tan[0][1]) > 0.9) ? [1, 0, 0] : [0, 1, 0];
    Nf[0] = nrm(cr(tan[0], ref));
    for (i = 1; i < P; i++){
      var ax = cr(tan[i - 1], tan[i]), sl = ln(ax);
      if (sl < 1e-8){ Nf[i] = Nf[i - 1].slice(); }
      else { ax = ml(ax, 1 / sl); Nf[i] = rotAx(Nf[i - 1], ax, Math.atan2(sl, dt(tan[i - 1], tan[i]))); }
      Nf[i] = nrm(sb(Nf[i], ml(tan[i], dt(Nf[i], tan[i]))));
    }
    for (i = 0; i < P; i++) Bf[i] = nrm(cr(tan[i], Nf[i]));     /* (N, B, T) right handed */

    var tiles = Math.max(1, Math.round(TAU * rads[0] / 0.5));
    var uLen = tiles * 0.5;
    var vAt = o.vOff || 0.0;
    var base = B.p.length / 3;
    var wob1 = rr(0, TAU), wob2 = rr(0, TAU);
    var nrid = (o.gen === 1 ? 4 : 3) + Math.floor(rnd() * 2.999), ridA = rr(0.08, 0.13), ridTw = rr(-1.4, 1.4);
    var nrid2 = nrid * 2 + 1, ridB = rr(0.02, 0.035);
    var knots = [], nk = (o.gen === 1) ? 2 : (o.gen === 2 ? 1 : 0);
    for (i = 0; i < nk; i++) knots.push([rr(0.15, 0.85), rr(0.10, 0.18), rr(0.03, 0.06)]);
    for (i = 0; i < P; i++){
      var t01 = i / (P - 1);
      if (i > 0) vAt += ln(sb(pts[i], pts[i - 1]));
      var r0 = rads[i];
      if (o.collar){ if (i === 0) r0 *= 0.90; else if (i === 1) r0 *= 1.18; else if (i === 2) r0 *= 1.06; }
      for (var kk = 0; kk < knots.length; kk++){ var dk = (t01 - knots[kk][0]) / knots[kk][2]; r0 *= 1.0 + knots[kk][1] * Math.exp(-dk * dk); }
      var twist = 0.45 * t01;
      for (j = 0; j < seg; j++){
        var th = (j / seg) * TAU + twist;
        var f1 = Math.sin(th * nrid + t01 * ridTw + wob1), f2 = Math.sin(th * nrid2 - t01 * ridTw * 0.5 + wob2);
        var wob = 1.0 + ridA * f1 + ridB * f2 + 0.012 * Math.sin(th * 7.0 - i * 0.9);
        var r = r0 * wob;
        var cth = Math.cos(th), sth = Math.sin(th);
        var p = ad(pts[i], ad(ml(Nf[i], cth * r), ml(Bf[i], sth * r)));
        var tg = ad(ml(Nf[i], -sth), ml(Bf[i], cth));
        var furrow = 0.5 - 0.5 * f1;                                 /* 1 in the furrow */
        B.vert(p, o.colf(t01, th, p, furrow), o.tag || 1, pts[i], [(j / seg) * uLen, vAt], tg, o.m, o.gen);
      }
    }
    /* (v(i,j), v(i,j+1), v(i+1,j)) -> outward */
    for (i = 0; i < P - 1; i++){
      for (j = 0; j < seg; j++){
        var j2 = (j + 1) % seg;
        var a0 = base + i * seg + j, a1 = base + i * seg + j2;
        var b0 = base + (i + 1) * seg + j, b1 = base + (i + 1) * seg + j2;
        B.tri(a0, a1, b0);
        B.tri(a1, b1, b0);
      }
    }
    if (o.capStart){
      var apx0 = sb(pts[0], ml(tan[0], Math.max(rads[0], 0.02) * 0.9));
      var av0 = B.vert(apx0, o.colf(0.0, 0.0, apx0), o.tag || 1, pts[0], [uLen * 0.5, (o.vOff || 0.0) - 0.03], Nf[0], o.m, o.gen);
      for (j = 0; j < seg; j++) B.tri(base + (j + 1) % seg, base + j, av0);
    }
    if (o.cap){
      var lastRing = base + (P - 1) * seg;
      var apx = ad(pts[P - 1], ml(tan[P - 1], Math.max(rads[P - 1], 0.02) * 1.2));
      var av = B.vert(apx, o.colf(1.0, 0.0, apx), o.tag || 1, pts[P - 1], [uLen * 0.5, vAt + 0.03], Nf[P - 1], o.m, o.gen);
      for (j = 0; j < seg; j++) B.tri(lastRing + j, lastRing + (j + 1) % seg, av);
    }
    return vAt;
  }

  /* ------------------------------------------------------------------ *
   * 8.  root arms.  skeleton first (TREE-METHOD): a gen1 main root leaves the
   *     soil at the bank, rises a little, arcs down into the water.  laterals
   *     branch at golden-angle rolls with a heading kink on the parent (the
   *     continuation), da Vinci steps in the taper, collars at every branch,
   *     tips to radius 0.
   *     nothing floats over land: under a main root the soil is raised to the
   *     root (a ridge: bottom of the ring 0.35 r under the soil), and every
   *     lateral ring over land is settled 0.35 r into the soil
   * ------------------------------------------------------------------ */
  var LODR = { np: [0, 24, 14, 9], seg: [0, 12, 7, 5] };   /* main root 12 (brief 10: the 10-gon showed on the silhouette at standing place one) */
  var TAPE = Math.pow(0.25, 1.1);
  function taper(t){ return (Math.pow(1 - 0.75 * t, 1.1) - TAPE) / (1 - TAPE); }

  function barkColFn(ground){
    return function(t, th, p, furrow){
      var ridge = 1.0 - (furrow || 0);
      var c = mix3(COL_BARK, COL_RIDG, ridge * 0.6);
      var g = 0.86 + 0.24 * ridge;
      var gy = ground(p[0], p[2]);
      var soil = 1.0 - cl((p[1] - gy) / 0.35, 0, 1);         /* contact with the soil: darker (METHOD 4.2) */
      g *= 1.0 - 0.14 * soil;
      return [c[0] * g, c[1] * g, c[2] * g];
    };
  }

  /* the settle rule for laterals: ring centre height given the soil height gy and radius r */
  function settle(y, gy, r, t, P){
    if (!P.sinkRule) return y;
    if (gy < -0.05) return y;                          /* over the water: free */
    if (y - r > gy - 0.35 * r) y = gy + 0.65 * r;      /* floating -> sink 0.35 r */
    if (t > 0.16 && y < gy) y = gy;                    /* never deeper than the axis once out of the soil */
    return y;
  }

  /* the skeleton of one arm.  S start, H horizontal unit direction, L horizontal run, r0 start radius */
  function armSkel(S, H, L, r0, gen, P, roll){
    var NP = LODR.np[gen], i, k, t;
    var y0 = S[1];
    var yEnd = P.yEnd + rr(-0.15, 0.10);
    var A = (gen === 1) ? rr(P.riseMin, P.riseMax) : 0.0;
    var sag = (gen === 1) ? 0 : rr(1.3, 1.9);
    var ph1 = rr(0, TAU), ph2 = rr(0, TAU), ph3 = rr(0, 100);
    var amp1 = L * rr(0.05, 0.09), amp2 = L * rr(0.015, 0.03);

    var lat = [];
    if (gen === 1){
      var n1 = rr(0, 1) < 0.6 ? 3 : 2;
      var slots = [[0.22, 0.34], [0.42, 0.54], [0.62, 0.74]];
      for (k = 0; k < n1; k++) lat.push({ tb: rr(slots[k][0], slots[k][1]) });
    } else if (gen === 2){
      lat.push({ tb: rr(0.36, 0.50) });
      lat.push({ tb: rr(0.62, 0.76) });
    }
    for (k = 0; k < lat.length; k++){
      roll += GOLD;
      lat[k].side = (Math.sin(roll) >= 0) ? 1 : -1;
      lat[k].ang = rr(35, 65) * D2R * lat[k].side;
      lat[k].kink = -lat[k].side * rr(8, 18) * D2R;            /* the continuation turns the other way */
      lat[k].ratio = rr(0.52, 0.66);                              /* r child / r parent */
    }
    var pts = [], rads = [], head = [], hd = H.slice();
    var p = S.slice();
    var perp = [-H[2], 0, H[0]];
    var stepL = L / (NP - 1);
    var yTop = y0 + A;
    for (i = 0; i < NP; i++){
      t = i / (NP - 1);
      if (i > 0){
        var tp = (i - 1) / (NP - 1);
        for (k = 0; k < lat.length; k++){
          if (tp < lat[k].tb && t >= lat[k].tb) hd = rotY(hd, lat[k].kink);
        }
        if (gen === 1 && P.seaward){                                   /* the main root keeps heading seaward */
          var hA = Math.atan2(hd[0], -hd[2]), hL = 36 * D2R;
          var sA = Math.atan2(P.seaward[0], -P.seaward[2]);
          if (hA > sA + hL) hA = sA + hL; if (hA < sA - hL) hA = sA - hL;
          hd = [Math.sin(hA), 0, -Math.cos(hA)];
        }
        var lw = amp1 * Math.sin(TAU * (t * 0.9 + ph1)) + amp2 * Math.sin(TAU * (2.3 * t + ph2));
        var lwPrev = amp1 * Math.sin(TAU * (tp * 0.9 + ph1)) + amp2 * Math.sin(TAU * (2.3 * tp + ph2));
        p = ad(p, ml(hd, stepL));
        p = ad(p, ml(perp, lw - lwPrev));
      }
      var y;
      if (gen === 1){
        var dT = P.diveT || 0.4;
        var up = A * Math.sin(PI * Math.min(t, dT) / (2.0 * dT));
        var dn = (t > dT) ? s5((t - dT) / (1.0 - dT)) : 0.0;
        y = y0 + up + (yEnd - yTop) * dn;
      } else {
        y = y0 + (yEnd - y0) * Math.pow(t, sag);
      }
      y += (vnoise(t * 5.0 + ph3, ph3 * 0.3) - 0.5) * 0.05 * L * Math.sin(PI * t);
      if (P.sink && gen === 1 && t < 0.16) y -= (0.16 - t) / 0.16 * (r0 * 0.6 + 0.05);   /* the start lies inside the bank, nearly level: the root comes out of the slope face, not up out of the top */
      var rEnd = (gen === 3) ? 0.012 : r0 * 0.20;
      var r = rEnd + (r0 - rEnd) * taper(t);
      for (k = 0; k < lat.length; k++){
        var f = Math.pow(1 - Math.pow(lat[k].ratio, 2.2), 1 / 2.2);
        r *= 1.0 - (1.0 - f) * sstep(lat[k].tb - 0.02, lat[k].tb + 0.06, t);
        var dd = (t - lat[k].tb) / 0.05;
        r *= 1.0 + 0.16 * Math.exp(-dd * dd);
      }
      var pp = [p[0], y, p[2]];
      if (gen >= 2){
        var gy = P.ground(pp[0], pp[2]);
        pp[1] = settle(pp[1], gy, r, t, P);
        if (P.rings) P.rings.push({ y: pp[1], r: r, gy: gy, land: gy >= -0.05, gen: gen });
      }
      pts.push(pp); rads.push(r); head.push(hd.slice());
    }
    return { pts: pts, rads: rads, head: head, lat: lat, gen: gen, L: L, roll: roll, NP: NP };
  }

  /* the skin, then the laterals (their skeletons see the final soil) */
  function armSweep(B, sk, P){
    var gen = sk.gen, k;
    pushTube(B, sk.pts, sk.rads, LODR.seg[gen], { colf: P.colf, cap: true, capStart: gen === 1, collar: gen > 1, gen: gen, m: 1, vOff: rr(0, 4) });
    P.count[gen]++;
    if (gen >= 3) return;
    for (k = 0; k < sk.lat.length; k++){
      var tb = sk.lat[k].tb, NP = sk.NP;
      var fi = tb * (NP - 1), i0 = Math.floor(fi), fr = fi - i0;
      if (i0 >= NP - 1){ i0 = NP - 2; fr = 1.0; }
      var cs = ad(ml(sk.pts[i0], 1 - fr), ml(sk.pts[i0 + 1], fr));
      var rp = mixf(sk.rads[i0], sk.rads[i0 + 1], fr);
      var hdc = rotY(sk.head[i0 + 1], sk.lat[k].ang);
      if (P.seaward){
        /* never back into the bank: at most 80 deg off seaward (along the bank is allowed: those lie on the soil) */
        var ha = Math.atan2(hdc[0], -hdc[2]), hl = 80 * D2R, sa = Math.atan2(P.seaward[0], -P.seaward[2]);
        if (ha > sa + hl) ha = sa + hl; if (ha < sa - hl) ha = sa - hl;
        hdc = [Math.sin(ha), 0, -Math.cos(ha)];
      }
      var Lc = sk.L * rr(0.62, 0.78) * (gen === 1 ? 0.75 : 0.85);
      var rc = rp * sk.lat[k].ratio;
      if (rc < 0.022 || cs[1] < -0.35) continue;                /* nothing to see under the water */
      var child = armSkel(cs, hdc, Lc, rc, gen + 1, P, sk.roll + k * GOLD);   /* ring 0 sits on the parent's axis, inside it */
      armSweep(B, child, P);
    }
  }
  function arm(B, S, H, L, r0, gen, P, roll){ armSweep(B, armSkel(S, H, L, r0, gen, P, roll), P); }

  /* a thin surface root creeping down the bank into the water */
  function rootlet(B, S, H, L, r0, P){
    var NP = 10, pts = [], rads = [], i;
    var ph = rr(0, TAU);
    var perp = [-H[2], 0, H[0]];
    for (i = 0; i < NP; i++){
      var t = i / (NP - 1);
      var lw = L * 0.06 * Math.sin(TAU * (t * 0.8 + ph));
      var p = ad(ad(S, ml(H, L * t)), ml(perp, lw));
      var r = 0.012 + (r0 - 0.012) * taper(t);
      var gy = P.ground(p[0], p[2]);
      p[1] = gy + r * 0.55;
      pts.push(p); rads.push(r);
      if (P.rings) P.rings.push({ y: p[1], r: r, gy: gy, land: gy >= -0.05, gen: 3 });
    }
    pushTube(B, pts, rads, 5, { colf: P.colf, cap: true, gen: 3, m: 1, vOff: rr(0, 4) });
    P.count[3]++;
  }

  /* the soil under the main roots.  a ridge point: the soil is pulled up to y over radius R */
  var RIDGES = [], RIDGE_MIN_GY = 0.30, RIDGE_MAX_RISE = 0.50;
  function ridgeY(x, z, y){
    var k, out = y;
    for (k = 0; k < RIDGES.length; k++){
      var R = RIDGES[k];
      var dx = x - R.x; if (dx > R.R || dx < -R.R) continue;
      var dz = z - R.z; if (dz > R.R || dz < -R.R) continue;
      var cand = y + (R.y - y) * bump(hyp(dx, dz) / R.R);
      if (cand > out) out = cand;
    }
    return out;
  }

  /* one stock, phase A: the main root's skeleton on the base soil, and the ridges it asks for */
  function stockSkel(R){
    srand(R.seed);
    var P = { ground: terrainY, colf: null, yEnd: -1.2, riseMin: 0.10, riseMax: 0.20, diveT: 0.28,
              sink: true, sinkRule: true, seaward: R.sea, count: [0, 0, 0, 0], rings: null };
    var psi = rr(-14, 14) * D2R;
    var H = rotY(R.sea, psi);
    var y0 = terrainY(R.x, R.z) + 0.04;
    var S = [R.x - H[0] * 0.9, y0, R.z - H[2] * 0.9];            /* starts 0.9 m inside the soil */
    var L = rr(2.6, 3.8) + 0.9;
    var r0 = rr(0.21, 0.29);                                    /* diameter 0.42 .. 0.58 */
    var sk = armSkel(S, H, L, r0, 1, P, rr(0, TAU));
    var i, asked = 0, capped = 0;
    for (i = 0; i < sk.pts.length; i++){
      var t = i / (sk.pts.length - 1);
      if (t < 0.12) continue;
      var p = sk.pts[i], r = sk.rads[i];
      var gy = terrainY(p[0], p[2]);
      if (gy < RIDGE_MIN_GY) continue;                         /* at the water's edge and over the water: the root overhangs */
      var target = p[1] - 0.65 * r;                            /* the ring bottom 0.35 r under the soil */
      if (target > gy + RIDGE_MAX_RISE){ target = gy + RIDGE_MAX_RISE; capped++; }   /* no wall of soil: the buttress is at most this tall */
      if (target > gy){ RIDGES.push({ x: p[0], z: p[2], y: target, R: Math.max(3.0 * r, 0.45) }); asked++; }
    }
    return { R: R, P: P, sk: sk, ridges: asked, capped: capped };
  }
  /* phase B: the skin and the laterals on the final soil, plus the surface rootlets */
  function stockSweep(B, st, rings){
    var R = st.R, P = st.P, i;
    srand(R.seed + 7);
    P.colf = barkColFn(terrainY);
    P.rings = rings;
    for (i = 0; i < st.sk.pts.length; i++){
      var t = i / (st.sk.pts.length - 1);
      if (t < 0.16) continue;
      var p = st.sk.pts[i], gy = terrainY(p[0], p[2]);
      rings.push({ y: p[1], r: st.sk.rads[i], gy: gy, land: gy >= -0.05, edge: gy < RIDGE_MIN_GY, gen: 1 });
    }
    armSweep(B, st.sk, P);
    /* surface roots from the collar: two along the bank top (seen from the path), one or two down to the water */
    var m, nr = rnd() < 0.5 ? 4 : 3;
    for (m = 0; m < nr; m++){
      var along = (m < 2);
      var ps = along ? ((m === 0 ? 1 : -1) * rr(70, 110)) * D2R : rr(-50, 50) * D2R;
      var Hr = rotY(R.sea, ps);
      var Sr = [R.x + rr(-0.4, 0.4) + Hr[0] * 0.1, 0, R.z + Hr[2] * 0.1 + rr(-0.2, 0.2)];
      if (along) rootlet(B, Sr, Hr, rr(2.4, 4.0), rr(0.06, 0.11), P);
      else rootlet(B, Sr, Hr, rr(1.6, 2.6), rr(0.04, 0.065), P);
    }
    return P.count;
  }

  /* ------------------------------------------------------------------ *
   * 9.  the square face (slab carried over from v2; arms go to the roots mesh)
   * ------------------------------------------------------------------ */
  var FACE_NW = 18;
  function faceProfile(rx, rz, rc, lumpf){
    var out = [], c, k;
    var cx = rx - rc, cz = rz - rc;

    "  // the water's marks on the pale slab: y 0.3..0.5, and the wet foot",

    "  float underF = 1.0 - smoothstep(0.0, 0.30, vW.y);",
    "  alb *= mix(vec3(1.0), vec3(0.66, 0.63, 0.60), markF * 0.85);",
    "  alb *= mix(1.0, 0.80, underF);",
    "  rough = mix(rough, 0.32, underF);",
    "  // light: sky irradiance + the two suns",
    "  float dL = max(dot(Nm, uSunL), 0.0);",
    "  float dS = max(dot(Nm, uSunS), 0.0);",
    "  vec3 lit = uColL * (0.92 * dL) + uColS * (0.26 * dS);",
    "  lit += uWarm * (0.36 * dL * dL);",
    "  vec3 col = alb * (h53Amb(Nm) + lit);",
    "  // water bounce (contract c2 s3): the underside, and the low part of a wall",
    "  float down = clamp(-Nm.y, 0.0, 1.0);",
    "  float lowv = (1.0 - Nm.y * Nm.y) * (1.0 - smoothstep(0.0, 1.6, vW.y)) * 0.35;",
    "  float wb = clamp(down + lowv, 0.0, 1.0) * smoothstep(-0.30, 0.0, vW.y);",
    "  vec3 water_bounce = h53Sky(normalize(vec3(Nm.x, 0.02, Nm.z - 0.0001))) * 0.06;",
    "  vec3 nh = normalize(vec3(-Nm.x, 0.0, -Nm.z + 0.0001));",
    "  float inL = pow(max(dot(normalize(vec3(uSunL.x, 0.0, uSunL.z)), nh), 0.0), 8.0);",
    "  float inS = pow(max(dot(normalize(vec3(uSunS.x, 0.0, uSunS.z)), nh), 0.0), 8.0);",
    "  water_bounce += (uColL * inL + uColS * inS) * 0.25;",
    "  col += alb * water_bounce * wb;",
    "  // specular: normalised Blinn-Phong from the roughness, Schlick fresnel",
    "  vec3 H1 = normalize(V + uSunL);",
    "  vec3 H2 = normalize(V + uSunS);",
    "  float a2 = rough * rough; a2 = a2 * a2;",
    "  float ne = clamp(2.0 / a2 - 2.0, 2.0, 512.0);",
    "  float dn = (ne + 2.0) / 25.1327;",
    "  float f1 = 0.04 + 0.96 * pow(1.0 - max(dot(V, H1), 0.0), 5.0);",
    "  float f2 = 0.04 + 0.96 * pow(1.0 - max(dot(V, H2), 0.0), 5.0);",
    "  float g1 = clamp(dot(Nm, uSunL) * 10.0, 0.0, 1.0);",
    "  float g2 = clamp(dot(Nm, uSunS) * 10.0, 0.0, 1.0);",
    "  vec3 spec = uColL * (dn * pow(max(dot(Nm, H1), 0.0), ne) * f1 * g1 * dL)",
    "            + uColS * (dn * pow(max(dot(Nm, H2), 0.0), ne) * f2 * g2 * dS * 0.6);",
    "  col += min(spec, vec3(2.0));",
    "  // rim (contract c2 s4).  K 0.03 for the pale slab",
    "  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);",
    "  float sunL = max(dot(N, uSunL), 0.0);",
    "  float sunS = max(dot(N, uSunS), 0.0);",
    "  col += (uColL * sunL + uColS * sunS) * rim * 0.03;",
    "  col *= 1.0 + 0.02 * underF * sin(6.28318530718 * uTime / " + PUMP.toFixed(3) + ");",
    "  col = mix(col, h53Sky(normalize(vW - cameraPosition)), h53Fog(dist));",
    "  gl_FragColor = vec4(col, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <encodings_fragment>",
    "}"
  ].join("\n");

  function makeFaceNoise(){
    var N = 256;
    var H = makeField(N, function(u, v){
      var o, px = 6, amp = 1, sum = 0, nn = 0;
      for (o = 0; o < 5; o++){ sum += amp * pnoise(u * px, v * px, px, px, 11 + o); nn += amp; px *= 2; amp *= 0.7; }
      return sum / nn;
    });
    return normalTex(N, H);
  }
  function makeFaceMat(){
    return new T.ShaderMaterial({
      uniforms: {
        uSunL: U.uSunL, uSunS: U.uSunS,
        uColL: U.uColL, uColS: U.uColS, uWarm: U.uWarm,
        uFogC: U.uFogC, uFogN: U.uFogN, uFogF: U.uFogF,
        uTime: U.uTime,
        uNoise: { value: makeFaceNoise() }
      },
      vertexShader: VS,
      fragmentShader: FS,
      vertexColors: true,
      side: T.DoubleSide,
      fog: false
    });
  }

  /* (b) standard materials.  kind: 'ground' 'path' 'bark' 'stone' */
  function stdInject(kind){
    var hasD = (kind === 'ground' || kind === 'path');
    var K = (kind === 'bark') ? 0.025 : 0.02;
    var wetR = (kind === 'bark') ? 0.30 : 0.35;
    var specK = (kind === 'bark') ? 0.40 : (kind === 'stone' ? 0.60 : 0.22);   /* dry soil and bark: GGX at grazing backlight gave a clay sheen at 1.0 */
    var specW = (kind === 'bark') ? 0.55 : 0.75;                                 /* the wet band's share of the full specular */
    var skyRim = (kind === 'bark') ? 0.14 : (kind === 'stone' ? 0.10 : 0.06);
    return function(shader){
      shader.uniforms.uSunL = U.uSunL; shader.uniforms.uSunS = U.uSunS;
      shader.uniforms.uColL = U.uColL; shader.uniforms.uColS = U.uColS; shader.uniforms.uWarm = U.uWarm;
      shader.uniforms.uFogN = U.uFogN; shader.uniforms.uFogF = U.uFogF;
      shader.vertexShader = (hasD ? "attribute float aD;\n" : "") + "varying vec3 vW; varying float vD;\n" + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace("#include <worldpos_vertex>", [
        "#include <worldpos_vertex>",
        "vec4 h53wp = vec4(transformed, 1.0);",
        "#ifdef USE_INSTANCING",
        "  h53wp = instanceMatrix * h53wp;",
        "#endif",
        "vW = (modelMatrix * h53wp).xyz;",
        hasD ? "vD = aD;" : "vD = 5.0;"
      ].join("\n"));
      var wet;
      if (kind === 'ground' || kind === 'path'){
        /* the wet band 0.45 m landward of the water line; the bed under the water darker still */
        wet = [
          "float h53wet = max(1.0 - smoothstep(0.35, 0.55, vD), 1.0 - smoothstep(0.12, 0.28, vW.y));",
          "float h53und = 1.0 - smoothstep(-0.06, 0.02, vW.y);",
          "diffuseColor.rgb *= mix(1.0, 0.55, h53wet) * mix(1.0, 0.7273, h53und);"
        ].join("\n");
      } else if (kind === 'bark'){
        wet = [
          "float h53wet = 1.0 - smoothstep(0.20, 0.32, abs(vW.y));",
          "diffuseColor.rgb *= mix(1.0, 0.60, h53wet);"
        ].join("\n");
      } else {
        wet = [
          "float h53wet = 1.0 - smoothstep(0.02, 0.35, vW.y);",
          "diffuseColor.rgb *= mix(1.0, 0.62, h53wet);"
        ].join("\n");
      }
      shader.fragmentShader = GLSL_SKY + "\nvarying vec3 vW; varying float vD;\n" + shader.fragmentShader;
      shader.fragmentShader = shader.fragmentShader
        .replace("#include <color_fragment>", "#include <color_fragment>\n" + wet)
        .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, " + wetR.toFixed(2) + ", h53wet);")
        .replace("#include <lights_fragment_end>", [
          "#include <lights_fragment_end>",
          "float h53spec = mix(" + specK.toFixed(2) + ", " + specW.toFixed(2) + ", h53wet);",
          "reflectedLight.directSpecular *= h53spec;",
          "reflectedLight.indirectSpecular *= h53spec;"
        ].join("\n"))
        .replace("#include <lights_fragment_begin>", [
          "#include <lights_fragment_begin>",
          "vec3 h53N = inverseTransformDirection(normal, viewMatrix);",
          "irradiance = h53Amb(h53N) * PI;"
        ].join("\n"))
        .replace("#include <aomap_fragment>", [
          "#include <aomap_fragment>",
          "vec3 h53G = inverseTransformDirection(geometryNormal, viewMatrix);",
          "vec3 h53V = normalize(cameraPosition - vW);",
          "float h53rim = pow(1.0 - max(dot(h53G, h53V), 0.0), 3.0);",
          "totalEmissiveRadiance += (uColL * max(dot(h53G, uSunL), 0.0) + uColS * max(dot(h53G, uSunS), 0.0)) * h53rim * " + K.toFixed(3) + ";",
          "// the sky's own grazing reflection on the silhouette (the horizon band on the top edge of a root)",
          "totalEmissiveRadiance += h53Sky(reflect(-h53V, h53G)) * h53rim * " + skyRim.toFixed(3) + " * mix(1.0, 2.5, h53wet);",
          (kind === 'bark') ? [
            "float h53down = clamp(-h53N.y, 0.0, 1.0) * smoothstep(-0.30, 0.0, vW.y);",
            "vec3 h53wb = h53Sky(normalize(vec3(h53N.x, 0.02, h53N.z - 0.0001))) * 0.06;",
            "vec3 h53nh = normalize(vec3(-h53N.x, 0.0, -h53N.z + 0.0001));",
            "float h53inL = pow(max(dot(normalize(vec3(uSunL.x, 0.0, uSunL.z)), h53nh), 0.0), 8.0);",
            "float h53inS = pow(max(dot(normalize(vec3(uSunS.x, 0.0, uSunS.z)), h53nh), 0.0), 8.0);",
            "h53wb += (uColL * h53inL + uColS * h53inS) * 0.25;",
            "totalEmissiveRadiance += diffuseColor.rgb * h53wb * h53down;"
          ].join("\n") : ""
        ].join("\n"))
        .replace("#include <tonemapping_fragment>", [
          "gl_FragColor.rgb = mix(gl_FragColor.rgb, h53Sky(normalize(vW - cameraPosition)), h53Fog(length(vW - cameraPosition)));",
          "#include <tonemapping_fragment>"
        ].join("\n"));
    };
  }
  function makeStd(kind){
    var tx = makeTextures();
    var m = new T.MeshStandardMaterial({ color: 0xffffff, metalness: 0.0, vertexColors: true, envMap: makeEnv(), envMapIntensity: 0.7 / ENV_SCALE });
    if (kind === 'ground'){ m.roughness = 1.0; m.normalMap = tx.soilN; m.normalScale = new T.Vector2(0.12, 0.12); m.roughnessMap = tx.soilR; }
    else if (kind === 'path'){ m.roughness = 0.87; m.normalMap = tx.soilN; m.normalScale = new T.Vector2(0.05, 0.05); m.roughnessMap = tx.soilR; m.transparent = true; }
    else if (kind === 'bark'){ m.roughness = 1.0; m.normalMap = tx.barkN; m.normalScale = new T.Vector2(0.20, 0.20); m.roughnessMap = tx.barkR; }
    else { m.roughness = 0.85; m.vertexColors = false; }
    m.onBeforeCompile = stdInject(kind);
    m.customProgramCacheKey = function(){ return 'h53-shore-' + kind; };
    return m;
  }

  function toGeo(B){
    B.normals();
    var g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(B.p, 3));
    g.setAttribute("normal", new T.Float32BufferAttribute(B.n, 3));
    g.setAttribute("color", new T.Float32BufferAttribute(B.c, 3));
    g.setAttribute("uv", new T.Float32BufferAttribute(B.uv, 2));
    g.setAttribute("aTan", new T.Float32BufferAttribute(B.tn, 3));
    g.setAttribute("aM", new T.Float32BufferAttribute(B.m, 1));
    g.setAttribute("aD", new T.Float32BufferAttribute(B.d, 1));
    g.setIndex(new T.Uint32BufferAttribute(B.i, 1));
    g.computeBoundingSphere();
    return g;
  }

  /* ------------------------------------------------------------------ *
   * 12.  the stones
   * ------------------------------------------------------------------ */
  /* an icosahedron with its twelve vertices shared and jittered, normals smooth:
     twenty faces read as a worn pebble rather than a cut stone */
  function pebbleGeo(){
    var tphi = (1 + Math.sqrt(5)) / 2, i;
    var V = [[-1, tphi, 0], [1, tphi, 0], [-1, -tphi, 0], [1, -tphi, 0], [0, -1, tphi], [0, 1, tphi],
             [0, -1, -tphi], [0, 1, -tphi], [tphi, 0, -1], [tphi, 0, 1], [-tphi, 0, -1], [-tphi, 0, 1]];
    var F = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
             [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    srand(5150);
    var pos = [], nor = [], idx = [];
    for (i = 0; i < 12; i++){
      var v = nrm(V[i]);
      var sc = rr(0.84, 1.14);
      pos.push(v[0] * sc, v[1] * sc, v[2] * sc);
      nor.push(v[0], v[1], v[2]);
    }
    for (i = 0; i < 20; i++) idx.push(F[i][0], F[i][1], F[i][2]);
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
    g.setIndex(idx);
    g.computeBoundingSphere();
    return g;
  }
  function buildStones(){
    srand(9091);
    var N = 1600, geo = pebbleGeo(), mat = makeStd('stone');
    var im = new T.InstancedMesh(geo, mat, N);
    var m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), pos = new T.Vector3(), sc = new T.Vector3(), col = new T.Color();
    var placed = 0, tries = 0, o = {}, nearWater = 0, byPath = 0;
    while (placed < N && tries < 400000){
      tries++;
      var want = (placed < N * 0.6) ? 0 : 1;
      var x = rr(-48, 48), z = rr(-22, 12);
      if (x > 14.5 && x < 25.5 && z < 8.5) continue;
      var d = dLand(x, z);
      if (want === 0){ if (d < 0.05 || d > 3.0) continue; if (rnd() > Math.pow(1.0 - (d - 0.05) / 2.95, 1.2) + 0.15) continue; }
      else { var ad2 = Math.abs(d - pathD(x)); if (ad2 < PATH_HW + 0.05 || ad2 > 1.45) continue; }
      if (want === 1 && d < 0.05) continue;
      var w = roadW(d, x);
      if (w > 0.35) continue;
      var y = terrainY(x, z, o);
      if (y < -0.02) continue;
      var r = 0.015 + 0.055 * Math.pow(rnd(), 2.2);          /* diameter 0.03 .. 0.14, mostly small */
      var sx = r * rr(0.8, 1.3), sy = r * rr(0.55, 0.85), sz = r * rr(0.8, 1.3);
      e.set(rr(-0.25, 0.25), rr(0, TAU), rr(-0.25, 0.25));
      q.setFromEuler(e);
      pos.set(x, y + 0.8 * sy, z);          /* sunk a tenth of its height */
      sc.set(sx, sy, sz);
      m4.compose(pos, q, sc);
      im.setMatrixAt(placed, m4);
      var g = 1.0 + rr(-0.08, 0.08);
      var wetK = 1.0 - 0.35 * (1.0 - sstep(0.35, 0.55, d));
      col.setRGB(COL_STONE[0] * g * wetK, COL_STONE[1] * g * wetK, COL_STONE[2] * g * wetK);
      im.setColorAt(placed, col);
      if (want === 0) nearWater++; else byPath++;
      placed++;
    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.name = 'shore-stones';
    im.frustumCulled = false;
    return { mesh: im, placed: placed, tries: tries, nearWater: nearWater, byPath: byPath, tris: placed * 20 };
  }

  /* ------------------------------------------------------------------ *
   * 13.  build
   * ------------------------------------------------------------------ */
  var _diag = {};

  function build(){
    var k, i;
    var scene = window.CF.scene;
    var mins = layout();

    /* the main roots' skeletons first: they decide where the soil is raised under them */
    var stocks = [], ridgesAsked = 0, ridgesCapped = 0;
    for (k = 0; k < ROOTS.length; k++){ var stk = stockSkel(ROOTS[k]); stocks.push(stk); ridgesAsked += stk.ridges; ridgesCapped += stk.capped; }

    /* the ground */
    var Bg = new Builder();
    var gridInfo = buildGround(Bg);
    var mg = new T.Mesh(toGeo(Bg), makeStd('ground'));
    mg.name = "shore-ground";
    mg.frustumCulled = false;
    scene.add(mg);

    /* the path */
    var pth = buildPath();
    var mp = new T.Mesh(pth.geo, makeStd('path'));
    mp.name = "shore-path";
    mp.frustumCulled = false;
    mp.renderOrder = 1;
    scene.add(mp);

    /* the stones */
    var st = buildStones();
    scene.add(st.mesh);

    /* the roots (twelve stocks + the arms of the face), one mesh */
    var Br = new Builder(), rings = [], stockCounts = [];
    for (k = 0; k < ROOTS.length; k++) stockCounts.push(stockSweep(Br, stocks[k], rings));
    var trisStocks = Br.tris();
    var Bf = new Builder();
    var faceCounts = buildFace(Bf, Br);
    var trisArms = Br.tris() - trisStocks;
    var mr = new T.Mesh(toGeo(Br), makeStd('bark'));
    mr.name = "shore-roots";
    mr.userData.h53log = "roots";
    mr.frustumCulled = false;
    scene.add(mr);

    /* the face slab */
    var mf = new T.Mesh(toGeo(Bf), makeFaceMat());
    mf.name = "shore-face";
    mf.userData.h53log = "face";
    scene.add(mf);

    /* ---- self check (ledger 12 and 3) ---- */
    var au = {};
    Bg.audit(au); Br.audit(au); Bf.audit(au);
    function norm(o){
      var r = {}, key;
      for (key in o){
        if (o[key].area !== undefined && o[key].dot !== undefined) r[key] = { faceMean: +(o[key].dot / o[key].area).toFixed(4), tris: o[key].tris, inward: o[key].neg };
        else if (o[key].ny !== undefined) r[key] = { nyMean: +(o[key].ny / o[key].area).toFixed(4), tris: o[key].tris, down: o[key].down };
        else if (o[key].n !== undefined) r[key] = { vertexMean: +(o[key].dot / o[key].n).toFixed(4), n: o[key].n };
      }
      return r;
    }
    /* the ground where things stand */
    var stands = [[0, 9], [STAND2[0], STAND2[1]], [HX, -3.2]];
    var standY = [];
    for (k = 0; k < stands.length; k++) standY.push(+terrainY(stands[k][0], stands[k][1]).toFixed(3));
    /* the height field inside the house walls */
    var hin = { maxYWithinOuterWalls: -1e9, maxYInsideInnerWalls: -1e9, maxYOnSite: -1e9, n: 0 };
    for (k = 0; k <= 60; k++){
      for (i = 0; i <= 60; i++){
        var hx = (H_X0 - H_SITE) + (H_X1 - H_X0 + 2 * H_SITE) * (k / 60), hz = (H_Z0 - H_SITE) + (H_Z1 - H_Z0 + 2 * H_SITE) * (i / 60);
        var hy = terrainY(hx, hz); hin.n++;
        if (hy > hin.maxYOnSite) hin.maxYOnSite = hy;
        if (hx >= H_X0 && hx <= H_X1 && hz >= H_Z0 && hz <= H_Z1 && hy > hin.maxYWithinOuterWalls) hin.maxYWithinOuterWalls = hy;
        if (hx >= H_X0 + H_WALL && hx <= H_X1 - H_WALL && hz >= H_Z0 + H_WALL && hz <= H_Z1 - H_WALL && hy > hin.maxYInsideInnerWalls) hin.maxYInsideInnerWalls = hy;
      }
    }
    hin.maxYWithinOuterWalls = +hin.maxYWithinOuterWalls.toFixed(3);
    hin.maxYInsideInnerWalls = +hin.maxYInsideInnerWalls.toFixed(3);
    hin.maxYOnSite = +hin.maxYOnSite.toFixed(3);
    /* the floating test: ring bottom minus the soil, over land */
    var fl = { landRings: 0, floating: 0, minGap: 1e9, maxGap: -1e9, waterRings: 0, ridgePoints: RIDGES.length, ridgesCapped: ridgesCapped,
               gen1: { land: 0, floating: 0, maxGap: -1e9 } };
    for (k = 0; k < rings.length; k++){
      var R = rings[k];
      if (!R.land){ fl.waterRings++; continue; }
      var gap = (R.y - R.r) - R.gy;
      if (R.gen === 1 && R.edge){
        /* the water's edge (soil under 0.30): the main root overhangs by design */
        fl.gen1.edgeRings = (fl.gen1.edgeRings || 0) + 1;
        if (gap > 0.001) fl.gen1.edgeOverhang = (fl.gen1.edgeOverhang || 0) + 1;
        if (gap > (fl.gen1.edgeMaxGap || -1e9)) fl.gen1.edgeMaxGap = +gap.toFixed(3);
        continue;
      }
      fl.landRings++;
      if (gap > 0.001) fl.floating++;
      if (gap < fl.minGap) fl.minGap = gap;
      if (gap > fl.maxGap) fl.maxGap = gap;
      if (R.gen === 1){ fl.gen1.land++; if (gap > 0.001) fl.gen1.floating++; if (gap > fl.gen1.maxGap) fl.gen1.maxGap = gap; }
    }
    fl.minGap = +fl.minGap.toFixed(3); fl.maxGap = +fl.maxGap.toFixed(3); fl.gen1.maxGap = +fl.gen1.maxGap.toFixed(3);
    /* the water line across the front */
    var wl = [];
    for (k = -12; k <= 12; k += 3) wl.push([k, +shiftT(k).toFixed(2)]);
    var rootsOut = [];
    for (k = 0; k < ROOTS.length; k++) rootsOut.push([+ROOTS[k].x.toFixed(2), +ROOTS[k].z.toFixed(2), +terrainY(ROOTS[k].x, ROOTS[k].z).toFixed(2)]);

    _diag = {
      tris: { ground: Bg.tris(), path: pth.tris, stones: st.tris, stocks: trisStocks, faceArms: trisArms, face: Bf.tris(),
              total: Bg.tris() + pth.tris + st.tris + Br.tris() + Bf.tris() },
      drawCalls: 5,
      grid: gridInfo,
      groundVerts: Bg.p.length / 3,
      audit: norm(au),
      path: { quads: pth.quads, verts: pth.verts, nyMean: +pth.nyMean.toFixed(4), down: pth.foldedTris },
      stones: { placed: st.placed, tries: st.tries, nearWater: st.nearWater, byPath: st.byPath },
      stocks: stockCounts, faceArms: faceCounts,
      roots: rootsOut, waterLineMinima: mins,
      floating: fl,
      groundAtStands: standY,
      stand2: { groundPlusPath: standY[1], eye: 2.70, eyeAboveGround: +(2.70 - standY[1]).toFixed(3) },
      houseInside: hin,
      waterLineFront: wl,
      profile: { y0: +profile(0).toFixed(4), yPath: +profile(PATH_D).toFixed(4), yRoot: +profile(ROOT_D).toFixed(4), slopeOff: +SL_OFF.toFixed(4) }
    };
    window.CF.parts.shore._diag = _diag;
