<script>
(function(){
  "use strict";
  var PUMP_PERIOD = 0.78;              // canonical heartbeat
  var DISC_PERIOD = 2.4;               // canonical conveyor period

  var brain = document.getElementById('brain');
  var aura  = document.getElementById('aura');
  var discs = document.querySelectorAll('#discs .disc');
  var leds  = document.querySelectorAll('.led');
  var sulci = document.querySelectorAll('.sulcus');
  var veins = document.querySelectorAll('.vein');
  var irisA = document.querySelectorAll('.irisA');
  var irisB = document.querySelectorAll('.irisB');

  var BX = 500, BY = 400;
  var Y0 = 574, Y1 = 792;
  var TAU = Math.PI * 2;

  function pumpBeat(t){
    var p = (t % PUMP_PERIOD) / PUMP_PERIOD;
    var s1 = Math.exp(-Math.pow((p - 0.12) / 0.05, 2));
    var s2 = 0.5 * Math.exp(-Math.pow((p - 0.33) / 0.085, 2));
    return s1 + s2;
  }
  function lerp(a,b,u){ return a + (b - a) * u; }

  function frame(now){
    var t = now / 2000;   // global 0.5x time-scale
    var breath = 1 + 0.22 * Math.sin(TAU * t / 6.4);   // slow envelope
    var b = pumpBeat(t) * breath;
    if (b > 1.15) b = 1.15;

    // jelly squash & stretch + systolic surge + micro sway
    var sx = 1 + 0.062 * b;
    var sy = 1 - 0.030 * b + 0.026 * pumpBeat(t - 0.06) * breath;
    var dy = 3.2 * b;
    var rot = 0.7 * Math.sin(TAU * t / 3.1) * (0.3 + 0.7 * b);
    brain.setAttribute('transform',
      'translate(' + BX + ' ' + (BY + dy).toFixed(1) + ') rotate(' + rot.toFixed(2) +
      ') scale(' + sx.toFixed(4) + ' ' + sy.toFixed(4) + ')');
    aura.setAttribute('opacity', Math.min(1, 0.30 + 0.62 * b).toFixed(3));

    var i, so = (0.40 + 0.38 * b).toFixed(3), vo = (0.10 + 0.62 * b).toFixed(3);
    for (i = 0; i < sulci.length; i++) sulci[i].setAttribute('opacity', so);
    for (i = 0; i < veins.length; i++) veins[i].setAttribute('opacity', vo);

    // LEDs: per-unit irregular blink, all-flash on systole
    for (i = 0; i < leds.length; i++) {
      var w = 1.3 + 0.53 * i, ph = i * 2.39;
      var on = Math.sin(TAU * t * w / 3 + ph) > 0.35 || b > 0.9;
      leds[i].setAttribute('fill', on ? '#5ff2ff' : '#0e5560');
      leds[i].setAttribute('r', on ? '4.6' : '3.4');
    }

    // discs: straight descent, diameter -> 0 at the sink; upper always in front
    var n = discs.length, ps = [];
    for (var j = 0; j < n; j++) ps.push(((t / DISC_PERIOD) + j / n) % 1);
    ps.sort(function(a, c){ return c - a; });  // slot0 = largest p = lowest = back
    for (j = 0; j < n; j++) {
      var p = ps[j];
      var y = lerp(Y0, Y1, p);
      var sc = 1 - p;
      var op = p < 0.05 ? p / 0.05 : 1;        // spawn-in only; exit is pure shrink
      discs[j].setAttribute('transform',
        'translate(500 ' + y.toFixed(1) + ') scale(' + sc.toFixed(4) + ')');
      discs[j].setAttribute('opacity', op.toFixed(3));
      var m = 0.5 + 0.5 * Math.sin(TAU * t / 5 + p * 6.283);
      irisA[j].setAttribute('opacity', (0.38 * m).toFixed(3));
      irisB[j].setAttribute('opacity', (0.38 * (1 - m)).toFixed(3));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
