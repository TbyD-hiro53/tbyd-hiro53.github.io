function buildGrain(){

for(var i=0;i<img.data.length;i+=4){var v=(Math.random()*255)|0;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;}
gc.putImageData(img,0,0);

function buildAtlas(){
var pad=2;
atlasCell=Math.ceil((fontPx+pad*2)*dpr);
atlas=document.createElement('canvas');
atlas.width=atlasCell*CHARS.length;
atlas.height=atlasCell*4;
var g=atlas.getContext('2d');
g.clearRect(0,0,atlas.width,atlas.height);
g.textAlign='center';
g.textBaseline='middle';
g.font='700 '+Math.round(fontPx*dpr)+'px "Courier New","Hiragino Kaku Gothic ProN","Yu Gothic",Osaka-mono,monospace';
for(var v=0;v<4;v++){
g.shadowBlur=0;
g.fillStyle=(v<3)?PALETTE[v].main:WHITE.main;
for(var i=0;i<CHARS.length;i++){
var cx=i*atlasCell+atlasCell*0.5,cy=v*atlasCell+atlasCell*0.5;
g.fillText(CHARS[i],cx,cy);
if(v===3){g.fillText(CHARS[i],cx,cy);}
}
}
g.shadowBlur=0;
}

function drawCell(g,i,variant,alpha){
var c=i%cols,r=(i-c)/cols;
var dS=atlasCell/dpr;
var dx=c*cell+cell*0.5-dS*0.5;
var dy=r*cell+cell*0.5-dS*0.5;
g.globalAlpha=alpha;
g.drawImage(atlas,cellChar[i]*atlasCell,variant*atlasCell,atlasCell,atlasCell,dx,dy,dS,dS);
g.globalAlpha=1;
}

function renderStaticCell(i){
var c=i%cols,r=(i-c)/cols;
ctxStatic.clearRect(c*cell,r*cell,cell,cell);
drawCell(ctxStatic,i,cellColor[i],ambA[i]);
}

function renderFigCell(i){
var c=i%cols,r=(i-c)/cols;
ctxFig.clearRect(c*cell,r*cell,cell,cell);
var L=figL[i];
drawCell(ctxFig,i,figCl[i],0.30+0.70*L);
if(L>0.5){drawCell(ctxFig,i,3,Math.min(1,(L-0.5)*1.9));}
}

function writeChar(i,chI,colr){
cellChar[i]=chI;
if(colr!==undefined){cellColor[i]=colr;}
renderStaticCell(i);
if(figCl[i]!==255){renderFigCell(i);}
}

function buildFigureMap(){
figSide=Math.min(W*0.96,H*0.70);
figX=(W-figSide)*0.5;
figY=H*0.46-figSide*0.5;
figList=[];
for(var i=0;i<nCells;i++){figCl[i]=255;figL[i]=0;}
for(var r=0;r<rows;r++){
for(var c=0;c<cols;c++){
var px=c*cell+cell*0.5,py=r*cell+cell*0.5;
var u=(px-figX)/figSide,v=(py-figY)/figSide;
if(u<0||u>=1||v<0||v>=1)continue;
var sumL=0,cnt0=0,cnt1=0,cnt2=0,hits=0;
for(var sy=-1;sy<=1;sy+=2){
for(var sx=-1;sx<=1;sx+=2){
var uu=u+sx*0.25*cell/figSide,vv=v+sy*0.25*cell/figSide;
if(uu<0)uu=0;if(uu>0.9999)uu=0.9999;
if(vv<0)vv=0;if(vv>0.9999)vv=0.9999;
var b=figData[((vv*FIG_H)|0)*FIG_W+((uu*FIG_W)|0)];
var cls=b>>6;
if(cls===3)continue;
sumL+=(b&63);hits++;
if(cls===0)cnt0++;else if(cls===1)cnt1++;else cnt2++;
}
}
if(hits===0)continue;
var best=0,bc=cnt0;
if(cnt1>bc){best=1;bc=cnt1;}
if(cnt2>bc){best=2;}
var Ln=(sumL/hits)/63;
if(Ln<0.04)continue;
var idx=r*cols+c;
figCl[idx]=best;
figL[idx]=Ln;
figList.push(idx);
}
}
}

function newStream(c,init){
var s={c:c,head:0,speed:12,word:WORDS[0],wi:0,color:0,last:0,prevIdx:-1};
resetStream(s,init);
return s;
}
function resetStream(s,init){
s.word=WORDS[(Math.random()*WORDS.length)|0];
s.wi=(Math.random()*s.word.length)|0;
var wr=Math.random();
s.color=(wr<0.45)?0:((wr<0.78)?1:2);
s.speed=9+Math.random()*13;
s.head=init?(Math.random()*rows):(-2-Math.random()*rows*0.6);
s.last=Math.floor(s.head)-1;
s.prevIdx=-1;
}
function updateStream(s,dt){
s.head+=s.speed*dt;
var fh=Math.floor(s.head);
while(s.last<fh){
s.last++;
var r=s.last;
var ch=s.word.charAt(((s.wi%s.word.length)+s.word.length)%s.word.length);
s.wi++;
if(r<0||r>=rows){
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);s.prevIdx=-1;}
continue;
}
if(ch===' '){
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);s.prevIdx=-1;}
continue;
}
var i=r*cols+s.c;
writeChar(i,charIdx[ch],s.color);
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);}
drawCell(ctxRain,i,3,1);
s.prevIdx=i;
}
if(s.head>rows+3){resetStream(s,false);}
}

function prefill(){
for(var c=0;c<cols;c++){
var w=streams[c].word;
var off=(Math.random()*w.length)|0;
for(var r=0;r<rows;r++){
var ch=w.charAt((off+r)%w.length);
var chI=(ch===' ')?((Math.random()*CHARS.length)|0):charIdx[ch];
writeChar(r*cols+c,chI,streams[c].color);
}
}
}

function mkLayer(){
var l=document.createElement('canvas');
l.width=Math.max(2,Math.round(W*dpr));

var g=l.getContext('2d');
g.setTransform(dpr,0,0,dpr,0,0);
return {cv:l,g:g};
}

function smooth01(x){if(x<0)x=0;if(x>1)x=1;return x*x*(3-2*x);}
function revealEnv(){
if(t>=autoNext){revealStart=t;autoNext=t+16;}
var u=t-revealStart;
if(u<0||u>8.2)return 0;
if(u<1.6)return smooth01(u/1.6);
if(u>6.2)return 1-smooth01((u-6.2)/2.0);

}

}

var dt=nowS-last;
last=nowS;
if(dt>0.05)dt=0.05;
if(dt<0)dt=0;
t+=dt;
var env=revealEnv();
/* rain layer: classic fade + head writes (同一グリッド上) */
ctxRain.globalCompositeOperation='source-over';
var fa=1-Math.pow(0.956,dt*60);
ctxRain.fillStyle='rgba(0,0,0,'+fa.toFixed(4)+')';
ctxRain.fillRect(0,0,W,H);
var s;
for(s=0;s<streams.length;s++){updateStream(streams[s],dt);}
/* char mutation flicker — グリッド文字自体を変異(全レイヤーへ伝播) */
var muts=Math.max(6,(nCells*0.0045)|0);
for(var m=0;m<muts;m++){
var mi=(Math.random()*nCells)|0;
writeChar(mi,(Math.random()*CHARS.length)|0);
}
/* composite */
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
ctx.fillStyle='#000000';
ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
ctx.globalAlpha=0.10+0.20*env;
ctx.drawImage(layStatic,0,0,layStatic.width,layStatic.height,0,0,W,H);
ctx.globalAlpha=1-0.35*env;
ctx.drawImage(layRain,0,0,layRain.width,layRain.height,0,0,W,H);
if(env>0.012){
ctx.globalAlpha=Math.min(1,env*(0.86+0.14*pumpBeat(t)));
ctx.drawImage(layFig,0,0,layFig.width,layFig.height,0,0,W,H);
}
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
if(grainPat){
ctx.globalAlpha=0.055;
var gx=(Math.random()*96)|0,gy=(Math.random()*96)|0;
ctx.save();
ctx.translate(-gx,-gy);
ctx.fillStyle=grainPat;
ctx.fillRect(0,0,W+96,H+96);
ctx.restore();
}
ctx.globalAlpha=1;
ctx.fillStyle=vignette;
ctx.fillRect(0,0,W,H);
requestAnimationFrame(frame);
}

var rsTimer=null;
window.addEventListener('resize',function(){
if(rsTimer){clearTimeout(rsTimer);}
rsTimer=setTimeout(rebuild,160);
});
window.addEventListener('touchstart',function(e){e.preventDefault();summon();},{passive:false});
window.addEventListener('mousedown',function(){summon();});

rebuild();
buildGrain();
requestAnimationFrame(frame);
})();
</script>

<script>
/* ---- h!ro53 iOS standalone hardening ---- */
(function(){
  // 1) FontLoader: XHRを一切使わず埋め込みJSONから解決（file://のCORSブロック回避）
  if (window.THREE && THREE.FontLoader) {
    THREE.FontLoader.prototype.load = function(url, onLoad, onProgress, onError){
      try{
        var key = (String(url).indexOf('bold') >= 0) ? 'bold' : 'regular';
        var d = window.__H53_FONTS[key] || window.__H53_FONTS.bold || window.__H53_FONTS.regular;
        var f = this.parse(d);
        setTimeout(function(){ if(onLoad) onLoad(f); }, 0);
        return f;
      }catch(e){ if(onError) onError(e); }
    };
  }
  // 2) WebGLコンテキストロスト（iOSのメモリ圧で頻発）→ 自動復帰
  window.addEventListener('DOMContentLoaded', function(){
    var c = document.querySelector('canvas'); if(!c) return;
    c.addEventListener('webglcontextlost', function(e){ e.preventDefault(); }, false);
    c.addEventListener('webglcontextrestored', function(){ location.reload(); }, false);
  });
  // 3) WebGL不可時に黒画面ではなく理由を出す
  window.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){
      if(document.querySelector('canvas')) return;
      var d=document.createElement('div');
      d.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'+
        'color:#f0f;background:#000;font:12px/1.8 -apple-system,sans-serif;text-align:center;padding:24px;z-index:9999';
      d.textContent='WebGL initialization failed. Safariで開き直してください。';
      document.body.appendChild(d);
    }, 2500);
  });
})();
</script>
