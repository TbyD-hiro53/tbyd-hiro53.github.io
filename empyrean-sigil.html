<script>
(function(){
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  var CX = 640, CY = 246, TAU = Math.PI * 2;

  var PUMP_PERIOD = 0.78;          // canonical heartbeat
  var DISC_PERIOD = 2.4;           // canonical conveyor period
  var SLOW = 2;                    // 全モーションを半速に
  var DISC_CYCLE = DISC_PERIOD * SLOW / 0.7;    // 速度を7割へ
  var RING_CYCLE = 3.4 * SLOW / 0.8;            // 速度を8割へ

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs){
    var n = document.createElementNS(SVGNS, tag), k;
    for (k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---- 背景切替（既定は黒） ----
  var THEMES = {
    dark:  { '--bg':'#0b0b0f', '--frame':'#a83a68', '--rb':'#8fd3d8', '--rf':'#4fbfc6',
             '--disc-st':'#8d939e', '--btn':'rgba(255,231,244,.86)', '--btn-bd':'rgba(255,130,210,.40)', '--btn-bg':'rgba(34,18,38,.55)',
             '--cr1':'#9aa2b0', '--cr2':'#f4f6fa', '--cr3':'#8b93a1' },
    light: { '--bg':'#ffffff', '--frame':'#8e2b53', '--rb':'#2fb8c6', '--rf':'#167a86',
             '--disc-st':'#6b7280', '--btn':'rgba(40,20,34,.86)', '--btn-bd':'rgba(160,40,110,.34)', '--btn-bg':'rgba(255,255,255,.70)',
             '--cr1':'#7d8694', '--cr2':'#dfe4ea', '--cr3':'#6f7784' }
  };
  var isLight = false;
  var btn = document.getElementById('bgbtn');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyBg(light){
    isLight = !!light;
    var th = THEMES[isLight ? 'light' : 'dark'], root = document.documentElement, k;
    for (k in th) root.style.setProperty(k, th[k]);
    root.setAttribute('data-bg', isLight ? 'light' : 'dark');
    btn.textContent = isLight ? 'BG · LIGHT' : 'BG · DARK';
    btn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
    if (themeMeta) themeMeta.setAttribute('content', isLight ? '#ffffff' : '#0b0b0f');
    try { localStorage.setItem('h53bg', isLight ? 'light' : 'dark'); } catch(e){}
  }
  // 保存値の有無にかかわらず初期化し、ボタン表示とtheme-colorを常に同期させる
  try { applyBg(localStorage.getItem('h53bg') === 'light'); } catch(e){ applyBg(false); }
  btn.addEventListener('click', function(){ applyBg(!isLight); });

  // ---- 目盛りの生成 ----
  function buildTicks(host, ri, ro, count, sw){
    for (var i = 0; i < count; i++){
      var a = i * TAU / count;
      host.appendChild(el('line', {
        'class': 'tick',
        x1: (CX + ri * Math.cos(a)).toFixed(2), y1: (CY + ri * Math.sin(a)).toFixed(2),
        x2: (CX + ro * Math.cos(a)).toFixed(2), y2: (CY + ro * Math.sin(a)).toFixed(2),
        'stroke-width': sw
      }));
    }
  }
  buildTicks(document.getElementById('bezelOut'), 86.9, 89.6, 72, 0.42);
  buildTicks(document.getElementById('bezelIn'),  79.3, 80.9, 36, 0.50);

  // ---- 細リング：背面楕円 + 前面弧を対で生成（下から上へ） ----
  var RING_N = 4, RING_Y0 = 280, RING_Y1 = 208, RING_RX = 48, RING_RY = 8.4;
  var ringsBack = document.getElementById('ringsBack');
  var ringsFront = document.getElementById('ringsFront');
  var ringB = [], ringF = [], i;
  for (i = 0; i < RING_N; i++){
    var gb = el('g', {});
    gb.appendChild(el('ellipse', { 'class': 'rb', cx: CX, cy: RING_Y0, rx: RING_RX, ry: RING_RY }));
    ringsBack.appendChild(gb); ringB.push(gb);

    var gf = el('g', {});
    gf.appendChild(el('path', { 'class': 'rf',
      d: 'M' + (CX - RING_RX) + ',' + RING_Y0 + ' A' + RING_RX + ',' + RING_RY +
         ' 0 0,0 ' + (CX + RING_RX) + ',' + RING_Y0 }));
    ringsFront.appendChild(gf); ringF.push(gf);
  }

  // ---- 銀円盤：サイズ一定・下降しながら減衰 ----
  var DISC_N = 4, DISC_Y0 = 285, DISC_Y1 = 308, DISC_RX = 31, DISC_RY = 6.2;
  var discsHost = document.getElementById('discs');
  var discs = [], j;
  for (j = 0; j < DISC_N; j++){
    var d = el('ellipse', { 'class': 'disc', cx: CX, cy: DISC_Y0, rx: DISC_RX, ry: DISC_RY });
    discsHost.appendChild(d); discs.push(d);
  }

  var teeGlow = document.getElementById('teeGlow');
  var teeCore = document.getElementById('teeCore');

  function lerp(a, b, u){ return a + (b - a) * u; }

  function pumpBeat(t){
    var p = (t % PUMP_PERIOD) / PUMP_PERIOD;
    var s1 = Math.exp(-Math.pow((p - 0.12) / 0.05, 2));
    var s2 = 0.5 * Math.exp(-Math.pow((p - 0.33) / 0.085, 2));
    return s1 + s2;
  }

  // 通約不能な周期の重ね合わせ＋稀な瞬断で、規則性を感じさせない明滅にする
  function neon(t){
    var b = pumpBeat(t);
    var w = 0.5 + 0.5 * Math.sin(TAU * t / 1.37) * Math.sin(TAU * t / 0.53 + 1.1);
    var s = Math.sin(TAU * t / 2.9) + Math.sin(TAU * t / 1.13) + Math.sin(TAU * t / 0.41);
    var cut = (s < -2.2) ? 0.22 : 1;
    return Math.max(0.16, Math.min(1, (0.52 + 0.30 * b + 0.24 * w) * cut));
  }

  function placeRing(k, p){
    var y = lerp(RING_Y0, RING_Y1, p);
    var dy = (y - RING_Y0).toFixed(2);
    var o = (p < 0.18) ? p / 0.18 : ((p > 0.76) ? (1 - p) / 0.24 : 1);
    var os = (Math.max(0, Math.min(1, o)) * 0.72).toFixed(3);
    ringB[k].setAttribute('transform', 'translate(0 ' + dy + ')');
    ringF[k].setAttribute('transform', 'translate(0 ' + dy + ')');
    ringB[k].setAttribute('opacity', os);
    ringF[k].setAttribute('opacity', os);
  }

  // 不透明を保ち、終端だけで消える。透けて重なって見えるのを避ける
  function placeDisc(k, q){
    var o = (q < 0.06) ? q / 0.06 : ((q > 0.84) ? (1 - q) / 0.16 : 1);
    discs[k].setAttribute('cy', lerp(DISC_Y0, DISC_Y1, q).toFixed(2));
    discs[k].setAttribute('opacity', Math.max(0, Math.min(1, o)).toFixed(3));
  }

  var svgUI=null;
  function frame(now){
    var t = now / 1000, k;
    for (k = 0; k < RING_N; k++) placeRing(k, ((t / RING_CYCLE) + k / RING_N) % 1);
    // 位相を降順に並べて割り当てる。DOM順で後の要素ほど上にあり、前面に描画される
    var dq = [];
    for (k = 0; k < DISC_N; k++) dq.push(((t / DISC_CYCLE) + k / DISC_N) % 1);
    dq.sort(function(a, b){ return b - a; });
    for (k = 0; k < DISC_N; k++) placeDisc(k, dq[k]);

    // Tは位置固定。明滅のみ。白背景ではグローを抑える
    var n = neon(t), g = isLight ? 0.45 : 1;
    teeGlow.setAttribute('opacity', ((0.20 + 0.80 * n) * g).toFixed(3));
    teeCore.setAttribute('opacity', (0.82 + 0.18 * n).toFixed(3));

    if(svgUI)svgUI.afterArtworkFrame(now);
    requestAnimationFrame(frame);
  }

  svgUI=new SVGLiquid({svg:document.querySelector('.mark svg'),artworkLoop:!reduce});
  window.__svgLiquid=svgUI;
  if (reduce){
    for (i = 0; i < RING_N; i++) placeRing(i, i / RING_N);
    for (j = 0; j < DISC_N; j++) placeDisc(j, (DISC_N - 1 - j) / DISC_N);
    teeGlow.setAttribute('opacity', isLight ? 0.3 : 0.66);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
