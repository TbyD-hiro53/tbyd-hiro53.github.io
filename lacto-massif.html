  .bar{width:132px;height:1px;background:rgba(207,211,218,.14);position:relative}

<script>
(function(){
  // ---- h!ro53 index return button v2 ----
  // v1の失敗：(1) CSSの静的走査では全幅バーや左上HUDを検出できず重なった
  //           (2) 作品側のハンドラへイベントが渡り click が成立しない場合があった
  // v2：実行時に他要素の矩形を測って空いた隅へ置く。遷移は明示ハンドラで行う。
  var PAD = 12;
  var CSS = '#h53idx{position:fixed;z-index:2147483600;display:inline-flex;align-items:center;'
    + 'gap:7px;font:9px/1 ui-monospace,"SF Mono",Menlo,"Courier New",monospace;'
    + 'letter-spacing:.2em;text-transform:uppercase;text-decoration:none;'
    + 'color:rgba(214,224,232,.92);background:rgba(6,9,14,.82);'
    + 'border:1px solid rgba(127,230,240,.42);border-radius:2px;padding:9px 12px;'
    + 'pointer-events:auto;cursor:pointer;box-shadow:0 1px 10px rgba(0,0,0,.55);'
    + '-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);'
    + '-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;'
    + '-webkit-user-select:none;user-select:none;touch-action:manipulation}'
    + '#h53idx:active{color:#fff;border-color:rgba(255,95,200,.75);background:rgba(10,14,20,.96)}'
    + '#h53idx b{font-weight:400;opacity:.55}';

  var st = document.createElement('style');
  st.id = 'h53idxcss';
  st.appendChild(document.createTextNode(CSS));
  (document.head || document.documentElement).appendChild(st);

  var A = document.createElement('a');
  A.id = 'h53idx';
  A.setAttribute('aria-label', 'registry');
  A.innerHTML = '<b>&#8592;</b>index';

  function url(){
    try { return new URL('index.html', location.href).href; }
    catch (e) { return 'index.html'; }
  }
  A.href = url();

  // 遷移：click が潰される環境でも touchend で確実に飛ばす
  var fired = 0;
  function go(e){
    var now = Date.now();
    if (now - fired < 700) { if (e && e.preventDefault) e.preventDefault(); return false; }
    fired = now;
    if (e){ if (e.preventDefault) e.preventDefault(); if (e.stopPropagation) e.stopPropagation(); }
    var u = url();
    try { location.assign(u); } catch (err) { location.href = u; }
    return false;
  }
  function eat(e){ if (e && e.stopPropagation) e.stopPropagation(); }
  A.addEventListener('click', go, false);
  try { A.addEventListener('touchend', go, { passive: false }); }
  catch (e) { A.addEventListener('touchend', go, false); }
  try { A.addEventListener('touchstart', eat, { passive: true }); }
  catch (e) { A.addEventListener('touchstart', eat, false); }
  A.addEventListener('pointerdown', eat, false);
  A.addEventListener('mousedown', eat, false);

  function attach(){
    if (document.body && A.parentNode !== document.body) document.body.appendChild(A);
  }
  attach();

  // セーフエリアの実寸を測る
  var safe = { t: 0, r: 0, b: 0, l: 0 };
  function measureSafe(){
    if (!document.body) return;
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'
      + 'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);'
      + 'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
    document.body.appendChild(p);
    var cs = window.getComputedStyle(p);
    safe.t = parseFloat(cs.paddingTop) || 0;
    safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0;
    safe.l = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(p);
  }

  // 画面上で実際に「何かが描かれている」要素の矩形を集める
  function occupied(){
    var out = [], i, j, el, cs, r, ch, ink, bg;
    if (!document.body) return out;
    var all = document.body.querySelectorAll('*');
    for (i = 0; i < all.length; i++){
      el = all[i];
      if (el === A || el === st) continue;
      var tn = el.tagName;
      if (tn === 'CANVAS' || tn === 'SCRIPT' || tn === 'STYLE' || tn === 'LINK') continue;
      cs = window.getComputedStyle(el);
      if (!cs || cs.display === 'none' || cs.visibility === 'hidden') continue;
      if ((parseFloat(cs.opacity) || 1) < 0.06) continue;
      r = el.getBoundingClientRect();
      if (r.width < 6 || r.height < 6) continue;
      if (r.right < 0 || r.bottom < 0 || r.left > innerWidth || r.top > innerHeight) continue;
      // 全画面の器は避けたい対象ではない
      if (r.width > innerWidth * 0.94 && r.height > innerHeight * 0.90) continue;
      ink = false;
      ch = el.childNodes;
      for (j = 0; j < ch.length; j++){
        if (ch[j].nodeType === 3 && ch[j].nodeValue && ch[j].nodeValue.replace(/\s+/g,'')) { ink = true; break; }
      }
      if (!ink){
        bg = cs.backgroundColor || '';
        if (bg && bg.indexOf('rgba(0, 0, 0, 0)') < 0 && bg !== 'transparent') ink = true;
        if (!ink && (parseFloat(cs.borderTopWidth) || 0) > 0) ink = true;
        if (!ink && (parseFloat(cs.borderBottomWidth) || 0) > 0) ink = true;
        if (!ink && tn === 'IMG') ink = true;
      }
      if (!ink) continue;
      out.push(r);
    }
    return out;
  }

  function overlapArea(x, y, w, h, rs){
    var s = 0, i, r, ow, oh;
    for (i = 0; i < rs.length; i++){
      r = rs[i];
      ow = Math.min(x + w, r.right) - Math.max(x, r.left);
      oh = Math.min(y + h, r.bottom) - Math.max(y, r.top);
      if (ow > 0 && oh > 0) s += ow * oh;
    }
    return s;
  }

  function place(){
    attach();
    if (!document.body) return;
    measureSafe();
    A.style.left = ''; A.style.right = ''; A.style.top = ''; A.style.bottom = '';
    A.style.top = '-999px'; A.style.left = '0px';
    var w = A.offsetWidth || 76, h = A.offsetHeight || 30;
    var rs = occupied();
    // 隅は 右上 → 左上 → 右下 → 左下 の順に選好。各隅で縦に4段まで逃がす
    var best = null, corner, step, x, y, s, pref;
    for (corner = 0; corner < 4; corner++){
      for (step = 0; step < 4; step++){
        x = (corner % 2 === 0) ? (innerWidth - PAD - safe.r - w) : (PAD + safe.l);
        y = (corner < 2) ? (PAD + safe.t + step * (h + 8))
                         : (innerHeight - PAD - safe.b - h - step * (h + 8));
        if (y < 0 || y + h > innerHeight) continue;
        s = overlapArea(x, y, w, h, rs);
        pref = corner * 3 + step;                 // 面積が同点なら選好順
        if (!best || s < best.s - 0.5 || (Math.abs(s - best.s) <= 0.5 && pref < best.pref)){
          best = { x: x, y: y, s: s, pref: pref, corner: corner };
        }
        if (s === 0 && step === 0 && corner === 0) { best = { x: x, y: y, s: 0, pref: 0, corner: 0 }; corner = 9; break; }
      }
    }
    if (!best) best = { x: innerWidth - PAD - w, y: PAD, corner: 0 };
    if (best.corner < 2){ A.style.top = best.y + 'px'; A.style.bottom = ''; }
    else { A.style.bottom = (innerHeight - best.y - h) + 'px'; A.style.top = ''; }
    if (best.corner % 2 === 0){ A.style.right = (PAD + safe.r) + 'px'; A.style.left = ''; }
    else { A.style.left = (PAD + safe.l) + 'px'; A.style.right = ''; }
  }

  function boot(){ place(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  addEventListener('load', place);
  addEventListener('resize', place);
  addEventListener('orientationchange', function(){ setTimeout(place, 220); });
  setTimeout(place, 400);
  setTimeout(place, 1400);
  setTimeout(place, 3600);
})();
</script>

(function(){
  // 1) FontLoader: XHRを一切使わず埋め込みJSONから解決（file://のCORSブロック回避）
  if (window.THREE && THREE.FontLoader) {
    THREE.FontLoader.prototype.load = function(url, onLoad, onProgress, onError){

        var key = (String(url).indexOf('bold') >= 0) ? 'bold' : 'regular';
        var d = window.__H53_FONTS[key] || window.__H53_FONTS.bold || window.__H53_FONTS.regular;

    };

  window.addEventListener('DOMContentLoaded', function(){
    var c = document.querySelector('canvas'); if(!c) return;
    c.addEventListener('webglcontextlost', function(e){ e.preventDefault(); }, false);
    c.addEventListener('webglcontextrestored', function(){ location.reload(); }, false);

    setTimeout(function(){

  });
})();

( function () {

	var CopyShader = {
		uniforms: {

				value: null

				value: 1.0
			}
		},
		vertexShader:
  /* glsl */

		varying vec2 vUv;

		void main() {

			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,

		uniform float opacity;

		uniform sampler2D tDiffuse;

		varying vec2 vUv;

		void main() {

		}`

<script>/*LuminosityHighPassShader.js*/
( function () {

	/**
 * Luminosity
 * http://en.wikipedia.org/wiki/Luminosity
 */

	const LuminosityHighPassShader = {
		shaderID: 'luminosityHighPass',
		uniforms: {
			'tDiffuse': {
				value: null
			},
			'luminosityThreshold': {
				value: 1.0
			},
			'smoothWidth': {
				value: 1.0
			},
			'defaultColor': {
				value: new THREE.Color( 0x000000 )
			},
			'defaultOpacity': {
				value: 0.0
			}
		},
		vertexShader:
  /* glsl */
  `

		varying vec2 vUv;

		void main() {

			vUv = uv;

			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,
		fragmentShader:
  /* glsl */
  `

		uniform sampler2D tDiffuse;
		uniform vec3 defaultColor;
		uniform float defaultOpacity;
		uniform float luminosityThreshold;
		uniform float smoothWidth;

		varying vec2 vUv;

		void main() {

			vec4 texel = texture2D( tDiffuse, vUv );

			vec3 luma = vec3( 0.299, 0.587, 0.114 );

			float v = dot( texel.xyz, luma );

			vec4 outputColor = vec4( defaultColor.rgb, defaultOpacity );

			float alpha = smoothstep( luminosityThreshold, luminosityThreshold + smoothWidth, v );

			gl_FragColor = mix( outputColor, texel, alpha );

		}`
	};

	THREE.LuminosityHighPassShader = LuminosityHighPassShader;

} )();

// ================================================================
// ジオメトリ統合
// ================================================================
function prep(g){
  var h=g.index?g.toNonIndexed():g;
  if(!h.attributes.normal)h.computeVertexNormals();
  if(!h.attributes.uv){
    var n=h.attributes.position.count;
    h.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));
  }
  return h;
}
function mergeGeos(list){
  var geos=[],total=0,i,anyCol=false;
  for(i=0;i<list.length;i++){
    var g=prep(list[i]);geos.push(g);total+=g.attributes.position.count;
    if(g.attributes.color)anyCol=true;
  }
  var pos=new Float32Array(total*3),nor=new Float32Array(total*3),uv=new Float32Array(total*2);
  var col=anyCol?new Float32Array(total*3):null,o=0;
  for(i=0;i<geos.length;i++){
    var a=geos[i];
    pos.set(a.attributes.position.array,o*3);
    nor.set(a.attributes.normal.array,o*3);
    uv.set(a.attributes.uv.array,o*2);
    if(col){
      if(a.attributes.color)col.set(a.attributes.color.array,o*3);
      else col.fill(1,o*3,(o+a.attributes.position.count)*3);
    }
    o+=a.attributes.position.count;
  }
  var out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  if(col)out.setAttribute('color',new THREE.BufferAttribute(col,3));
  out.computeBoundingSphere();
  return out;
}
var _m=new THREE.Matrix4(), _e=new THREE.Euler(), _q4=new THREE.Quaternion(),
    _v=new THREE.Vector3(), _sc=new THREE.Vector3(1,1,1);
function xf(g,x,y,z,rx,ry,rz,sx,sy,sz){
  _e.set(rx||0,ry||0,rz||0);_q4.setFromEuler(_e);
  _v.set(x||0,y||0,z||0);
  _sc.set(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz);
  _m.compose(_v,_q4,_sc);
  return g.clone().applyMatrix4(_m);
}
// 面を外向きに向ける（v6の lookAt(cx*10,y,cz*10) と等価）
function facing(g,x,y,z,a){
  var m=new THREE.Matrix4().makeRotationY(-a+PI/2);
  return g.clone().applyMatrix4(m).translate(x,y,z);
}
function tubeBetween(p0,p1,rad,seg){
  var mid=p0.clone().add(p1).multiplyScalar(0.5);
  var len=p0.distanceTo(p1);
  var dir=p1.clone().sub(p0).normalize();
  var g=new THREE.CylinderGeometry(rad,rad,len,seg);
  var q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  return g.applyMatrix4(new THREE.Matrix4().compose(mid,q,new THREE.Vector3(1,1,1)));
}

// ================================================================
// 脳（v6の gyriField をそのまま移植）
// ================================================================
function gyriField(x,y,z){
  var w1=Math.sin(y*2.7+z*1.9)+0.6*Math.sin(z*4.1+x*1.3);
  var w2=Math.sin(x*2.9+y*2.1)+0.6*Math.sin(y*4.7+z*1.7);
  var w3=Math.sin(z*3.3+x*2.5)+0.6*Math.sin(x*5.1+y*1.9);
  return (Math.sin(x*5.2+w1*1.9)+Math.sin(y*5.8+w2*1.9)+Math.sin(z*4.9+w3*1.9))/3;
}
function buildBrainPart(seg,kind){
  var geo=new THREE.SphereGeometry(1,seg,Math.floor(seg*0.72));
  var p=geo.attributes.position,v=new THREE.Vector3();
  var col=new Float32Array(p.count*3);
  var cRidge=new THREE.Color(kind==='cerebrum'?'#f2b0c6':'#e29aac');
  var cValley=new THREE.Color(kind==='cerebrum'?'#a83a68':'#93315a');
  var tmp=new THREE.Color(),i;
  for(i=0;i<p.count;i++){
    v.set(p.getX(i),p.getY(i),p.getZ(i));
    var d=v.clone().normalize(),shade,r;
    if(kind==='cerebrum'){
      var b=Math.abs(gyriField(d.x*1.05,d.y*1.15,d.z));
      var ridge=1-Math.pow(b,1.6);
      r=0.90+0.135*ridge+0.014*Math.sin(d.x*17)*Math.sin(d.y*15+2)*Math.sin(d.z*16);
      if(Math.abs(d.x)<0.10)r-=0.20*(1-Math.abs(d.x)/0.10);
      shade=ridge;
    }else{
      var band=0.5+0.5*Math.sin(d.y*30+Math.sin(d.x*6.0)*1.2);
      r=0.95+0.05*Math.pow(band,0.7)+0.01*Math.sin(d.z*22);
      shade=band;
    }
    v.copy(d).multiplyScalar(r);p.setXYZ(i,v.x,v.y,v.z);
    tmp.copy(cValley).lerp(cRidge,0.15+0.85*shade);
    tmp.multiplyScalar(0.84+0.20*clamp(d.y*0.5+0.5,0,1));
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  return geo;
}
function gBrainSet(segA,segB){
  var L=[];
  L.push(xf(buildBrainPart(segA,'cerebrum'),0,0,0,0,0,0,1.85,1.55,1.70));
  L.push(xf(buildBrainPart(segB,'cerebellum'),0,-1.15,-0.92,0.3,0,0,0.95,0.55,0.72));
  var pg=new THREE.SphereGeometry(0.42,Math.max(8,segB/3|0),Math.max(6,segB/4|0));
  var pc=new Float32Array(pg.attributes.position.count*3), pk=new THREE.Color('#c8809a'), pi;
  for(pi=0;pi<pg.attributes.position.count;pi++){pc[pi*3]=pk.r;pc[pi*3+1]=pk.g;pc[pi*3+2]=pk.b;}
  pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
  L.push(xf(pg,0,-1.40,-0.25,0,0,0,1.1,0.8,0.9));
  return mergeGeos(L);
}

function mkInst(geo,mat,n,order){
  var im=new THREE.InstancedMesh(geo,mat,n),i;
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.frustumCulled=false;
  for(i=0;i<n;i++)im.setColorAt(i,WHITE);   // §7.2 混在防止
  if(im.instanceColor)im.instanceColor.needsUpdate=true;

}

// ================================================================
// 発電所：ラックタワーを単位として山上に環状配置する
// Python事前検証：隣接間隔104.7〜119.4（タワー径32）／全景 幅602×高さ860
// ================================================================
var PCX=0.0, PCZ=-190.0;                     // 山の中心（原点のタワーは第2輪の1基）
var TER_H0=300.0, TER_R=460.0;
var TER_OFF=-TER_H0*Math.pow(1-Math.pow(190/TER_R,2),1.2);
function terrainH(r){
  var k=1-Math.pow(Math.min(r,TER_R)/TER_R,2);
  return (k<=0?0:TER_H0*Math.pow(k,1.2))+TER_OFF;
}
// 起伏。原点の実物タワーがぴたりと地面に乗るよう、その位置の値を基準に引く
function terrainNZ(r,a){
  return Math.sin(a*7+r*0.021)*3.4*Math.min(1,r/120)
        +Math.sin(a*13+r*0.043)*1.7
        +Math.sin(a*23+r*0.091)*0.85;
}
var NZ0=terrainNZ(190,PI/2);
// 塔の据付面。地形メッシュ・タワー・ケーブルはすべてこの1つの関数を見る
function groundAt(r,a){return terrainH(r)+terrainNZ(r,a)-NZ0;}
var RINGS=[{r:100,n:6,ph:0.31},{r:190,n:11,ph:PI/2},{r:285,n:15,ph:0.14}];
var TOWERS=[];
(function(){
  var g,k,a,x,z;
  for(g=0;g<RINGS.length;g++)for(k=0;k<RINGS[g].n;k++){
    a=RINGS[g].ph+k*TAU/RINGS[g].n;
    x=PCX+Math.cos(a)*RINGS[g].r; z=PCZ+Math.sin(a)*RINGS[g].r;
    if(g===1&&k===0)continue;                // 第2輪の1基は原点の実物タワー
    TOWERS.push({x:x,z:z,y:groundAt(RINGS[g].r,a),a:a+rnd()*0.9,pr:RINGS[g].r,pa:a});
  }
})();

// ---- 山 ----
(function buildTerrain(){
  var NR=68,NA=104,i,j,r,a,y,pos=[],idx=[],col=[];
  var cHi=new THREE.Color('#1b1526'), cLo=new THREE.Color('#08060f');
  for(i=0;i<=NR;i++){
    r=Math.pow(i/NR,1.25)*TER_R*1.25;
    for(j=0;j<=NA;j++){
      a=j/NA*TAU;
      y=groundAt(r,a);
      pos.push(PCX+Math.cos(a)*r,y-16.0,PCZ+Math.sin(a)*r);
      var t=clamp(1-r/(TER_R*0.9),0,1);
      var c=cLo.clone().lerp(cHi,t*t);
      col.push(c.r,c.g,c.b);
    }
  }
  for(i=0;i<NR;i++)for(j=0;j<NA;j++){
    var A=i*(NA+1)+j,B=A+1,C=A+NA+1,D=C+1;
    idx.push(A,B,C,B,D,C);   // 上を向く巻き。逆だと片面なので上から透ける
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,sm({vertexColors:true,metalness:0.55,roughness:0.82,
    envMapIntensity:0.35,side:THREE.DoubleSide})));

// 描かれる塔はすべて同一品質。近い順に TW_MAX 基だけ描き、残りは霧の奥なので出さない
function bucketTowers(){
  var i,t,a=0,nn=0,ff=0;
  for(i=0;i<TALL.length;i++){
    t=TALL[i];_tc[i].i=i;
    _tc[i].d=Math.sqrt(Math.pow(camera.position.x-t.x,2)+
      Math.pow(camera.position.y-(t.y+TOWER_H*0.45),2)+Math.pow(camera.position.z-t.z,2));
  }
  _tc.sort(function(p,q){return p.d-q.d;});
  heroReal=false;
  for(i=0;i<TALL.length&&a<TW_MAX;i++){
    t=TALL[_tc[i].i];
    if(t.hero&&HERO_ON){heroReal=true;continue;}   // 実物として描くので群れからは外す
    _fd.position.set(t.x,t.y,t.z);_fd.rotation.set(0,t.a,0);
    _fd.scale.set(1,1,1);_fd.updateMatrix();
    // 近い順に NW_MAX 基だけ 20分割の近接段へ。残りは 8分割の遠景段
    if(nn<NW_MAX&&nn<NW_CAP){
      fN.setMatrixAt(nn,_fd.matrix);fNe.setMatrixAt(nn,_fd.matrix);fNt.setMatrixAt(nn,_fd.matrix);nn++;
    }else{
      fA.setMatrixAt(ff,_fd.matrix);fAe.setMatrixAt(ff,_fd.matrix);fAt.setMatrixAt(ff,_fd.matrix);ff++;
    }
    fAg.setMatrixAt(a,_fd.matrix);
    _logoIdx[a]=_tc[i].i;a++;
  }

  fA.count=ff;fAe.count=ff;fAt.count=ff;
  fAg.count=a;fAl.count=a;

  fNt.instanceMatrix.needsUpdate=true;
  fA.instanceMatrix.needsUpdate=true;fAe.instanceMatrix.needsUpdate=true;
  fAt.instanceMatrix.needsUpdate=true;fAg.instanceMatrix.needsUpdate=true;

}

var _bp=new THREE.Vector3(), _bs=new THREE.Vector3();
function poseTier(T,list,t,pb){
  var i,n=list.length,bs=0.86*(1+0.055*pb);
  for(i=0;i<n;i++){
    podMat[list[i]].decompose(_rp,_rq,_rs);

    _bp.set(_rp.x,_rp.y+BRAIN_Y,_rp.z);_bs.set(bs,bs,bs);
    _rm.compose(_bp,_rq,_bs);
    T.brain.setMatrixAt(i,_rm);

    _e.set(0,t*2.6+podPhase[list[i]],0);_q4.setFromEuler(_e);
    _bs.set(1,1,1);
    _rm.compose(_rp,_q4,_bs);

  }

// ================================================================
var RFIT=1800;
function fitTower(){
  var topPx=54, botPx=92;
  var el=document.querySelector('.stack');
  if(el)botPx=Math.min(240,el.getBoundingClientRect().height+10);
  var frac=Math.max(0.35,(innerHeight-topPx-botPx)/innerHeight);
  var tn=Math.tan(THREE.MathUtils.degToRad(21));
  var PW=2*(285+R_BASE), PH=(CEN_TOP+140)-(terrainH(380)-30);
  RFIT=Math.max(PH/(2*tn*frac*0.94), PW/(2*tn*(innerWidth/innerHeight)*0.96));
  camera.far=Math.max(6200,RFIT+2600);
  camera.updateProjectionMatrix();
}
fitTower();

var SHOTS=[
  // ── 発電所 ──────────────────────────────

  {n:'core',   nw:2, hero:1, tw:16, mid:6, full:2, t0: 64.0, t1: 75.0, fa:0.00520, fb:0.00520,
   a:{th:0.52,ph:2.150,r:62,tx:0,ty:levelY(4)+8.0,tz:0},

   a:{th:2.74,ph:1.470,r:300,tx:0,ty:150,tz:0},

];
var shotOfs=0;   // next shot ボタン用のオフセット
function shotAt(tt){
  var i;
  for(i=0;i<SHOTS.length;i++)if(tt>=SHOTS[i].t0&&tt<SHOTS[i].t1)return i;
  return SHOTS.length-1;
}
var theta=SHOTS[0].a.th, phi=SHOTS[0].a.ph, radius=RFIT;
var target=new THREE.Vector3(PCX,CEN_Y+250,PCZ);
var curShot=-1;

function applyRail(tt){
  var si=shotAt(tt), S=SHOTS[si];
  var u=clamp((tt-S.t0)/(S.t1-S.t0),0,1);
  var e=u*u*(3-2*u);                        // ゆるやかな出入り
  var ra=(S.a.r==='FIT'?RFIT:S.a.r), rb=(S.b.r==='FIT'?RFIT:S.b.r);
  theta=lerp(S.a.th,S.b.th,e);
  phi=lerp(S.a.ph,S.b.ph,e);
  radius=lerp(ra,rb,e);
  target.set(lerp(S.a.tx,S.b.tx,e),lerp(S.a.ty,S.b.ty,e),lerp(S.a.tz,S.b.tz,e));
  LV_FULL=S.full;
  if(S.tw!==undefined&&S.tw!==TW_MAX){TW_MAX=S.tw;rebT=-99;}
  if(S.hero!==HERO_ON){HERO_ON=S.hero;rebT=-99;}
  if((S.nw||0)!==NW_MAX){NW_MAX=S.nw||0;rebT=-99;}
  // 中間段の階層数もショットごとに決める（視点が固定だから安全に切り替えられる）
  var wantMid=Math.min(S.mid,LV_MID_PERF);
  if(wantMid!==LV_MID){LV_MID=wantMid;rebT=-99;}
  // 霧も作品側で制御する。縦坑を見上げる画では距離減衰が構造の一部になる
  scene.fog.density=lerp(S.fa,S.fb,e);
  if(si!==curShot){
    curShot=si;
    var ttl=document.getElementById('ttl');
    if(ttl)ttl.textContent='LACTO-TOWER · '+S.n.toUpperCase();
  }
  var pg=document.getElementById('pg');
  if(pg)pg.style.width=(tt/LOOP*132).toFixed(1)+'px';
}
function updateCam(){
  var sp=Math.sin(phi);
  camera.position.set(
    target.x+radius*sp*Math.cos(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*sp*Math.sin(theta));
  camera.lookAt(target);
}
document.getElementById('sw').onclick=function(){
  var si=shotAt((nowT+shotOfs)%LOOP);
  var nx=SHOTS[(si+1)%SHOTS.length].t0;
  shotOfs=(nx-nowT%LOOP+LOOP)%LOOP;
};

// ================================================================
// ポスト（Bloomは半解像度・ポスタライズは使わない）
// ================================================================
var composer=null,bloomPass=null,gradePass=null,fxaaPass=null;
var SS=1.25;   // 合成鎖の内部解像度倍率（縮小して書き出す＝スーパーサンプリング）
var FXAAShader={
  uniforms:{tDiffuse:{value:null},uRes:{value:new THREE.Vector2(1,1)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
   'uniform sampler2D tDiffuse;uniform vec2 uRes;varying vec2 vUv;',
   '#define SPAN 8.0',
   '#define RED 0.125',
   '#define MIN 0.0625',
   'float lum(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}',
   'void main(){',
   ' vec2 px=1.0/uRes;',
   ' vec3 cNW=texture2D(tDiffuse,vUv+vec2(-1.0,-1.0)*px).rgb;',
   ' vec3 cNE=texture2D(tDiffuse,vUv+vec2( 1.0,-1.0)*px).rgb;',
   ' vec3 cSW=texture2D(tDiffuse,vUv+vec2(-1.0, 1.0)*px).rgb;',
   ' vec3 cSE=texture2D(tDiffuse,vUv+vec2( 1.0, 1.0)*px).rgb;',
   ' vec3 cM =texture2D(tDiffuse,vUv).rgb;',
   ' float lNW=lum(cNW),lNE=lum(cNE),lSW=lum(cSW),lSE=lum(cSE),lM=lum(cM);',
   ' float lMin=min(lM,min(min(lNW,lNE),min(lSW,lSE)));',
   ' float lMax=max(lM,max(max(lNW,lNE),max(lSW,lSE)));',
   ' vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)),((lNW+lSW)-(lNE+lSE)));',
   ' float dr=max((lNW+lNE+lSW+lSE)*0.25*RED,MIN);',
   ' float rcp=1.0/(min(abs(dir.x),abs(dir.y))+dr);',
   ' dir=clamp(dir*rcp,vec2(-SPAN),vec2(SPAN))*px;',
   ' vec3 a=0.5*(texture2D(tDiffuse,vUv+dir*(1.0/3.0-0.5)).rgb',
   '            +texture2D(tDiffuse,vUv+dir*(2.0/3.0-0.5)).rgb);',
   ' vec3 b=a*0.5+0.25*(texture2D(tDiffuse,vUv-dir*0.5).rgb',
   '                   +texture2D(tDiffuse,vUv+dir*0.5).rgb);',
   ' float lB=lum(b);',
   ' gl_FragColor=vec4((lB<lMin||lB>lMax)?a:b,1.0);',
   '}'].join('\n')
};

var GradeShader={
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uRes:{value:new THREE.Vector2(1,1)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
   'uniform sampler2D tDiffuse;uniform float uTime;uniform vec2 uRes;varying vec2 vUv;',
   'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
   'void main(){',
   ' vec3 c=texture2D(tDiffuse,vUv).rgb;',
   ' float l=dot(c,vec3(0.2126,0.7152,0.0722));',
   ' c=mix(c,c*vec3(0.86,1.02,1.06),1.0-smoothstep(0.0,0.42,l));',
   ' c=mix(c,c*vec3(1.06,0.96,1.02),smoothstep(0.62,1.0,l));',
   ' c*=0.965+0.035*sin(vUv.y*uRes.y*1.4);',
   ' c+=hash(vUv*uRes+uTime)*0.05-0.025;',
   ' vec2 q=vUv-0.5;c*=mix(0.60,1.0,smoothstep(0.98,0.30,length(q)));',
   ' gl_FragColor=vec4(c,1.0);',
   '}'].join('\n')
};
try{
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  composer.setPixelRatio(renderer.getPixelRatio()*SS);
  bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.60,0.32,0.70);
  composer.addPass(bloomPass);
  fxaaPass=new THREE.ShaderPass(FXAAShader);
  fxaaPass.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio()*SS,
                                   innerHeight*renderer.getPixelRatio()*SS);
  composer.addPass(fxaaPass);
  gradePass=new THREE.ShaderPass(GradeShader);
  gradePass.uniforms.uRes.value.set(innerWidth,innerHeight);
  gradePass.renderToScreen=true;
  composer.addPass(gradePass);
}catch(err){composer=null;showErr('post init: '+err.message);}

// ================================================================
// アニメーション
// ================================================================
function applySS(){
  if(!composer)return;
  composer.setPixelRatio(renderer.getPixelRatio()*SS);
  composer.setSize(innerWidth,innerHeight);
  if(bloomPass)bloomPass.setSize(innerWidth/2,innerHeight/2);
  if(fxaaPass)fxaaPass.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio()*SS,
                                               innerHeight*renderer.getPixelRatio()*SS);
}
var clock=new THREE.Clock();
var nowT=0, rebT=-99, lastCam=new THREE.Vector3(1e9,1e9,1e9);
// 実機のフレーム時間で中間段の階層数を自動調整する安全弁。
// 視点はレール上なので、絞っても構図は一切変わらない
var fpAcc=0, fpN=0, lastT=0;

function tick(){
  requestAnimationFrame(tick);
  var t=clock.getElapsedTime();nowT=t;
  var tt=(t+shotOfs)%LOOP;
  var pb=pumpBeat(t);

  applyRail(tt);
  updateCam();

  if(camera.position.distanceTo(lastCam)>1.2||t-rebT>0.5){
    lastCam.copy(camera.position);rebT=t;
    rebucket();bucketTowers();
  }

  // 中心ライザーの脈波（0.78秒ごとに1本が通過）
  TEX_FLOW.offset.y=(t/PUMP_PERIOD)%1;
  // 外周LCD −0.2回転/秒／ファンリング2行は逆向き（v6の比率を継承）
  TEX_LCD.offset.x=(t*0.2)%1;
  TEX_RING[0].offset.x=(t*FAN_ROWS[0].spd)%1;
  TEX_RING[1].offset.x=(t*FAN_ROWS[1].spd)%1;
  if(logoBand)logoBand.rotation.y=t*TAU*5/60;   // 5rpm
  if(fAl&&fAl.count){                          // 群れのタンクも同じ5rpmで回す
    var li,lt,lr=t*TAU*5/60;
    for(li=0;li<fAl.count;li++){
      lt=TALL[_logoIdx[li]];
      _fd.position.set(lt.x,lt.y,lt.z);_fd.rotation.set(0,lt.a+lr,0);
      _fd.scale.set(1,1,1);_fd.updateMatrix();
      fAl.setMatrixAt(li,_fd.matrix);
    }
    fAl.instanceMatrix.needsUpdate=true;
  }
  if(TEX_STRIPE){
    var fk2;
  for(fk2=0;fk2<farBeamMats.length;fk2++)
    farBeamMats[fk2].opacity=0.34+0.30*pb;
  TEX_STRIPE.offset.x=-(t*3.2)%1;                 // 帯の進行 731 u/s
    TEX_SURGE.offset.x=-(t/PUMP_PERIOD)%1;          // 心拍ごとに1発、全長を 2051 u/s で走破
    var bs=1.0+0.085*pb, bi, sg=0.55+0.75*pb;
    for(bi=0;bi<beamMats.length;bi++){
      if(beamMats[bi].userData.o0===undefined)beamMats[bi].userData.o0=beamMats[bi].opacity;
      beamMats[bi].opacity=beamMats[bi].userData.o0*(0.72+0.46*pb);
    }
    for(bi=0;bi<surgeMats.length;bi++)surgeMats[bi].opacity=sg;
    if(beamGroup)beamGroup.scale.set(bs,1,bs);       // 半径方向に脈打つ
  }
  if(TEX_LINE){
    TEX_LINE.offset.x=-(t/(PUMP_PERIOD*2))%1;             // 地表の脈は中心へ向かって走る
    matLineFlow.opacity=0.62+0.34*pb;
  }
  if(window.__H53_CRG)window.__H53_CRG.material.opacity=0.32+0.26*pb;
  if(TEX_RISE){
    TEX_RISE.offset.y=-(t/(PUMP_PERIOD*1.6))%1;          // 束ねられた電力が砲塔へ昇る
    matRise.opacity=0.58+0.34*pb;
    matRiseCore.opacity=0.40+0.30*pb;
  }
  if(window.__H53_DOME)window.__H53_DOME.position.copy(camera.position);
  if(beamFlare){beamFlare.material.opacity=0.55+0.38*pb;beamFlare.scale.set(76+22*pb,76+22*pb,1);}
  if(antRim)antRim.material.opacity=0.42+0.34*pb;

  matBrain.emissiveIntensity=0.26+0.24*pb;
  matColumn.opacity=0.08+0.12*pb;
  matPuff.opacity=0.15+0.35*Math.max(0,pb-0.3);
  matHalo.opacity=0.09+0.07*pb;
  matFarCore.color.setRGB(1.0,0.42+0.16*pb,0.80+0.12*pb);
  if(matFieldE)matFieldE.opacity=0.34+0.18*pb;
  if(matFieldT)matFieldT.opacity=0.28+0.12*pb;
  if(matFieldG)matFieldG.opacity=0.13+0.09*pb;
  matMilk.emissiveIntensity=0.13+0.10*pb;
  matFlow.opacity=0.72+0.22*pb;
  basePool.material.opacity=0.30+0.18*pb;
  crownFlare.material.opacity=0.22+0.16*pb;
  crownFlare.scale.set(44+6*pb,44+6*pb,1);

  poseTier(T0,fullList,t,pb);
  poseTier(T1,midList,t,pb);

  if(extras.visible){
    var i,s,yy,rr,ang;
    for(i=0;i<VBUB;i++){
      s=vbSeed[i];
      yy=((t*s.s*0.3+s.p)%1);
      rr=s.r*(0.9+0.1*Math.sin(t*0.5+i));
      ang=s.a+t*0.3*s.s;
      vbPos[i*3]=Math.cos(ang)*rr;
      vbPos[i*3+1]=VAT_BOT+0.3+yy*(VAT_H-0.6);
      vbPos[i*3+2]=Math.sin(ang)*rr;
    }
    vbGeo.attributes.position.needsUpdate=true;
    coreFlare.material.opacity=0.40+0.40*pb;
    coreFlare.scale.set(3.4+0.6*pb,3.4+0.6*pb,1);
    var td=t%DRIP_CYCLE;
    if(td<D_SWELL){var k=td/D_SWELL;drop.position.set(0,DTIP_Y,0);drop.scale.setScalar(0.4+0.6*k);}
    else if(td<D_SWELL+D_FALL){var f=(td-D_SWELL)/D_FALL;
      drop.position.set(0,DTIP_Y-DROP_H*f*f,0);drop.scale.setScalar(1.0);}
    else drop.scale.setScalar(0.0001);
    coreLight.intensity=1.1+1.6*pb;
    brainKey.intensity=0.9+0.5*pb;
    fanLight.intensity=0.6;
  }

  var dt=t-lastT;lastT=t;
  if(dt>0&&dt<0.5){fpAcc+=dt;fpN++;}
  if(fpN>=72){
    var avg=fpAcc/fpN;fpAcc=0;fpN=0;
    if(avg>0.030){
      if(SS>1.001){SS=1.0;applySS();}
      else if(LV_MID_PERF>4)LV_MID_PERF-=2;
    }else if(avg<0.019&&LV_MID_PERF<MID_LV_CAP)LV_MID_PERF+=2;
  }

  renderer.toneMappingExposure=1.04+0.05*pb;
  if(gradePass)gradePass.uniforms.uTime.value=t;
  if(composer)composer.render();else renderer.render(scene,camera);
}

applyRail(0);updateCam();rebucket();bucketTowers();
tick();
requestAnimationFrame(function(){fitTower();applyRail(nowT%LOOP);updateCam();});

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  fitTower();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer)composer.setSize(innerWidth,innerHeight);
  if(bloomPass)bloomPass.setSize(innerWidth/2,innerHeight/2);
  if(fxaaPass)fxaaPass.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio()*SS,
                                               innerHeight*renderer.getPixelRatio()*SS);
  if(gradePass)gradePass.uniforms.uRes.value.set(innerWidth,innerHeight);
});
})();
</script>
