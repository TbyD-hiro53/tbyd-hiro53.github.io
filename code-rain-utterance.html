<script>
(function(){
  // ---- h!ro53 index return button v2 ----
  // v1の失敗：(1) CSSの静的走査では全幅バーや左上HUDを検出できず重なった
  //           (2) 作品側のハンドラへイベントが渡り click が成立しない場合があった
  // v2：実行時に他要素の矩形を測って空いた隅へ置く。遷移は明示ハンドラで行う。
  var PAD = 12;
  var CSS = '#h53idx{position:fixed;z-index:2147483600;display:inline-flex;align-items:center;'
    + 'gap:7px;font:9px/1 ui-monospace,"SF Mono",Menlo,"Courier New",monospace;'
    + 'letter-spacing:.2em;text-transform:uppercase;text-decoration:none;'
    + 'color:rgba(214,224,232,.92);background:rgba(6,9,14,.82);'
    + 'border:1px solid rgba(127,230,240,.42);border-radius:2px;padding:9px 12px;'
    + 'pointer-events:auto;cursor:pointer;box-shadow:0 1px 10px rgba(0,0,0,.55);'
    + '-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);'
    + '-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;'
    + '-webkit-user-select:none;user-select:none;touch-action:manipulation}'
    + '#h53idx:active{color:#fff;border-color:rgba(255,95,200,.75);background:rgba(10,14,20,.96)}'
    + '#h53idx b{font-weight:400;opacity:.55}';

  var st = document.createElement('style');
  st.id = 'h53idxcss';
  st.appendChild(document.createTextNode(CSS));
  (document.head || document.documentElement).appendChild(st);

  var A = document.createElement('a');
  A.id = 'h53idx';
  A.setAttribute('aria-label', 'registry');
  A.innerHTML = '<b>&#8592;</b>index';

  function url(){
    try { return new URL('index.html', location.href).href; }
    catch (e) { return 'index.html'; }
  }
  A.href = url();

  // 遷移：click が潰される環境でも touchend で確実に飛ばす
  var fired = 0;
  function go(e){
    var now = Date.now();
    if (now - fired < 700) { if (e && e.preventDefault) e.preventDefault(); return false; }
    fired = now;
    if (e){ if (e.preventDefault) e.preventDefault(); if (e.stopPropagation) e.stopPropagation(); }
    var u = url();
    try { location.assign(u); } catch (err) { location.href = u; }
    return false;
  }
  function eat(e){ if (e && e.stopPropagation) e.stopPropagation(); }
  A.addEventListener('click', go, false);
  try { A.addEventListener('touchend', go, { passive: false }); }
  catch (e) { A.addEventListener('touchend', go, false); }
  try { A.addEventListener('touchstart', eat, { passive: true }); }
  catch (e) { A.addEventListener('touchstart', eat, false); }
  A.addEventListener('pointerdown', eat, false);
  A.addEventListener('mousedown', eat, false);

  function attach(){
    if (document.body && A.parentNode !== document.body) document.body.appendChild(A);
  }
  attach();

  // セーフエリアの実寸を測る
  var safe = { t: 0, r: 0, b: 0, l: 0 };
  function measureSafe(){
    if (!document.body) return;
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'
      + 'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);'
      + 'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
    document.body.appendChild(p);
    var cs = window.getComputedStyle(p);
    safe.t = parseFloat(cs.paddingTop) || 0;
    safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0;
    safe.l = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(p);
  }

  // 画面上で実際に「何かが描かれている」要素の矩形を集める
  function occupied(){
    var out = [], i, j, el, cs, r, ch, ink, bg;
    if (!document.body) return out;
    var all = document.body.querySelectorAll('*');
    for (i = 0; i < all.length; i++){
      el = all[i];
      if (el === A || el === st) continue;
      var tn = el.tagName;
      if (tn === 'CANVAS' || tn === 'SCRIPT' || tn === 'STYLE' || tn === 'LINK') continue;
      cs = window.getComputedStyle(el);
      if (!cs || cs.display === 'none' || cs.visibility === 'hidden') continue;
      if ((parseFloat(cs.opacity) || 1) < 0.06) continue;
      r = el.getBoundingClientRect();
      if (r.width < 6 || r.height < 6) continue;
      if (r.right < 0 || r.bottom < 0 || r.left > innerWidth || r.top > innerHeight) continue;
      // 全画面の器は避けたい対象ではない
      if (r.width > innerWidth * 0.94 && r.height > innerHeight * 0.90) continue;
      ink = false;
      ch = el.childNodes;
      for (j = 0; j < ch.length; j++){
        if (ch[j].nodeType === 3 && ch[j].nodeValue && ch[j].nodeValue.replace(/\s+/g,'')) { ink = true; break; }
      }
      if (!ink){
        bg = cs.backgroundColor || '';
        if (bg && bg.indexOf('rgba(0, 0, 0, 0)') < 0 && bg !== 'transparent') ink = true;
        if (!ink && (parseFloat(cs.borderTopWidth) || 0) > 0) ink = true;
        if (!ink && (parseFloat(cs.borderBottomWidth) || 0) > 0) ink = true;
        if (!ink && tn === 'IMG') ink = true;
      }
      if (!ink) continue;
      out.push(r);
    }
    return out;
  }

  function overlapArea(x, y, w, h, rs){
    var s = 0, i, r, ow, oh;
    for (i = 0; i < rs.length; i++){
      r = rs[i];
      ow = Math.min(x + w, r.right) - Math.max(x, r.left);
      oh = Math.min(y + h, r.bottom) - Math.max(y, r.top);
      if (ow > 0 && oh > 0) s += ow * oh;
    }
    return s;
  }

  function place(){
    attach();
    if (!document.body) return;
    measureSafe();
    A.style.left = ''; A.style.right = ''; A.style.top = ''; A.style.bottom = '';
    A.style.top = '-999px'; A.style.left = '0px';
    var w = A.offsetWidth || 76, h = A.offsetHeight || 30;
    var rs = occupied();
    // 隅は 右上 → 左上 → 右下 → 左下 の順に選好。各隅で縦に4段まで逃がす
    var best = null, corner, step, x, y, s, pref;
    for (corner = 0; corner < 4; corner++){
      for (step = 0; step < 4; step++){
        x = (corner % 2 === 0) ? (innerWidth - PAD - safe.r - w) : (PAD + safe.l);
        y = (corner < 2) ? (PAD + safe.t + step * (h + 8))
                         : (innerHeight - PAD - safe.b - h - step * (h + 8));
        if (y < 0 || y + h > innerHeight) continue;
        s = overlapArea(x, y, w, h, rs);
        pref = corner * 3 + step;                 // 面積が同点なら選好順
        if (!best || s < best.s - 0.5 || (Math.abs(s - best.s) <= 0.5 && pref < best.pref)){
          best = { x: x, y: y, s: s, pref: pref, corner: corner };
        }
        if (s === 0 && step === 0 && corner === 0) { best = { x: x, y: y, s: 0, pref: 0, corner: 0 }; corner = 9; break; }
      }
    }
    if (!best) best = { x: innerWidth - PAD - w, y: PAD, corner: 0 };
    if (best.corner < 2){ A.style.top = best.y + 'px'; A.style.bottom = ''; }
    else { A.style.bottom = (innerHeight - best.y - h) + 'px'; A.style.top = ''; }
    if (best.corner % 2 === 0){ A.style.right = (PAD + safe.r) + 'px'; A.style.left = ''; }
    else { A.style.left = (PAD + safe.l) + 'px'; A.style.right = ''; }
  }

  function boot(){ place(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  addEventListener('load', place);
  addEventListener('resize', place);
  addEventListener('orientationchange', function(){ setTimeout(place, 220); });
  setTimeout(place, 400);
  setTimeout(place, 1400);
  setTimeout(place, 3600);
})();
</script>

for(var i=0;i<img.data.length;i+=4){var v=(Math.random()*255)|0;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;}

grainPat=ctx.createPattern(g,'repeat');
}

function buildAtlas(){
var pad=2;
atlasCell=Math.ceil((fontPx+pad*2)*dpr);
atlas=document.createElement('canvas');
atlas.width=atlasCell*CHARS.length;
atlas.height=atlasCell*COLORS.length;
var g=atlas.getContext('2d');
g.clearRect(0,0,atlas.width,atlas.height);
g.textAlign='center';
g.textBaseline='middle';
g.font='700 '+Math.round(fontPx*dpr)+'px "Courier New","Hiragino Kaku Gothic ProN","Yu Gothic",Osaka-mono,monospace';
for(var v=0;v<COLORS.length;v++){
g.fillStyle=COLORS[v];
for(var i=0;i<CHARS.length;i++){
var cx=i*atlasCell+atlasCell*0.5,cy=v*atlasCell+atlasCell*0.5;
g.fillText(CHARS[i],cx,cy);
if(v===V_WHITE){g.fillText(CHARS[i],cx,cy);}
}
}
}

function drawCell(g,i,variant,alpha){
var c=i%cols,r=(i-c)/cols;
var dS=atlasCell/dpr;
var dx=c*cell+cell*0.5-dS*0.5;
var dy=r*cell+cell*0.5-dS*0.5;
g.globalAlpha=alpha;
g.drawImage(atlas,cellChar[i]*atlasCell,variant*atlasCell,atlasCell,atlasCell,dx,dy,dS,dS);
g.globalAlpha=1;
}

function renderStaticCell(i){
var c=i%cols,r=(i-c)/cols;
ctxStatic.clearRect(c*cell,r*cell,cell,cell);
drawCell(ctxStatic,i,cellColor[i],ambA[i]);
}

function paintFigCell(i){
var c=i%cols,r=(i-c)/cols;
var cl=figCl[i],L=figL[i];
var g=(cl===CLS_EMB)?ctxEmb:ctxFig;
g.clearRect(c*cell,r*cell,cell,cell);
if(cl===CLS_EMB){
drawCell(g,i,V_EMBER,0.50+0.50*L);
drawCell(g,i,V_EMBER,0.42+0.42*L);
}else{
drawCell(g,i,CLS2VAR[cl],FA0+FA1*L);
if(L>WTHR){drawCell(g,i,V_WHITE,Math.min(1,(L-WTHR)*WMUL));}
}
figOn[i]=1;
}

function clearFigCell(i){
var c=i%cols,r=(i-c)/cols;
var g=(figCl[i]===CLS_EMB)?ctxEmb:ctxFig;
g.clearRect(c*cell,r*cell,cell,cell);
figOn[i]=0;
}

function writeChar(i,chI,colr){
cellChar[i]=chI;
if(colr!==undefined){cellColor[i]=colr;}
renderStaticCell(i);
if(figOn[i]){paintFigCell(i);}
}

function fitFigure(){
var ar=FIG_W/FIG_H;
var mw=W*0.92,mh=H*0.80;
figW=mw;figH=figW/ar;
if(figH>mh){figH=mh;figW=figH*ar;}
figX=(W-figW)*0.5;
figY=H*ANCHOR-figH*0.5;
}

function buildFigureMap(){
fitFigure();
var i,r,c;
for(i=0;i<nCells;i++){figCl[i]=CLS_BG;figL[i]=0;figThr[i]=2;figOn[i]=0;}
var list=[],emb=[];
for(r=0;r<rows;r++){
for(c=0;c<cols;c++){
var px=c*cell+cell*0.5,py=r*cell+cell*0.5;
var u=(px-figX)/figW,v=(py-figY)/figH;
if(u<0||u>=1||v<0||v>=1)continue;
var sumL=0,hits=0,cnt=[0,0,0,0];
for(var sy=-1;sy<=1;sy+=2){
for(var sx=-1;sx<=1;sx+=2){
var uu=u+sx*0.25*cell/figW,vv=v+sy*0.25*cell/figH;
if(uu<0)uu=0;if(uu>0.9999)uu=0.9999;
if(vv<0)vv=0;if(vv>0.9999)vv=0.9999;
var b=figData[((vv*FIG_H)|0)*FIG_W+((uu*FIG_W)|0)];
var cls=b>>5;
if(cls===CLS_BG)continue;
sumL+=(b&31);hits++;cnt[cls]++;
}
}
if(hits===0)continue;
var best=0;
if(cnt[1]>cnt[best])best=1;
if(cnt[2]>cnt[best])best=2;
if(cnt[CLS_EMB]>0)best=CLS_EMB;
var Ln=(sumL/hits)/31;
if(Ln<0.03)continue;
var idx=r*cols+c;
figCl[idx]=best;
figL[idx]=Ln;
list.push(idx);
if(best===CLS_EMB){emb.push(idx);}
}
}
for(i=0;i<list.length;i++){
var id=list[i];
var th=0.72*Math.random()+0.28*(1-figL[id]);
if(figCl[id]===CLS_EMB){th*=0.55;}
if(th<0)th=0;if(th>1)th=1;
figThr[id]=th;
}
list.sort(function(a,b2){return figThr[a]-figThr[b2];});
figOrder=list;
embList=emb;
cursor=0;
drips=[];
dripAcc=0;
}

function newStream(c,init){
var s={c:c,head:0,speed:12,word:WORDS[0],wi:0,color:0,last:0,prevIdx:-1};
resetStream(s,init);
return s;
}
function resetStream(s,init){
s.word=WORDS[(Math.random()*WORDS.length)|0];
s.wi=(Math.random()*s.word.length)|0;
var wr=Math.random();
s.color=(wr<0.40)?0:((wr<0.70)?1:2);
s.speed=8+Math.random()*12;
s.head=init?(Math.random()*rows):(-2-Math.random()*rows*0.6);
s.last=Math.floor(s.head)-1;
s.prevIdx=-1;
}
function updateStream(s,dt){
s.head+=s.speed*dt;
var fh=Math.floor(s.head);
while(s.last<fh){
s.last++;
var r=s.last;
var ch=s.word.charAt(((s.wi%s.word.length)+s.word.length)%s.word.length);
s.wi++;
if(r<0||r>=rows){
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);s.prevIdx=-1;}
continue;
}
if(ch===' '){
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);s.prevIdx=-1;}
continue;
}
var i=r*cols+s.c;
writeChar(i,charIdx[ch],s.color);
if(s.prevIdx>=0){drawCell(ctxRain,s.prevIdx,cellColor[s.prevIdx],1);}
drawCell(ctxRain,i,V_WHITE,1);
s.prevIdx=i;
}
if(s.head>rows+3){resetStream(s,false);}
}

function spawnDrip(){
if(!embList||embList.length===0)return;
if(drips.length>7)return;
var id=embList[(Math.random()*embList.length)|0];
var c=id%cols,r=(id-c)/cols;
drips.push({c:c,y:r,last:r,sp:19+Math.random()*23});
}

function updateDrips(dt){
var k,d;
if(gAlpha>0.45){
dripAcc+=dt*(2.6+6.4*pumpBeat(t));
while(dripAcc>=1){dripAcc-=1;spawnDrip();}
}else{
dripAcc=0;
}
for(k=drips.length-1;k>=0;k--){
d=drips[k];
d.y+=d.sp*dt;
var fy=Math.floor(d.y);
while(d.last<fy){
d.last++;
if(d.last<0||d.last>=rows)continue;
var i=d.last*cols+d.c;
writeChar(i,(Math.random()*CHARS.length)|0);
drawCell(ctxRain,i,V_EMBER,0.95);
}
if(d.last>=rows||d.y>rows+1){drips.splice(k,1);}
}
}

function prefill(){
for(var c=0;c<cols;c++){
var w=streams[c].word;
var off=(Math.random()*w.length)|0;
for(var r=0;r<rows;r++){
var ch=w.charAt((off+r)%w.length);
var chI=(ch===' ')?((Math.random()*CHARS.length)|0):charIdx[ch];
writeChar(r*cols+c,chI,streams[c].color);
}
}
}

function mkLayer(){
var l=document.createElement('canvas');
l.width=Math.max(2,Math.round(W*dpr));
l.height=Math.max(2,Math.round(H*dpr));
var g=l.getContext('2d');
g.setTransform(dpr,0,0,dpr,0,0);
return {cv:l,g:g};
}

function rebuild(){
dpr=Math.min(window.devicePixelRatio||1,1.5);
W=window.innerWidth;H=window.innerHeight;
cv.width=Math.round(W*dpr);
cv.height=Math.round(H*dpr);
cv.style.width=W+'px';
cv.style.height=H+'px';
cell=Math.max(6.2,Math.min(11,W/50));
fontPx=Math.max(5,Math.round(cell*0.92));
cols=Math.max(8,Math.floor(W/cell));
rows=Math.max(12,Math.ceil(H/cell)+1);
nCells=cols*rows;
buildAtlas();
var i;
cellChar=new Uint16Array(nCells);
cellColor=new Uint8Array(nCells);
ambA=new Float32Array(nCells);
for(i=0;i<nCells;i++){ambA[i]=0.18+0.55*Math.pow(Math.random(),2.3);}
figCl=new Uint8Array(nCells);
figL=new Float32Array(nCells);
figThr=new Float32Array(nCells);
figOn=new Uint8Array(nCells);
var ls=mkLayer();layStatic=ls.cv;ctxStatic=ls.g;
var lr=mkLayer();layRain=lr.cv;ctxRain=lr.g;
ctxRain.globalCompositeOperation='source-over';
ctxRain.fillStyle='#000000';
ctxRain.fillRect(0,0,W,H);
var lf=mkLayer();layFig=lf.cv;ctxFig=lf.g;
var le=mkLayer();layEmb=le.cv;ctxEmb=le.g;
streams=[];
for(i=0;i<cols;i++){streams.push(newStream(i,true));}
buildFigureMap();
prefill();
vignette=ctx.createRadialGradient(W*0.5,H*ANCHOR,Math.min(W,H)*0.26,W*0.5,H*0.52,Math.max(W,H)*0.74);
vignette.addColorStop(0,'rgba(0,0,0,0)');
vignette.addColorStop(1,'rgba(0,0,0,0.58)');
}

function smooth01(x){if(x<0)x=0;if(x>1)x=1;return x*x*(3-2*x);}

function envelope(){
if(t>=autoNext){revealStart=t;autoNext=t+CYCLE;}
var u=t-revealStart;
if(u<0||u>P_HOLD+P_OUT){gPhase=0;gAlpha=0;return;}
if(u<P_IN){gPhase=smooth01(u/P_IN);gAlpha=smooth01(u/(P_IN*0.40));return;}
if(u<P_HOLD){gPhase=1;gAlpha=1;return;}
gPhase=1;gAlpha=1-smooth01((u-P_HOLD)/P_OUT);
}

function syncFig(){
var n=figOrder.length,i;
if(gPhase<=0){
if(cursor>0){
ctxFig.clearRect(0,0,W,H);
ctxEmb.clearRect(0,0,W,H);
for(i=0;i<cursor;i++){figOn[figOrder[i]]=0;}
cursor=0;
}
return;
}
while(cursor<n&&figThr[figOrder[cursor]]<=gPhase){paintFigCell(figOrder[cursor]);cursor++;}
while(cursor>0&&figThr[figOrder[cursor-1]]>gPhase){cursor--;clearFigCell(figOrder[cursor]);}
}

function drawFront(){
if(gPhase<=0.002||gPhase>=0.999||cursor<=0)return;
var K=72;
var s=cursor-K;if(s<0)s=0;
for(var i=s;i<cursor;i++){
var id=figOrder[i];
var a=0.26+0.66*((i-s)/Math.max(1,cursor-s));
drawCell(ctx,id,V_WHITE,a*gAlpha);
}
}

function summon(){
var u=t-revealStart;
if(u<0||u>2.4){revealStart=t;autoNext=t+CYCLE;}
else{for(var k=0;k<3;k++){spawnDrip();}}
if(!tapped){tapped=true;hintEl.style.opacity='0';}
}

function frame(){
var nowS=performance.now()*0.001;
if(last<0)last=nowS;
var dt=nowS-last;
last=nowS;
if(dt>0.05)dt=0.05;
if(dt<0)dt=0;
t+=dt;
envelope();
ctxRain.globalCompositeOperation='source-over';
var fa=1-Math.pow(0.958,dt*60);
ctxRain.fillStyle='rgba(0,0,0,'+fa.toFixed(4)+')';
ctxRain.fillRect(0,0,W,H);
var s;
for(s=0;s<streams.length;s++){updateStream(streams[s],dt);}
updateDrips(dt);
var muts=Math.max(6,(nCells*0.0040)|0);
for(var m=0;m<muts;m++){
var mi=(Math.random()*nCells)|0;
writeChar(mi,(Math.random()*CHARS.length)|0);
}
if(embList&&embList.length&&gAlpha>0.3){
for(var e=0;e<2;e++){
var ei=embList[(Math.random()*embList.length)|0];
writeChar(ei,(Math.random()*CHARS.length)|0);
}
}
syncFig();
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
ctx.fillStyle='#000000';
ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
ctx.globalAlpha=0.09+0.17*gAlpha;
ctx.drawImage(layStatic,0,0,layStatic.width,layStatic.height,0,0,W,H);
ctx.globalAlpha=1-0.36*gAlpha;
ctx.drawImage(layRain,0,0,layRain.width,layRain.height,0,0,W,H);
if(gAlpha>0.012){
ctx.globalAlpha=Math.min(1,gAlpha*(0.86+0.14*pumpBeat(t)));
ctx.drawImage(layFig,0,0,layFig.width,layFig.height,0,0,W,H);
ctx.globalAlpha=Math.min(1,gAlpha*(0.66+0.34*pumpBeat(t)));
ctx.drawImage(layEmb,0,0,layEmb.width,layEmb.height,0,0,W,H);
}
ctx.globalAlpha=1;
drawFront();
ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
if(grainPat){
ctx.globalAlpha=0.055;
var gx=(Math.random()*96)|0,gy=(Math.random()*96)|0;
ctx.save();
ctx.translate(-gx,-gy);
ctx.fillStyle=grainPat;
ctx.fillRect(0,0,W+96,H+96);
ctx.restore();
}
ctx.globalAlpha=1;
ctx.fillStyle=vignette;
ctx.fillRect(0,0,W,H);
requestAnimationFrame(frame);
}

var rsTimer=null;
window.addEventListener('resize',function(){
if(rsTimer){clearTimeout(rsTimer);}
rsTimer=setTimeout(rebuild,160);
});
window.addEventListener('touchstart',function(e){e.preventDefault();summon();},{passive:false});
window.addEventListener('mousedown',function(){summon();});
document.addEventListener('visibilitychange',function(){last=-1;});

rebuild();
buildGrain();
requestAnimationFrame(frame);
})();

</script>

  window.addEventListener('DOMContentLoaded', function(){
    var c=document.getElementById('cv'); if(!c) return;
    c.addEventListener('contextlost', function(e){ e.preventDefault(); }, false);
    c.addEventListener('contextrestored', function(){ location.reload(); }, false);
  });
})();
</script>
